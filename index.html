<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#080808">
<title>Deehan Training — Week by Week</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --red:#8B1A1A; --redL:#c97070; --redBg:#1a0d0d;
    --navy:#1F3864; --navyL:#7090c9; --navyBg:#0d1320;
    --trav:#6d28d9; --travL:#a78bfa; --travBg:#160d24;
    --green:#16a34a; --greenL:#4ade80; --greenBg:#0a1f14;
    --bg:#080808; --card:#0f0f0f; --line:#2a2a2a;
    --txt:#f0f0f0; --dim:#a8a8a8; --dimmer:#8a8a8a;
    --mono:'Courier New',monospace;
  }
  body { background:var(--bg); color:var(--txt); font-family:'Georgia',serif; padding-bottom:78px; min-height:100vh; }
  .wrap { max-width:580px; margin:0 auto; padding:1rem; }

  .hero { padding:1.4rem 1rem 1rem; border-bottom:1px solid var(--line); }
  .hero .name { font-size:10px; color:var(--dim); letter-spacing:0.18em; text-transform:uppercase; font-family:var(--mono); margin-bottom:4px; }
  .hero h1 { font-size:26px; font-weight:700; color:#fff; letter-spacing:-0.02em; }
  .hero h1 span { color:var(--red); }
  .hero .sub { font-size:12px; color:var(--dim); font-family:var(--mono); margin-top:4px; }

  /* Week navigation */
  .weeknav { display:flex; align-items:center; gap:10px; margin-bottom:1rem; }
  .weeknav button {
    background:var(--card); border:1px solid var(--line); color:#e0e0e0;
    border-radius:8px; padding:10px 16px; font-size:18px; cursor:pointer;
    font-family:var(--mono); line-height:1;
  }
  .weeknav button:active { background:#1a1a1a; }
  .weeknav .wkinfo { flex:1; text-align:center; }
  .weeknav .wknum { font-size:18px; font-weight:700; color:#fff; }
  .weeknav .wkmeta { font-size:11px; color:var(--dim); font-family:var(--mono); margin-top:2px; }

  .weekpicker { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:1rem; justify-content:center; }
  .wkdot {
    width:30px; height:30px; border-radius:6px; border:1px solid var(--line);
    background:var(--card); color:#c0c0c0; font-size:11px; font-family:var(--mono);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .wkdot.str.on { background:var(--red); color:#fff; border-color:var(--red); }
  .wkdot.hyp.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .wkdot.trav.on { background:var(--trav); color:#fff; border-color:var(--trav); }
  .wkdot.trav { border-color:#3a2560; color:var(--travL); }
  .wkdot.thisweek { box-shadow:0 0 0 1.5px var(--redL); }
  .wkdot.logged::after { content:'·'; position:absolute; margin-top:-18px; margin-left:0; color:var(--greenL); font-size:20px; }

  /* Phase banner */
  .pbanner { border-radius:8px; padding:0.7rem 1rem; margin-bottom:1rem; font-size:12px; line-height:1.5; }
  .pbanner.str { background:var(--redBg); border-left:3px solid var(--red); color:#d8b0b0; }
  .pbanner.hyp { background:var(--navyBg); border-left:3px solid var(--navy); color:#aac0e0; }
  .pbanner.trav { background:var(--travBg); border-left:3px solid var(--trav); color:#c4b0e0; }
  .pbanner b { color:#fff; }
  .goalbanner { background:linear-gradient(135deg,var(--redBg),#1a0d0d); border:1px solid var(--red); border-radius:10px; padding:14px 1rem; margin-bottom:1rem; text-align:center; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  .goalbanner .gbgoal { font-family:var(--mono); font-weight:700; font-size:14px; color:#fff; letter-spacing:0.03em; }
  .goalbanner .gbsep { color:var(--redL); font-size:16px; }
  .goalbanner .gbname { font-family:var(--mono); font-weight:700; font-size:13px; color:var(--redL); letter-spacing:0.04em; }
  .pbanner .focus { font-family:var(--mono); font-weight:700; text-transform:uppercase; letter-spacing:0.08em; font-size:11px; }

  .weeknote { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:0.7rem 1rem; margin-bottom:1rem; font-size:12px; color:var(--redL); font-style:italic; line-height:1.5; }
  .weeknote.trav { color:var(--travL); }

  /* Day tabs with dates */
  .daytab .dtl { display:block; }
  .daytab .dtd { display:block; font-size:9px; opacity:0.55; font-weight:400; margin-top:1px; }
  .daytab.travday { border-color:#3a2560; }
  .daytab.offday { opacity:0.45; border-style:dashed; }
  .daytab.istoday { box-shadow:inset 0 0 0 1.5px var(--redL); }
  .daytab.istoday.on { box-shadow:none; }
  .todaybtn { width:100%; padding:9px; margin:-6px 0 12px; border-radius:8px; border:1px solid var(--red); background:var(--redBg); color:var(--redL); font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; letter-spacing:0.04em; }
  .todaybtn:active { background:var(--red); color:#fff; }

  /* ── Edit mode ── */
  .editbtn { width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--dim); font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; letter-spacing:0.04em; }
  .editbtn.on { background:var(--red); color:#fff; border-color:var(--red); }
  .editbtn .cdot { color:var(--redL); font-size:16px; }
  .edithint { font-size:11px; color:var(--dim); background:var(--card); border-left:3px solid var(--red); border-radius:6px; padding:8px 10px; margin-bottom:10px; line-height:1.5; }
  .edithint b { color:var(--redL); }
  .ex.editrow { background:#131313; }
  .editbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
  .etype { font-size:9px; color:var(--dim); font-family:var(--mono); letter-spacing:0.08em; font-weight:700; }
  .ebtns button { background:#222; border:1px solid var(--line); color:#ddd; border-radius:5px; width:30px; height:28px; font-size:13px; cursor:pointer; margin-left:4px; }
  .ebtns button.del { color:var(--redL); border-color:#4a1f1f; }
  .einput { width:100%; padding:8px 10px; margin-bottom:6px; background:#1c1c1c; border:1px solid var(--line); border-radius:6px; color:#f0f0f0; font-size:14px; font-family:'Georgia',serif; }
  .einput.bold { font-weight:700; }
  .einput:focus { outline:none; border-color:var(--red); }
  .eopts { display:flex; gap:12px; align-items:center; margin-top:4px; }
  .eopts label { font-size:11px; color:var(--dim); font-family:var(--mono); display:flex; align-items:center; gap:6px; }
  .eopts input[type=number] { width:52px; padding:5px; background:#1c1c1c; border:1px solid var(--line); border-radius:5px; color:#fff; font-family:var(--mono); text-align:center; font-size:13px; }
  .eopts .chk { cursor:pointer; user-select:none; padding:5px 8px; border:1px solid var(--line); border-radius:5px; }
  .eopts .chk.on { color:var(--greenL); border-color:var(--green); }
  .editactions { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:12px; }
  .editactions button { padding:11px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:#e0e0e0; font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; }
  .editactions button.warn { color:var(--redL); border-color:#4a1f1f; }
  .editactions button.apply { color:#fff; background:var(--green); border-color:var(--green); grid-column:1 / -1; }
  .applyhint { font-size:11px; color:var(--dim); background:var(--card); border-left:3px solid var(--green); border-radius:6px; padding:8px 10px; margin-top:8px; line-height:1.5; }
  .applyhint b { color:var(--greenL); }
  .weeknote.edit { border-left:3px solid var(--red); }
  .elabel { display:block; font-size:9px; color:var(--dim); font-family:var(--mono); letter-spacing:0.08em; margin-bottom:5px; font-weight:700; }
  .enote { width:100%; min-height:56px; background:#1c1c1c; border:1px solid var(--line); border-radius:6px; color:#f0f0f0; font-family:'Georgia',serif; font-size:13px; padding:8px; resize:vertical; }
  .enote:focus { outline:none; border-color:var(--red); }
  .ehead-tag { width:100%; background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.25); border-radius:5px; color:#fff; font-family:var(--mono); font-size:11px; padding:5px 7px; margin-bottom:5px; }
  .ehead-title { width:100%; background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.25); border-radius:5px; color:#fff; font-size:17px; font-weight:700; padding:6px 7px; font-family:'Georgia',serif; }
  .ehead-tag:focus,.ehead-title:focus { outline:none; border-color:#fff; }

  /* Selected day date header */
  .datehead { text-align:center; font-size:13px; font-weight:700; color:var(--redL); font-family:var(--mono); letter-spacing:0.06em; margin:-4px 0 10px; }

  /* Off day */
  .pbanner.off { background:#1a1a1a; border-left:3px solid #777; color:#c0c0c0; }
  .shead.off { background:linear-gradient(135deg,#2a2a2a,#1a1a1a); }

  /* Day tabs */
  .daytabs { display:flex; gap:5px; margin-bottom:1rem; flex-wrap:wrap; }
  .daytab {
    flex:1; min-width:60px; padding:9px 4px; border-radius:7px; border:1px solid var(--line);
    background:var(--card); color:#c0c0c0; font-family:var(--mono); font-size:12px;
    font-weight:700; cursor:pointer; text-align:center;
  }
  .daytab.on { background:#fff; color:#000; border-color:#fff; }
  .daytab.logged { border-color:var(--green); }

  /* Session */
  .shead { border-radius:10px 10px 0 0; padding:0.85rem 1rem; color:#fff; }
  .shead.str { background:linear-gradient(135deg,var(--red),#6b1414); }
  .shead.hyp { background:linear-gradient(135deg,var(--navy),#142847); }
  .shead.trav { background:linear-gradient(135deg,var(--trav),#4c1d95); }
  .shead .stag { font-size:10px; opacity:0.7; font-family:var(--mono); text-transform:uppercase; letter-spacing:0.1em; }
  .shead .stitle { font-size:18px; font-weight:700; margin-top:2px; }

  .ex { background:var(--card); border:1px solid var(--line); border-top:none; }
  .exdiv { background:var(--redBg); color:#fff; padding:13px 1rem; font-size:15px; font-weight:700; letter-spacing:0.06em; font-family:var(--mono); text-transform:uppercase; text-align:center; border-top:1px solid var(--red); border-bottom:1px solid var(--line); margin-top:10px; border-radius:8px 8px 0 0; }
  .exdiv.hyp { background:var(--navyBg); color:#fff; border-top-color:var(--navy); }
  .exrow { padding:0.75rem 1rem; border-bottom:1px solid var(--line); }
  .exname { font-size:14px; font-weight:700; color:#fff; }
  .exrx { font-size:11px; color:var(--redL); font-family:var(--mono); margin-top:2px; }
  .setgrid { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .setbox { display:flex; flex-direction:column; align-items:center; }
  .setbox .setnum { font-size:10px; color:var(--dim); font-family:var(--mono); margin-bottom:3px; font-weight:700; letter-spacing:0.05em; }
  .setbox .field { display:flex; flex-direction:column; gap:4px; }
  .setbox .flabel { font-size:9px; color:var(--dim); font-family:var(--mono); text-align:center; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:-2px; }
  .setbox input { width:52px; padding:7px 4px; text-align:center; background:#1a1a1a; border:1px solid var(--line); border-radius:5px; color:#fff; font-size:15px; font-family:var(--mono); }
  .setbox input:focus { outline:none; border-color:var(--red); background:#222; }
  .setbox.pr input.wt { border-color:var(--green); }
  .setbox .lrpair { display:flex; gap:4px; }
  .setbox .lrcol { display:flex; flex-direction:column; align-items:center; }
  .setbox .lrcol input { width:36px; }
  .setbox.lr { background:rgba(74,222,128,0.03); border-radius:6px; padding:4px; }
  .prbadge { font-size:9px; color:var(--green); font-family:var(--mono); margin-top:6px; height:11px; }

  /* Collapsible notes */
  .notes-wrap { background:var(--card); border:1px solid var(--line); border-top:none; border-radius:0 0 10px 10px; }
  .notes-toggle {
    width:100%; padding:0.85rem 1rem; background:none; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    color:#d0d0d0; font-family:var(--mono); font-size:12px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.06em;
  }
  .notes-toggle .arrow { transition:transform 0.2s; color:var(--dim); }
  .notes-toggle.open .arrow { transform:rotate(90deg); }
  .notes-body { max-height:0; overflow:hidden; transition:max-height 0.25s ease; }
  .notes-body.open { max-height:400px; }
  .notes-body textarea {
    width:100%; min-height:120px; background:#1a1a1a; border:1px solid var(--line);
    border-radius:8px; color:#fff; font-family:'Georgia',serif; font-size:14px;
    padding:10px; margin:0 0 1rem; line-height:1.5; resize:vertical;
  }
  .notes-body textarea:focus { outline:none; border-color:var(--red); }
  .notes-inner { padding:0 1rem; }
  .notes-prompt { font-size:11px; color:var(--dim); margin-bottom:8px; font-style:italic; }

  .complete-btn { width:100%; padding:14px; margin-top:12px; border:none; border-radius:10px; font-size:14px; font-weight:700; font-family:var(--mono); cursor:pointer; background:var(--card); color:var(--redL); border:1px solid var(--line); text-transform:uppercase; letter-spacing:0.06em; }
  .complete-btn.done { background:var(--green); color:#fff; border-color:var(--green); }
  .cardio-wrap { margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:0.75rem 1rem; }
  .cardio-title { font-size:10px; color:var(--greenL); font-family:var(--mono); font-weight:700; letter-spacing:0.1em; margin-bottom:8px; }
  .cardio-row { display:flex; align-items:center; gap:10px; padding:8px 0; cursor:pointer; border-top:1px solid var(--line); }
  .cardio-row:first-of-type { border-top:none; }
  .cardio-box { width:24px; height:24px; border-radius:6px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--greenL); font-weight:700; font-size:15px; flex-shrink:0; }
  .cardio-row.done .cardio-box { background:var(--greenBg); border-color:var(--green); }
  .cardio-label { font-size:13px; color:#e0e0e0; }
  .cardio-row.done .cardio-label { color:var(--greenL); }
  .cardio-row.min { justify-content:space-between; align-items:center; }
  .cardio-row.min .cardio-label { flex:1; }
  .minbox { display:flex; align-items:center; gap:5px; flex-shrink:0; }
  .minbox input { width:52px; padding:7px 4px; text-align:center; background:#1a1a1a; border:1px solid var(--line); border-radius:6px; color:#fff; font-size:15px; font-family:var(--mono); }
  .minbox input:focus { outline:none; border-color:var(--green); }
  .cardio-row.min.done .minbox input { border-color:var(--green); color:var(--greenL); }
  .minlbl { font-size:10px; color:var(--dim); font-family:var(--mono); }
  .cardiototal { background:#0d0d0d; border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:10px; }
  .cardiototal.hit { border-color:var(--green); background:var(--greenBg); }
  .cthead { font-size:13px; color:#e0e0e0; font-family:var(--mono); font-weight:700; margin-bottom:7px; }
  .cthead .ctnum { color:var(--greenL); font-size:16px; }
  .ctbar { height:8px; background:#1c1c1c; border-radius:5px; overflow:hidden; }
  .ctbar-fill { height:100%; background:var(--green); border-radius:5px; transition:width 0.3s; }
  .ctcap { font-size:10px; color:var(--dim); font-family:var(--mono); margin-top:5px; text-align:right; }
  .cardiototal.hit .ctcap { color:var(--greenL); }
  .shead.cardioday { background:linear-gradient(135deg,#14331f,#0f2417); }
  .restday.cardio { border-left:3px solid var(--green); }
  .cardio-row.slot { justify-content:flex-start; }
  .cardio-row.slot .cardio-label { flex:1; cursor:pointer; }
  .slottime { display:inline-block; min-width:64px; color:var(--dim); font-family:var(--mono); font-size:11px; margin-right:6px; }
  .cardio-row.slot.done .slottime { color:var(--greenL); }
  .recbadge { font-size:9px; color:var(--travL); font-family:var(--mono); border:1px solid #3a2560; border-radius:4px; padding:1px 5px; margin-left:4px; }
  .slotdel { background:none; border:none; color:#6a2a2a; font-size:14px; cursor:pointer; padding:4px 6px; flex-shrink:0; }
  .slotdel:active { color:var(--redL); }
  .addslot { width:100%; margin-top:8px; padding:9px; border-radius:7px; border:1px dashed var(--line); background:transparent; color:var(--greenL); font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; }
  .addslot:active { background:var(--greenBg); }
  /* ── Cardio slot modal ── */
  .slotmodal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; }
  .slotmodal-bg.show { display:flex; }
  .slotmodal { background:#141414; border:1px solid var(--line); border-radius:14px; padding:18px; width:100%; max-width:380px; max-height:90vh; overflow-y:auto; }
  .smtitle { font-size:17px; font-weight:700; color:#fff; margin-bottom:14px; font-family:'Georgia',serif; }
  .smlabel { display:block; font-size:10px; color:var(--dim); font-family:var(--mono); letter-spacing:0.08em; font-weight:700; margin:12px 0 6px; text-transform:uppercase; }
  .sminput { width:100%; padding:11px; background:#1c1c1c; border:1px solid var(--line); border-radius:8px; color:#f0f0f0; font-size:15px; font-family:'Georgia',serif; }
  .sminput:focus { outline:none; border-color:var(--green); }
  .seg { display:flex; gap:6px; }
  .segbtn { flex:1; padding:11px 6px; background:#1c1c1c; border:1px solid var(--line); border-radius:8px; color:var(--dim); font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; }
  .segbtn.on { background:var(--green); color:#fff; border-color:var(--green); }
  .daybtns { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .daybtn { padding:9px 2px; background:#1c1c1c; border:1px solid var(--line); border-radius:7px; color:var(--dim); font-family:var(--mono); font-size:11px; font-weight:700; cursor:pointer; }
  .daybtn.on { background:var(--green); color:#fff; border-color:var(--green); }
  .smactions { display:flex; gap:8px; margin-top:18px; }
  .smcancel { flex:1; padding:12px; background:transparent; border:1px solid var(--line); border-radius:8px; color:var(--dim); font-family:var(--mono); font-size:13px; font-weight:700; cursor:pointer; }
  .smsave { flex:2; padding:12px; background:var(--green); border:none; border-radius:8px; color:#fff; font-family:var(--mono); font-size:13px; font-weight:700; cursor:pointer; }
  .smsave:active { opacity:0.85; }
  /* Category badges */
  .catbadge { font-size:9px; font-family:var(--mono); font-weight:700; padding:1px 6px; border-radius:4px; letter-spacing:0.03em; }
  .catbadge.neat { background:#1e3a5f; color:#7db3f0; }
  .catbadge.liss { background:#1a4231; color:#5fd39a; }
  .catbadge.miss { background:#3d3410; color:#e0c94e; }
  .catbadge.hiit { background:#4a2410; color:#f0a05f; }
  .catbadge.sit  { background:#4a1520; color:#f07090; }
  .hbpmbadge { font-size:9px; color:#f07090; font-family:var(--mono); }
  .opt { color:var(--dimmer); font-weight:400; text-transform:none; letter-spacing:0; }
  /* Category picker in modal */
  .catbtns { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
  .catbtn { padding:9px 2px; background:#1c1c1c; border:1px solid var(--line); border-radius:7px; color:var(--dim); font-family:var(--mono); font-size:10px; font-weight:700; cursor:pointer; }
  .catbtn.on { background:var(--green); color:#fff; border-color:var(--green); }
  .cathint { font-size:10px; color:var(--dim); margin-top:6px; line-height:1.5; }
  /* Metrics tab */
  .mheader { font-size:12px; color:var(--dim); font-family:var(--mono); text-align:center; margin-bottom:14px; letter-spacing:0.05em; }
  .mcard { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .mcard.hit { border-color:var(--green); }
  .mcard-h { font-size:13px; color:#fff; font-weight:700; font-family:var(--mono); display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .mcard-goal { font-size:10px; color:var(--dim); font-weight:400; }
  .mbig { font-size:28px; font-weight:700; font-family:var(--mono); color:#e8e8e8; margin-bottom:8px; }
  .mbig .g { color:var(--greenL); }

<script>
/* ─── WEEK SCHEDULE (21 weeks, Aug–Dec 2026) ──────────── */
const WEEKS = [
  {wk:1,start:"2026-08-10",dates:"Aug 10–16",focus:"strength",phase:1,note:""},
  {wk:2,start:"2026-08-17",dates:"Aug 17–23",focus:"hypertrophy",phase:1,note:""},
  {wk:3,start:"2026-08-24",dates:"Aug 24–30",focus:"strength",phase:1,note:""},
  {wk:4,start:"2026-08-31",dates:"Aug 31–Sep 6",focus:"hypertrophy",phase:1,note:""},
  {wk:5,start:"2026-09-07",dates:"Sep 7–13",focus:"strength",phase:1,note:""},
  {wk:6,start:"2026-09-14",dates:"Sep 14–20",focus:"hypertrophy",phase:1,note:""},
  {wk:7,start:"2026-09-21",dates:"Sep 21–27",focus:"strength",phase:1,note:""},
  {wk:8,start:"2026-09-28",dates:"Sep 28–Oct 4",focus:"hypertrophy",phase:1,note:"Phase 1 ends. Review progress."},
  {wk:9,start:"2026-10-05",dates:"Oct 5–11",focus:"strength",phase:2,note:"Phase 2 starts. RDL & Goblet: form focus."},
  {wk:10,start:"2026-10-12",dates:"Oct 12–18",focus:"hypertrophy",phase:2,note:""},
  {wk:11,start:"2026-10-19",dates:"Oct 19–25",focus:"strength",phase:2,note:""},
  {wk:12,start:"2026-10-26",dates:"Oct 26–Nov 1",focus:"hypertrophy",phase:2,note:""},
  {wk:13,start:"2026-11-02",dates:"Nov 2–8",focus:"strength",phase:2,note:""},
  {wk:14,start:"2026-11-09",dates:"Nov 9–15",focus:"hypertrophy",phase:2,note:""},
  {wk:15,start:"2026-11-16",dates:"Nov 16–22",focus:"strength",phase:2,note:""},
  {wk:16,start:"2026-11-23",dates:"Nov 23–29",focus:"hypertrophy",phase:2,note:"Phase 2 ends. Assess progress."},
  {wk:17,start:"2026-11-30",dates:"Nov 30–Dec 6",focus:"strength",phase:3,note:"Phase 3: full overload."},
  {wk:18,start:"2026-12-07",dates:"Dec 7–13",focus:"hypertrophy",phase:3,note:""},
  {wk:19,start:"2026-12-14",dates:"Dec 14–20",focus:"strength",phase:3,note:""},
  {wk:20,start:"2026-12-21",dates:"Dec 21–27",focus:"hypertrophy",phase:3,note:""},
  {wk:21,start:"2026-12-28",dates:"Dec 28–Jan 3",focus:"strength",phase:3,note:"Final week of the year. Full review."},
];

/* Resolve the effective focus for a given day (handles per-day overrides) */
const DAY_ORDER=["mon","tue","wed","thu","fri","sat","sun"];
function dayFocus(wkObj,dayKey){
  if(wkObj.override && wkObj.override[dayKey]) return wkObj.override[dayKey];
  return wkObj.focus;
}
/* Resolve the effective SESSION for a day (handles per-week session swaps).
   wkObj.sessions[dayKey] can force a session ("lowerA","upper","upperC","rest"). */
function daySession(wkObj,dayKey){
  if(wkObj.sessions && wkObj.sessions[dayKey]!==undefined) return wkObj.sessions[dayKey];
  const d=DAYS.find(x=>x.key===dayKey);
  return d?d.session:"rest";
}
/* A DAYS-like object for a day, respecting session overrides */
function dayInfo(wkObj,dayKey){
  const base=DAYS.find(d=>d.key===dayKey);
  const sess=daySession(wkObj,dayKey);
  if(sess===base.session) return base;
  // build an overridden copy
  const note = sess==="rest" ? (dayKey==="thu"?"Cycle only · Fast day":"Full rest") : base.note;
  return {key:dayKey,label:base.label,session:sess,note:note};
}
/* Real calendar date for a given week + day */
function dayDate(wkObj,dayKey){
  const idx=DAY_ORDER.indexOf(dayKey);
  const [y,m,d]=wkObj.start.split("-").map(Number);
  const dt=new Date(y,m-1,d+idx);
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return {
    short:`${MON[dt.getMonth()]} ${dt.getDate()}`,
    full:`${DOW[dt.getDay()]}, ${MON[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`,
    num:dt.getDate(),
  };
}

const PHASES = {
  1:{label:"Phase 1",health:"~353→321 lbs",lower:"Machines only — no RDL/Goblet",cardio:"1 hr · 130–150 bpm",fast:"24-hr weekly"},
  2:{label:"Phase 2",health:"~321→305 lbs",lower:"+RDL & Goblet Squat",cardio:"1 hr · 130–150 bpm",fast:"24-hr + optional 36-hr"},
  3:{label:"Phase 3",health:"~305→284 lbs",lower:"Full lower body — overload",cardio:"1 hr · 130–150 bpm",fast:"24-hr + 48-hr monthly"},
};
/* Goal banner shown at top of each training day, by phase */
const PHASE_GOAL = {
  1:{goal:"Goal 353 → 321 LBS", name:"Full Body Regiment"},
  2:{goal:"Goal 321 → 305 LBS", name:"Full Body Regiment"},
  3:{goal:"Goal 305 → 284 LBS", name:"Full Body Regiment"},
};

/* ─── EXERCISES ────────────────────────────────────────── */
/* flags: pr=track PR · lr=Left/Right inputs per set · fail=to failure */

// Shared ARM finisher (Upper weekdays) — all to failure, 3 sets each
const ARM_FINISHER=[
  {div:"ARM FINISHER · to failure"},
  {n:"Straight Bar Curl",rx:"3 sets · failure",sets:3,fail:true},
  {n:"Overhead Tricep Ext",rx:"3 sets · failure",sets:3,fail:true},
  {n:"Hammer Curl",rx:"3 sets · failure · per arm",sets:3,fail:true,lr:true},
  {n:"Tricep Pushdown",rx:"3 sets · failure",sets:3,fail:true},
  {n:"Concentration Curl",rx:"3 sets · failure · per arm",sets:3,fail:true,lr:true},
  {n:"DB Skull Crushers",rx:"3 sets · failure",sets:3,fail:true},
];
// Shared GRIP finisher (Lower days) — all to failure, 3 sets each, all L/R
const GRIP_FINISHER=[
  {div:"GRIP FINISHER · to failure"},
  {n:"Posterior Wrist Curl",rx:"3 sets · failure · per hand",sets:3,fail:true,lr:true},
  {n:"Anterior Wrist Raise",rx:"3 sets · failure · per hand",sets:3,fail:true,lr:true},
  {n:"Crusher",rx:"3 sets · failure · per hand",sets:3,fail:true,lr:true},
  {n:"Static Hold",rx:"3 sets · failure · per hand",sets:3,fail:true,lr:true},
];

/* ─── TRAVEL: structured 3-block day (Jul 18–25 spec) ──── */
// Same bodyweight block used AM and PM
const BW_BLOCK=[
  {n:"Push-Ups",rx:"5 sets × 10 reps",sets:5},
  {n:"Crunches",rx:"5 sets × 20 reps",sets:5},
  {n:"Squats",rx:"5 sets × 20 reps",sets:5},
  {n:"Plank",rx:"5 sets × 60 sec hold",sets:5},
];
// Walk blocks for the travel schedule
const TRAVEL_WALKS=[
  {id:"am1",   time:"6:00 AM",  label:"1 hr walk",            mins:60},
  {id:"amBW",  time:"6:00 AM",  label:"Bodyweight block",     bw:true},
  {id:"am2",   time:"~7:20 AM", label:"1 hr walk (finisher)", mins:60},
  {id:"pm1",   time:"1:00 PM",  label:"1 hr walk",            mins:60},
  {id:"pmBW",  time:"7:00 PM",  label:"Bodyweight block",     bw:true},
  {id:"pm2",   time:"~7:20 PM", label:"1 hr walk (finisher)", mins:60},

// ── UPPER (weekdays Mon/Wed) — ARMS finisher only ──
const UPPER_S=[
  {n:"Barbell Bench Press",rx:"5 sets · failure · HEAVY · use safety pins",sets:5,pr:true,fail:true},
  {n:"Barbell Row (Pendlay)",rx:"5 sets · failure · HEAVY",sets:5,pr:true,fail:true},
  {n:"Overhead Press",rx:"4 sets · failure · HEAVY · use safety pins",sets:4,pr:true,fail:true},
  {n:"Pull-Ups / Lat Pulldown",rx:"4 sets · failure · add weight",sets:4,pr:true,fail:true},

const UPPER_H=[
  {n:"Incline Dumbbell Press",rx:"4 sets · failure · 60s rest",sets:4,pr:true,fail:true},
  {n:"Cable Row",rx:"4 sets · failure · 60s rest",sets:4,pr:true,fail:true},
  {n:"Overhead Press (DB)",rx:"3 sets · failure · 60s rest",sets:3,pr:true,fail:true},

/* ─── EDITABLE PLAN LAYER ──────────────────────────────── */
/* state.plan[dayKey]  = custom exercise array (overrides default)
   state.titles[dayKey] = { title, tag }  custom session heading
   state.wknotes[wk]    = custom week note
   Falls back to built-in defaults when absent. */

function planKey(wk,day){ return `w${wk}_${day}`; }

/* Built-in default exercises for a given week+day */
function defaultExercises(wkObj,dayKey){
  const dayObj=dayInfo(wkObj,dayKey);
  const f=dayFocus(wkObj,dayKey);
  if(f==="off") return [];
  if(f==="travel") return BW_BLOCK;
  if(!dayObj || dayObj.session==="rest") return [];
  return getExercises(dayObj.session,wkObj.phase,f);
}

/* The exercises actually shown — custom if edited, else default */
function planExercises(wkObj,dayKey){
  const k=planKey(wkObj.wk,dayKey);
  if(state.plan && state.plan[k]) return state.plan[k];
  return defaultExercises(wkObj,dayKey);
}
/* Has this day been customised? */
function isCustom(wkObj,dayKey){
  return !!(state.plan && state.plan[planKey(wkObj.wk,dayKey)]);
}
/* Persist a day's exercise list (creates the override) */
function savePlan(wkObj,dayKey,list){
  if(!state.plan) state.plan={};
  state.plan[planKey(wkObj.wk,dayKey)]=list;
  save();
}
/* Revert a day back to the built-in default */
function resetDay(){
  const wkObj=curWeek();
  if(!confirm("Reset this day back to the original plan? Your logged sets stay, but custom exercises and headings are removed."))return;
  const k=planKey(wkObj.wk,state.day);
  if(state.plan) delete state.plan[k];
  if(state.titles) delete state.titles[k];
  save(); toast("Reset to default"); renderLog();
}

/* Custom headings */
function getTitle(wkObj,dayKey,defTitle,defTag){
  const k=planKey(wkObj.wk,dayKey);
  const t=(state.titles||{})[k]||{};
  return { title: t.title || defTitle, tag: t.tag || defTag };
}
function setTitle(field,val){
  const wkObj=curWeek();
  const k=planKey(wkObj.wk,state.day);
  if(!state.titles) state.titles={};
  if(!state.titles[k]) state.titles[k]={};
  state.titles[k][field]=val;
  save();
}
/* Week note override */
function getWeekNote(wkObj){
  const n=(state.wknotes||{})[wkObj.wk];
  return (n!==undefined)?n:wkObj.note;
}
function setWeekNote(val){
  const wkObj=curWeek();
  if(!state.wknotes) state.wknotes={};
  state.wknotes[wkObj.wk]=val;
  save();
}

/* ── Exercise CRUD (per day) ── */
function ensureCustom(){
  const wkObj=curWeek();
  const k=planKey(wkObj.wk,state.day);
  if(!state.plan) state.plan={};
  if(!state.plan[k]){
    // deep-copy the default so edits don't mutate the constants
    state.plan[k]=JSON.parse(JSON.stringify(defaultExercises(wkObj,state.day)));
  }
  return state.plan[k];
}
function addExercise(){
  const list=ensureCustom();
  list.push({n:"New Exercise",rx:"3 sets · failure",sets:3,fail:true});
  save(); renderLog();
  toast("Exercise added — tap ✎ to edit");
}
function addDivider(){
  const list=ensureCustom();
  list.push({div:"NEW BLOCK"});
  save(); renderLog();
}
function removeExercise(i){
  const list=ensureCustom();
  const name=list[i].div?list[i].div:list[i].n;
  if(!confirm(`Remove "${name}" from this day?`))return;
  list.splice(i,1);
  save(); renderLog(); toast("Removed");
}
function moveExercise(i,dir){
  const list=ensureCustom();
  const j=i+dir;
  if(j<0||j>=list.length)return;
  const tmp=list[i]; list[i]=list[j]; list[j]=tmp;
  save(); renderLog();
}
function updateExercise(i,field,val){
  const list=ensureCustom();
  if(field==="sets"){
    const n=Math.max(1,Math.min(10,parseInt(val)||1));
    list[i].sets=n;
  } else if(field==="lr"){
    list[i].lr=!list[i].lr;
  } else {
    list[i][field]=val;
  }
  save(); renderLog();
}
/* Copy this day's setup to other days */
function copyDayTo(){
  const wkObj=curWeek();
  const src=planExercises(wkObj,state.day);
  const input=prompt("Copy this day's exercises to which weeks? Enter week numbers separated by commas (e.g. 5,7,9), or 'all' for every week with the same weekday.");
  if(!input)return;
  let targets=[];
  if(input.trim().toLowerCase()==="all"){
    targets=WEEKS.map(w=>w.wk).filter(n=>n!==wkObj.wk);
  } else {
    targets=input.split(",").map(s=>parseInt(s.trim())).filter(n=>n>=1&&n<=WEEKS.length&&n!==wkObj.wk);
  }
  if(targets.length===0){ toast("No valid weeks"); return; }
  if(!state.plan) state.plan={};
  let n=0;
  targets.forEach(w=>{
    state.plan[planKey(w,state.day)]=JSON.parse(JSON.stringify(src));
    n++;
  });
  save(); toast(`Copied to ${n} week${n!==1?'s':''}`);
}

/* Apply this day's setup to ALL FUTURE days of the same session type.
   "Future" = date today or later. Past days are left untouched (non-retroactive). */
function countMatchingForward(){
  const wkObj=curWeek();
  const mySession=daySession(wkObj,state.day);
  const today=todayYMD();
  let count=0;
  WEEKS.forEach(w=>{
    DAY_ORDER.forEach(dk=>{
      // date of this candidate day
      const idx=DAY_ORDER.indexOf(dk);
      const [y,mm,dd]=w.start.split("-").map(Number);
      const dt=new Date(y,mm-1,dd+idx);
      const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      if(ds<today) return;                       // skip past — non-retroactive
      if(w.wk===wkObj.wk && dk===state.day) return; // skip the source day itself
      if(daySession(w,dk)===mySession) count++;
    });
  });
  return count;
}
function applyToMatchingForward(){
  const wkObj=curWeek();
  const mySession=daySession(wkObj,state.day);
  const src=planExercises(wkObj,state.day);
  const today=todayYMD();
  if(!state.plan) state.plan={};
  let n=0;
  WEEKS.forEach(w=>{
    DAY_ORDER.forEach(dk=>{
      const idx=DAY_ORDER.indexOf(dk);
      const [y,mm,dd]=w.start.split("-").map(Number);
      const dt=new Date(y,mm-1,dd+idx);
      const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      if(ds<today) return;
      if(w.wk===wkObj.wk && dk===state.day) return;
      if(daySession(w,dk)===mySession){
        state.plan[planKey(w.wk,dk)]=JSON.parse(JSON.stringify(src));
        n++;
      }
    });
  });
  save();
  return n;
}
/* The Apply-changes dialog */
function openApplyScope(){
  const wkObj=curWeek();
  const mySession=daySession(wkObj,state.day);
  const label=SESSION_LABEL[mySession]||mySession;
  const cnt=countMatchingForward();
  const msg=`Apply this day's exercises to ALL future ${label} days?\n\nThis updates ${cnt} upcoming ${label} day${cnt!==1?'s':''} (today onward). Past days are left unchanged.\n\nOK = all future ${label} days\nCancel = keep it to just this day`;
  if(cnt===0){ toast("No future matching days"); return; }
  if(confirm(msg)){
    const n=applyToMatchingForward();
    toast(`Applied to ${n} ${label} day${n!==1?'s':''}`);
    renderLog();
  } else {
    toast("Kept to this day only");
  }
}
const SESSION_LABEL={fbA:"Full Body A",fbB:"Full Body B",fbC:"Full Body C",cardio:"Cardio",fbD:"Full Body",armsGrip:"Arms & Grip",upper:"Upper",lowerA:"Lower A",lowerB:"Lower B",upperC:"Upper C",rest:"Rest"};

function getExercises(session,phase,focus){
  // Travel weeks: same bodyweight block every day (AM + PM)
  if(focus==="travel"){ return BW_BLOCK; }
  const isStr=focus==="strength";
  const isP1=phase===1;
  // Three full-body days
  if(session==="fbA") return isStr?FBA_S:FBA_H;
  if(session==="fbB") return isStr?FBB_S:FBB_H;
  if(session==="fbC") return isStr?FBC_S:FBC_H;
  if(session==="cardio") return [];   // cardio-only day, no lifting
  // Legacy sessions (kept so old custom/saved data still resolves)
  if(session==="fbD") return isStr?FBC_S:FBC_H;
  if(session==="armsGrip") return ARMS_GRIP;
  if(session==="upper") return isStr?UPPER_S:UPPER_H;
  if(session==="upperC") return UPPER_C;
  if(session==="lowerA"){const b=isStr?LA_S:LA_H; return isP1?b:[...b,isStr?LA_S_RDL:LA_H_RDL];}
  if(session==="lowerB"){const b=isStr?LB_S:LB_H; return isP1?b:[...b,isStr?LB_S_GOB:LB_H_GOB];}
  return [];
}

/* HTML-escape for values placed into input value="" attributes */

function toggleEdit(){ state.editMode=!state.editMode; save(); renderLog(); window.scrollTo(0,0); }

/* ─── RENDER LOG ───────────────────────────────────────── */
function renderLog(){
  const v=document.getElementById("view-log");

  const ph=PHASES[wkObj.phase];
  const dayObj=dayInfo(wkObj,state.day);
  const edit=!!state.editMode;

  // Effective focus for THIS day (respects per-day overrides)
  const dFocus=dayFocus(wkObj,state.day);
  const isStr=dFocus==="strength";
  const isTravel=dFocus==="travel";
  const isOff=dFocus==="off";
  const dDate=dayDate(wkObj,state.day);

  let html="";

  // Week nav
  const wkLabel=wkObj.override?"MIXED":(wkObj.focus==="travel"?"TRAVEL":ph.label);
  const todayHit=resolveToday();
  const isToday=todayHit && todayHit.week===state.week && todayHit.day===state.day;
  html+=`<div class="weeknav">`;
  html+=`<button onclick="changeWeek(-1)" ${state.week===1?'disabled style="opacity:0.3"':''}>‹</button>`;
  html+=`<div class="wkinfo"><div class="wknum">Week ${wkObj.wk}</div><div class="wkmeta">${wkObj.dates} · ${wkLabel}</div></div>`;
  html+=`<button onclick="changeWeek(1)" ${state.week===WEEKS.length?'disabled style="opacity:0.3"':''}>›</button>`;
  html+=`</div>`;
  if(!isToday && todayHit){
    html+=`<button class="todaybtn" onclick="jumpToToday(false)">📅 Jump to Today</button>`;
  }

  // Week picker dots
  html+=`<div class="weekpicker">`;
  WEEKS.forEach(w=>{
    const on=w.wk===state.week?'on':'';
    const cls=w.focus==='strength'?'str':w.focus==='travel'?'trav':'hyp';
    const tw=(todayHit && todayHit.week===w.wk)?'thisweek':'';
    html+=`<div class="wkdot ${cls} ${on} ${tw}" onclick="gotoWeek(${w.wk})">${w.wk}</div>`;
  });
  html+=`</div>`;

  // Banner (reflects THIS day)
  if(isOff){
    html+=`<div class="pbanner off"><span class="focus">⊘ NO TRAINING</span><br><b>${dDate.full}</b><br>Travel day. Rest, hydrate, walk if you can.</div>`;
  } else if(isTravel){
    html+=`<div class="pbanner trav"><span class="focus">✈ TRAVEL BLOCK</span><br><b>3 blocks · 4 hrs walking + 2 bodyweight</b><br>6AM walk+BW+walk · 1PM walk · 7PM BW+walk<br>~2,750 kcal/day burn est.</div>`;
  } else if(PHASE_GOAL[wkObj.phase]){
    html+=`<div class="goalbanner"><span class="gbgoal">${PHASE_GOAL[wkObj.phase].goal}</span><span class="gbsep">|</span><span class="gbname">${PHASE_GOAL[wkObj.phase].name}</span></div>`;
  }

  // Week note (editable)
  const wn=getWeekNote(wkObj);
  if(edit){
    html+=`<div class="weeknote edit"><label class="elabel">WEEK NOTE</label><textarea class="enote" onchange="setWeekNote(this.value);renderLog()" placeholder="Week note…">${esc(wn||'')}</textarea></div>`;
  } else if(wn){
    html+=`<div class="weeknote ${wkObj.override||wkObj.focus==='travel'?'trav':''}">${wn}</div>`;
  }

  // Day tabs — now show the date under each day
  html+=`<div class="daytabs">`;
  DAYS.forEach(d=>{
    const logged=!!state.completed[completedKey(state.week,d.key)];
    const f=dayFocus(wkObj,d.key);

function logKeyFor(day){return `w${state.week}_${day}`;}
function completedKey(wk,day){return `w${wk}_${day}`;}
function notesKey(wk,day){return `w${wk}_${day}`;}
function cardioKey(wk,day,type){return `w${wk}_${day}_${type}`;}

/* Custom cardio slots.
   state.cardioSlots = { recurring:[{id,time,label}], perday:{ "w1_mon":[{id,time,label}] } }
   Done-state is tracked per week+day+slotId in state.cardio. */
function ensureSlots(){
  if(!state.cardioSlots) state.cardioSlots={recurring:[],perday:{}};
  if(!state.cardioSlots.recurring) state.cardioSlots.recurring=[];
  if(!state.cardioSlots.perday) state.cardioSlots.perday={};
  return state.cardioSlots;
}
/* All custom slots visible on the current day = recurring + this day's per-day slots */
function slotsForDay(wk,day){
  const S=ensureSlots();
  const rec=S.recurring.filter(s=>{
    // day filter
    if(s.days && !s.days.includes(day)) return false;
    // frequency: "biweekly" shows only on alternating weeks (based on anchor week)
    if(s.freq==="biweekly"){
      const anchor=s.anchorWk||1;
      if((wk-anchor)%2!==0) return false;
    }
    return true;
  });
  const pd=S.perday[`w${wk}_${day}`]||[];
  return rec.concat(pd);
}
/* Human label for which days a recurring slot covers */
const DAY_ABBR={mon:"Mon",tue:"Tue",wed:"Wed",thu:"Thu",fri:"Fri",sat:"Sat",sun:"Sun"};
const DAY_KEYS=["mon","tue","wed","thu","fri","sat","sun"];
function slotDaysLabel(slot){
  let base;
  if(!slot.days || slot.days.length===7) base="every day";
  else base=slot.days.map(d=>DAY_ABBR[d]).join("·");
  if(slot.freq==="biweekly") base+=" (bi-weekly)";
  return base;
}
function slotDoneKey(wk,day,id){return `w${wk}_${day}_slot_${id}`;}
function toggleSlot(id){
  const k=slotDoneKey(state.week,state.day,id);
  if(state.cardio[k])delete state.cardio[k];
  else state.cardio[k]=true;
  save();renderLog();
}
function removeSlot(id,recurring){
  if(!confirm("Remove this cardio slot?"))return;
  const S=ensureSlots();
  if(recurring){
    S.recurring=S.recurring.filter(s=>s.id!==id);
  } else {
    const key=`w${state.week}_${state.day}`;
    if(S.perday[key]) S.perday[key]=S.perday[key].filter(s=>s.id!==id);
  }
  save();renderLog();toast("Slot removed");
}

let _slotDraft={days:[],freq:"weekly",mode:"once",cat:"LISS"};

function slotSetMode(mode){ _slotDraft.mode=mode; renderSlotModal(); }
function slotSetCat(c){ _slotDraft.cat=c; renderSlotModal(); }
function slotToggleDay(d){

function slotSetFreq(f){ _slotDraft.freq=f; renderSlotModal(); }
function renderSlotModal(){

function saveSlotFromModal(){
  const name=(document.getElementById("slotName").value||"Cardio").trim();
  const hbpm=parseInt(document.getElementById("slotHbpm").value)||0;
  const d=_slotDraft;
  const S=ensureSlots();
  const slot={id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),time:"",label:name,cat:d.cat};
  if(hbpm>0) slot.hbpm=hbpm;
  if(d.mode==="once"){
    // committed minutes/steps entered right here
    const val=parseInt(document.getElementById("slotMins").value)||0;
    slot.committed=val;
    const key=`w${state.week}_${state.day}`;
    if(!S.perday[key]) S.perday[key]=[];
    S.perday[key].push(slot);
    // seed the logged value with the committed value so it counts immediately
    if(val>0){ if(!state.cardioMins)state.cardioMins={}; state.cardioMins[minsKey(state.week,state.day,slot.id)]=val; }
    closeSlotModal();
    save();renderLog();toast("Added — "+d.cat);
    return;
  }
  // recurring — no committed minutes; logged per-day on main page
  if(d.days.length===0){ toast("Pick at least one day"); return; }
  slot.days=DAY_KEYS.filter(k=>d.days.includes(k));
  if(d.freq==="biweekly"){ slot.freq="biweekly"; slot.anchorWk=state.week; }
  S.recurring.push(slot);
  closeSlotModal();
  save();renderLog();
  toast("Added — "+d.cat+" · "+slotDaysLabel(slot));
}
const CAT_IN_GOAL={NEAT:false,LISS:true,MISS:true,HIIT:true,SIT:true};

/* Minutes logged for a given entry on a given day. Stored in state.cardioMins. */
function minsKey(wk,day,id){return `w${wk}_${day}_${id}`;}
function getMins(wk,day,id){
  if(!state.cardioMins) return 0;
  const v=state.cardioMins[minsKey(wk,day,id)];
  return v?parseInt(v):0;
}
function setMins(id,val){
  if(!state.cardioMins) state.cardioMins={};
  const n=Math.max(0,Math.min(99999,parseInt(val)||0));
  const k=minsKey(state.week,state.day,id);
  if(n===0) delete state.cardioMins[k];
  else state.cardioMins[k]=n;
  save();
  updateCardioTotal();
}
/* Sum ALL cardio minutes logged in the current week (Mon–Sun, every entry). */
function weekCardioMinutes(wk){
  return weekMinutesByGoal(wk);
}
/* Find a slot object (recurring or per-day) by id, for any day in a week */
function slotById(id){
  const S=ensureSlots();
  let s=S.recurring.find(x=>x.id===id);
  if(s) return s;
  for(const key in S.perday){
    const found=(S.perday[key]||[]).find(x=>x.id===id);
    if(found) return found;
  }
  return null;
}
/* The built-in walk entry counts as NEAT (steps), so it's excluded from minute goal. */
function entryCat(id){
  if(id==="walk") return "NEAT";
  const s=slotById(id);
  return s&&s.cat?s.cat:"LISS"; // default legacy entries to LISS (count toward minutes)
}
/* Sum minutes for the week that count toward the 300 goal (LISS/MISS/HIIT/SIT only). */
function weekMinutesByGoal(wk){
  if(!state.cardioMins) return 0;
  let total=0;
  const prefix=`w${wk}_`;
  for(const k in state.cardioMins){
    if(!k.startsWith(prefix)) continue;
    const id=k.split("_").slice(2).join("_");
    if(CAT_IN_GOAL[entryCat(id)]) total+=parseInt(state.cardioMins[k])||0;
  }
  return total;
}
/* Per-category minute totals for the week (excludes NEAT). */
function weekMinutesByCat(wk){
  const out={LISS:0,MISS:0,HIIT:0,SIT:0};
  if(!state.cardioMins) return out;
  const prefix=`w${wk}_`;
  for(const k in state.cardioMins){
    if(!k.startsWith(prefix)) continue;
    const id=k.split("_").slice(2).join("_");
    const c=entryCat(id);
    if(c!=="NEAT" && out[c]!==undefined) out[c]+=parseInt(state.cardioMins[k])||0;
  }
  return out;
}
/* NEAT steps for a specific day */
function daySteps(wk,day){
  if(!state.cardioMins) return 0;
  let total=0;
  const prefix=`w${wk}_${day}_`;
  for(const k in state.cardioMins){
    if(!k.startsWith(prefix)) continue;
    const id=k.split("_").slice(2).join("_");
    if(entryCat(id)==="NEAT") total+=parseInt(state.cardioMins[k])||0;
  }
  return total;
}
/* NEAT steps for the whole week */
function weekSteps(wk){
  let total=0;
  DAY_KEYS.forEach(d=>total+=daySteps(wk,d));
  return total;
}
const STEP_GOAL_DAY=10000, STEP_GOAL_WEEK=60000;
const CARDIO_GOAL=300;
/* Live-update just the total bar without a full re-render (keeps input focus). */
function updateCardioTotal(){
  const el=document.getElementById("cardioTotal");
  if(!el) return;
  const mins=weekCardioMinutes(state.week);
  const pct=Math.min(100,Math.round(mins/CARDIO_GOAL*100));
  const hit=mins>=CARDIO_GOAL;
  el.className="cardiototal"+(hit?" hit":"");
  el.querySelector(".ctnum").textContent=mins;
  el.querySelector(".ctbar-fill").style.width=pct+"%";
  const cap=el.querySelector(".ctcap");
  if(cap) cap.textContent=hit?"Goal hit! 🎉":`${CARDIO_GOAL-mins} min to go`;
}

function renderCardio(){
  const day=state.day;
  let h=`<div class="cardio-wrap">`;
  h+=`<div class="cardio-title">CARDIO · log your minutes / steps</div>`;

  // Weekly minute-goal bar (LISS/MISS/HIIT/SIT only)
  const mins=weekCardioMinutes(state.week);
  const pct=Math.min(100,Math.round(mins/CARDIO_GOAL*100));
  const hit=mins>=CARDIO_GOAL;
  h+=`<div class="cardiototal${hit?' hit':''}" id="cardioTotal">`;
  h+=`<div class="cthead"><span class="ctnum">${mins}</span> / ${CARDIO_GOAL} min this week</div>`;
  h+=`<div class="ctbar"><div class="ctbar-fill" style="width:${pct}%"></div></div>`;
  h+=`<div class="ctcap">${hit?'Goal hit! 🎉':`${CARDIO_GOAL-mins} min to go`} · full breakdown in Metrics tab</div>`;
  h+=`</div>`;

  // Custom slots
  const S=ensureSlots();
  const recIds=new Set(S.recurring.map(s=>s.id));
  slotsForDay(state.week,day).forEach(slot=>{
    const isRec=recIds.has(slot.id);
    const sm=getMins(state.week,day,slot.id);
    const cat=slot.cat||"LISS";
    const isNEAT=cat==="NEAT";
    const unit=isNEAT?"steps":"min";
    h+=`<div class="cardio-row min slot ${sm>0?'done':''}">`;
    h+=`<span class="cardio-label">${esc(slot.label)} <span class="catbadge ${cat.toLowerCase()}">${cat}</span>${slot.hbpm?' <span class="hbpmbadge">♥ '+slot.hbpm+'</span>':''}${isRec?' <span class="recbadge">'+esc(slotDaysLabel(slot))+'</span>':''}</span>`;
    h+=`<span class="minbox"><input type="text" inputmode="numeric" maxlength="6" value="${sm||''}" placeholder="0" onchange="setMins('${slot.id}',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')"><span class="minlbl">${unit}</span></span>`;

  });

}
function toggleCardio(type){
  const k=cardioKey(state.week,state.day,type);
  if(state.cardio[k])delete state.cardio[k];
  else state.cardio[k]=true;
  save();renderLog();
}

/* Find a slot object by id (searches recurring + this day's per-day) */
function findSlot(id){
  const S=ensureSlots();
  let s=S.recurring.find(x=>x.id===id);
  if(s) return s;
  const pd=S.perday[`w${state.week}_${state.day}`]||[];
  return pd.find(x=>x.id===id);
}
/* Edit a slot's label or time in place */
function updateSlot(id,field,val){
  const s=findSlot(id);
  if(!s) return;
  s[field]=val;
  save();
}
/* Move a slot up/down within the day's combined list — only reorders per-day slots
   relative to each other; recurring order is global. Simplicity: reorder within its own bucket. */
function moveSlot(id,dir){
  const S=ensureSlots();
  // try recurring
  let arr=S.recurring, i=arr.findIndex(x=>x.id===id);
  if(i<0){ arr=S.perday[`w${state.week}_${state.day}`]||[]; i=arr.findIndex(x=>x.id===id); }
  if(i<0) return;
  const j=i+dir;
  if(j<0||j>=arr.length) return;
  const t=arr[i]; arr[i]=arr[j]; arr[j]=t;
  save(); renderLog();
}

/* ─── TRAVEL DAY: 3 time blocks ────────────────────────── */
function travelWalkKey(wk,day,id){return `w${wk}_${day}_walk_${id}`;}
function toggleWalk(id){

function bwSetKey(slot){ return `w${state.week}_${state.day}_bw_${slot}`; }

function logBW(slot,ei,s,field,val){

function logSet(ei,s,field,val){

function changeWeek(dir){

}
function gotoWeek(wk){state.week=wk;save();renderLog();window.scrollTo(0,0);}
function setDay(d){state.day=d;save();renderLog();}

function getPR(exName){
  let best=0;
  for(const lk in state.logs){
    const parts=lk.match(/w(\d+)_(\w+)/);
    if(!parts)continue;
    const wkNum=+parts[1],dy=parts[2];
    const wkObj=WEEKS.find(w=>w.wk===wkNum);
    if(!wkObj)continue;
    const dayObj=DAYS.find(d=>d.key===dy);
    if(!dayObj||dayObj.session==="rest")continue;
    const exs=planExercises(wkObj,dy).filter(e=>!e.div);
    exs.forEach((ex,ei)=>{
      if(ex.n===exName&&state.logs[lk][ei]){
        for(const s in state.logs[lk][ei]){
          const v=parseFloat(state.logs[lk][ei][s].wt);
          if(!isNaN(v)&&v>best)best=v;
        }
      }
    });
  }
  return best>0?best:null;
}

/* ─── PROGRESS ─────────────────────────────────────────── */
/* ═══ PR TRACKING SYSTEM ═══
   Each PR has: id, label, type (determines input fields), unit.
   types: weight | weightreps | time | reps
   Every entry stores: value(s) + bw (bodyweight at test) + date. History kept per PR. */
const PR_DEFS=[
  {group:"Raw Strength", items:[
    {id:"squat_max",   label:"Squat — Max",           type:"weight"},
    {id:"squat_amrap", label:"Squat — AMRAP",         type:"weightreps"},
    {id:"incbench_max",label:"Incline Bench — Max",   type:"weight"},
    {id:"incbench_amrap",label:"Incline Bench — AMRAP",type:"weightreps"},
    {id:"ohp_max",     label:"Overhead Press — Max",  type:"weight"},
    {id:"ohp_amrap",   label:"Overhead Press — AMRAP",type:"weightreps"},
    {id:"dead_max",    label:"Deadlift — Max",        type:"weight"},
    {id:"dead_amrap",  label:"Deadlift — AMRAP",      type:"weightreps"},
    {id:"pendlay_max", label:"Pendlay Row — Max",     type:"weight"},
    {id:"pendlay_amrap",label:"Pendlay Row — AMRAP",  type:"weightreps"},
  ]},
  {group:"Cardio", items:[
    {id:"row2000",  label:"Row — 2,000 m",       type:"time"},
    {id:"sprint40", label:"40 Yard Sprint",      type:"time"},
    {id:"shuttle300",label:"300 Yard Shuttle",   type:"time"},
    {id:"run15",    label:"1.5 Mile Run",        type:"time"},
  ]},
  {group:"Bodyweight", items:[
    {id:"pullups",  label:"Pull-Ups — unassisted",     type:"reps"},
    {id:"dips",     label:"Dips — unassisted",         type:"reps"},
    {id:"pushups",  label:"Push-Ups — AMRAP 1 min",    type:"reps"},
    {id:"bwsquat",  label:"BW Squats — AMRAP 1 min",   type:"reps"},
    {id:"plank",    label:"Plank — till failure",      type:"time"},
    {id:"revplank", label:"Reverse Plank — till failure",type:"time"},
    {id:"statichold",label:"Static Hold — till failure",type:"time"},
    {id:"burpees",  label:"Burpees — AMRAP 5 min",     type:"reps"},
  ]},
];
function prMeta(id){
  for(const g of PR_DEFS){const it=g.items.find(x=>x.id===id);if(it)return it;}
  return null;
}
function prHistory(id){ return (state.prs&&state.prs[id])?state.prs[id]:[]; }
function prLatest(id){ const h=prHistory(id); return h.length?h[h.length-1]:null; }
/* Format a PR entry's value for display based on type */
function prValueStr(meta,entry){
  if(!entry) return "—";
  if(meta.type==="weight") return `${entry.weight} lbs`;
  if(meta.type==="weightreps") return `${entry.weight} lbs × ${entry.reps}`;
  if(meta.type==="time") return entry.time;
  if(meta.type==="reps") return `${entry.reps} reps`;
  return "—";
}

/* ── PR entry modal ── */
let _prDraft=null;
function openPrModal(id){
  const meta=prMeta(id); if(!meta) return;
  _prDraft={id};
  document.getElementById("prModalTitle").textContent=meta.label;
  // build fields by type
  let f="";
  if(meta.type==="weight"){
    f+=prField("prWeight","Max weight (lbs)","numeric","e.g. 225");
  } else if(meta.type==="weightreps"){
    f+=prField("prWeight","Weight (lbs)","numeric","e.g. 185");
    f+=prField("prReps","Reps (AMRAP)","numeric","e.g. 8");
  } else if(meta.type==="time"){
    f+=prField("prTime","Time","text","e.g. 8:42 or 5.9s");
  } else if(meta.type==="reps"){
    f+=prField("prReps","Reps","numeric","e.g. 12");
  }
  f+=prField("prBW","Bodyweight at test (lbs)","numeric","e.g. 340");
  f+=prField("prDate","Date tested","date","");
  document.getElementById("prModalFields").innerHTML=f;
  // default date to today
  const dt=document.getElementById("prDate"); if(dt) dt.value=todayYMD();
  document.getElementById("prModal").classList.add("show");
}
function prField(id,label,mode,ph){
  if(mode==="date"){
    return `<label class="smlabel">${label}</label><input class="sminput" id="${id}" type="date">`;
  }
  const inm=mode==="numeric"?'inputmode="numeric"':'';
  const oi=mode==="numeric"?`oninput="this.value=this.value.replace(/[^0-9]/g,'')"`:'';
  return `<label class="smlabel">${label}</label><input class="sminput" id="${id}" type="text" ${inm} placeholder="${ph}" ${oi}>`;
}
function closePrModal(){ document.getElementById("prModal").classList.remove("show"); }
function savePrEntry(){
  // Resting HR path
  if(_prDraft&&_prDraft.id==="__hr__"){
    const val=parseInt((document.getElementById("hrVal")||{}).value)||0;
    const date=(document.getElementById("prDate")||{}).value||todayYMD();
    if(!val){toast("Enter a heart rate");return;}
    if(!state.restingHR) state.restingHR=[];
    state.restingHR.push({val,date});
    state.restingHR.sort((a,b)=>a.date<b.date?-1:1);
    closePrModal(); save(); renderProgress(); toast("Resting HR logged");
    return;
  }
  const meta=prMeta(_prDraft.id); if(!meta) return;
  const g=(id)=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const entry={date:g("prDate")||todayYMD(), bw:parseInt(g("prBW"))||0};
  if(meta.type==="weight"){ entry.weight=parseInt(g("prWeight"))||0; if(!entry.weight){toast("Enter a weight");return;} }
  else if(meta.type==="weightreps"){ entry.weight=parseInt(g("prWeight"))||0; entry.reps=parseInt(g("prReps"))||0; if(!entry.weight||!entry.reps){toast("Enter weight and reps");return;} }
  else if(meta.type==="time"){ entry.time=g("prTime"); if(!entry.time){toast("Enter a time");return;} }
  else if(meta.type==="reps"){ entry.reps=parseInt(g("prReps"))||0; if(!entry.reps){toast("Enter reps");return;} }
  if(!state.prs) state.prs={};
  if(!state.prs[_prDraft.id]) state.prs[_prDraft.id]=[];
  state.prs[_prDraft.id].push(entry);
  state.prs[_prDraft.id].sort((a,b)=>a.date<b.date?-1:1);
  closePrModal();
  save(); renderProgress(); toast("PR logged");
}
function deletePrEntry(id,idx){
  if(!confirm("Delete this PR entry?"))return;
  if(state.prs&&state.prs[id]){ state.prs[id].splice(idx,1); if(!state.prs[id].length)delete state.prs[id]; }
  save(); renderProgress();
}
function togglePrHistory(id){
  const el=document.getElementById("prhist_"+id);
  if(el) el.style.display=el.style.display==="none"?"block":"none";
}

/* ── Resting HR (top baseline) ── */
function openHrModal(){
  document.getElementById("prModalTitle").textContent="Resting Heart Rate";
  document.getElementById("prModalFields").innerHTML=
    prField("hrVal","Resting HR (bpm)","numeric","e.g. 68")+
    prField("prDate","Date","date","");
  const dt=document.getElementById("prDate"); if(dt) dt.value=todayYMD();
  _prDraft={id:"__hr__"};
  document.getElementById("prModal").classList.add("show");

function renderProgress(){
  const v=document.getElementById("view-progress");
  let h="";

  // ── Resting HR baseline ──
  const hr=state.restingHR||[];
  const latestHR=hr.length?hr[hr.length-1]:null;
  h+=`<div class="hrbar">`;
  h+=`<div class="hrleft"><span class="hrlabel">♥ Resting HR</span>`;
  h+=latestHR?`<span class="hrval">${latestHR.val} <span class="hru">bpm</span></span><span class="hrdate">${fmtPrDate(latestHR.date)}</span>`:`<span class="hrempty">not logged</span>`;
  h+=`</div>`;
  h+=`<button class="hrbtn" onclick="openHrModal()">+ Log</button>`;
  h+=`</div>`;
  if(hr.length>1){
    h+=`<div class="hrhistory">`;
    hr.slice().reverse().forEach((e,i)=>{ h+=`<span class="hrchip">${e.val} bpm · ${fmtPrDate(e.date)}</span>`; });
    h+=`</div>`;
  }

  // ── PR groups ──
  PR_DEFS.forEach(grp=>{
    h+=`<div class="prgroup-title">${grp.group}</div>`;
    grp.items.forEach(it=>{
      const latest=prLatest(it.id);
      const hist=prHistory(it.id);
      h+=`<div class="prrow">`;
      h+=`<div class="prrow-main">`;
      h+=`<div class="prrow-label">${it.label}</div>`;
      h+=`<div class="prrow-val">${latest?prValueStr(it,latest):'<span class="prnone">—</span>'}</div>`;
      h+=`</div>`;
      h+=`<div class="prrow-meta">`;
      if(latest){
        h+=`<span class="prrow-sub">${latest.bw?'@ '+latest.bw+' lbs · ':''}${fmtPrDate(latest.date)}</span>`;
        if(hist.length>1) h+=`<button class="prhistbtn" onclick="togglePrHistory('${it.id}')">history (${hist.length})</button>`;
      }
      h+=`<button class="praddbtn" onclick="openPrModal('${it.id}')">+ Log</button>`;
      h+=`</div>`;
      // history (collapsed)
      if(hist.length>1){
        h+=`<div class="prhist" id="prhist_${it.id}" style="display:none">`;
        hist.slice().reverse().forEach((e,ri)=>{
          const realIdx=hist.length-1-ri;
          h+=`<div class="prhistrow"><span>${prValueStr(it,e)}${e.bw?' @ '+e.bw+' lbs':''}</span><span class="prhistdate">${fmtPrDate(e.date)}</span><button class="prdel" onclick="deletePrEntry('${it.id}',${realIdx})">✕</button></div>`;
        });
        h+=`</div>`;
      }
      h+=`</div>`;
    });
  });

  v.innerHTML=h;
}
function fmtPrDate(iso){
  if(!iso) return "";
  const [y,m,d]=iso.split("-").map(Number);
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${MON[m-1]} ${d}, ${y}`;
}

  html+=`<div id="impbox" style="display:none;margin-top:10px"><textarea class="data" id="imptext" placeholder="Paste backup here…"></textarea><button class="databtn" onclick="importData()" style="margin-top:8px">Restore from text</button></div>`;
  html+=`<div id="expbox" style="display:none;margin-top:10px"><textarea class="data" id="exptext" readonly></textarea><div class="hint">Copy all text above and save it somewhere safe.</div></div>`;
  html+=`<div class="section-title">Reset</div>`;
  html+=`<button class="databtn danger" onclick="resetData()">⚠ Erase all data</button>`;
  v.innerHTML=html;
}
function exportData(){const b=document.getElementById("expbox");const t=document.getElementById("exptext");t.value=JSON.stringify(state);b.style.display="block";t.select();try{document.execCommand("copy");toast("✓ Copied");}catch(e){toast("Select & copy");}}
function importData(){const t=document.getElementById("imptext").value.trim();if(!t){toast("Paste backup first");return;}try{const d=JSON.parse(t);state=Object.assign({week:1,day:"mon",logs:{},notes:{},completed:{},notesOpen:{},cardio:{},cardioSlots:{recurring:[],perday:{}},cardioMins:{},plan:{},titles:{},wknotes:{},prs:{},restingHR:[],editMode:false},d);save();toast("✓ Restored");renderLog();}catch(e){toast("⚠ Invalid backup");}}
function resetData(){if(confirm("Erase ALL data? Export a backup first if unsure.")){state={week:1,day:"mon",logs:{},notes:{},completed:{},notesOpen:{},cardio:{},cardioSlots:{recurring:[],perday:{}},cardioMins:{},plan:{},titles:{},wknotes:{},prs:{},restingHR:[],editMode:false};save();toast("Erased");renderLog();renderData();}}

/* ─── TABS ─────────────────────────────────────────────── */
document.querySelectorAll(".tabbar button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".tabbar button").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    const tab=btn.dataset.tab;
    ["log","progress","metrics","data"].forEach(t=>{document.getElementById("view-"+t).style.display=t===tab?"block":"none";});
    if(tab==="progress")renderProgress();
    if(tab==="metrics")renderMetrics();
    if(tab==="data")renderData();
  };
});

/* ─── JUMP TO TODAY ────────────────────────────────────── */
function todayYMD(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
/* Find the week + day matching today's real date. Returns null if outside the plan. */
function resolveToday(){
  const t=todayYMD();
  for(const w of WEEKS){
    for(let i=0;i<7;i++){
      const [y,m,d]=w.start.split("-").map(Number);
      const dt=new Date(y,m-1,d+i);
      const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      if(ds===t) return {week:w.wk, day:DAY_ORDER[i]};
    }
  }
  return null;
}
/* Set state to today if in range; clamp to plan bounds if outside. */
function jumpToToday(silent){
  const hit=resolveToday();
  if(hit){
    state.week=hit.week; state.day=hit.day; save();
    if(!silent) toast("📅 Jumped to today");
    renderLog(); window.scrollTo(0,0);
    return true;
  }
  if(!silent){
    const t=todayYMD();
    const first=WEEKS[0].start;
    const lastW=WEEKS[WEEKS.length-1];
    if(t<first){ state.week=1; state.day="mon"; toast("Plan starts Jul 6 — showing Week 1"); }
    else { state.week=lastW.wk; state.day="sun"; toast("Past plan end — showing final week"); }
    save(); renderLog(); window.scrollTo(0,0);
  }
  return false;
}

load();
// Auto-open to today's week + day (only on fresh app open, not on every render)
jumpToToday(true);
renderLog();
</script>
