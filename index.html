<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --red:#8B1A1A; --redL:#c97070; --redBg:#1a0d0d;
    --navy:#1F3864; --navyL:#7090c9; --navyBg:#0d1320;
    --trav:#6d28d9; --travL:#a78bfa; --travBg:#160d24;
    --green:#16a34a; --greenL:#4ade80; --greenBg:#0a1f14;
    --bg:#080808; --card:#0f0f0f; --line:#2a2a2a;
    --txt:#f0f0f0; --dim:#a8a8a8; --dimmer:#8a8a8a;
    --mono:'Courier New',monospace;
  }
  body { background:var(--bg); color:var(--txt); font-family:'Georgia',serif; padding-bottom:78px; min-height:100vh; }
  .wrap { max-width:580px; margin:0 auto; padding:1rem; }

  .hero { padding:1.4rem 1rem 1rem; border-bottom:1px solid var(--line); }
  .hero .name { font-size:10px; color:var(--dim); letter-spacing:0.18em; text-transform:uppercase; font-family:var(--mono); margin-bottom:4px; }
  .hero h1 { font-size:26px; font-weight:700; color:#fff; letter-spacing:-0.02em; }
  .hero h1 span { color:var(--red); }
  .hero .sub { font-size:12px; color:var(--dim); font-family:var(--mono); margin-top:4px; }
  .herobar { height:6px; background:#1c1c1c; border-radius:4px; overflow:hidden; margin-top:10px; }
  .herobar-fill { height:100%; background:linear-gradient(90deg,var(--red),#e0564e); border-radius:4px; transition:width 0.4s; }

  /* Week navigation */
  .weeknav { display:flex; align-items:center; gap:10px; margin-bottom:1rem; }
  .weeknav button {
    background:var(--card); border:1px solid var(--line); color:#e0e0e0;
    border-radius:8px; padding:10px 16px; font-size:18px; cursor:pointer;
    font-family:var(--mono); line-height:1;
  }
  .weeknav button:active { background:#1a1a1a; }
  .weeknav .wkinfo { flex:1; text-align:center; }
  .weeknav .wknum { font-size:18px; font-weight:700; color:#fff; }
  .weeknav .wkmeta { font-size:11px; color:var(--dim); font-family:var(--mono); margin-top:2px; }

  .weekpicker { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:1rem; justify-content:center; }
  .wkdot {
    width:30px; height:30px; border-radius:6px; border:1px solid var(--line);
    background:var(--card); color:#c0c0c0; font-size:11px; font-family:var(--mono);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .wkdot.str.on { background:var(--red); color:#fff; border-color:var(--red); }
  .wkdot.hyp.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .wkdot.db { border-color:#5a4a18; color:#e0c94e; }
  .wkdot.db.on { background:#e0c94e; color:#1a1a1a; border-color:#e0c94e; }
  .wkdot.sprint { border-color:#7a2020; color:#f07070; }
  .wkdot.sprint.on { background:#c22b2b; color:#fff; border-color:#c22b2b; }
  .wkdot.trav.on { background:var(--trav); color:#fff; border-color:var(--trav); }
  .wkdot.trav { border-color:#3a2560; color:var(--travL); }
  .wkdot.thisweek { box-shadow:0 0 0 1.5px var(--redL); }
  .wkdot.logged::after { content:'·'; position:absolute; margin-top:-18px; margin-left:0; color:var(--greenL); font-size:20px; }

  /* Phase banner */
  .pbanner { border-radius:8px; padding:0.7rem 1rem; margin-bottom:1rem; font-size:12px; line-height:1.5; }
  .pbanner.str { background:var(--redBg); border-left:3px solid var(--red); color:#d8b0b0; }
  .pbanner.hyp { background:var(--navyBg); border-left:3px solid var(--navy); color:#aac0e0; }
  .pbanner.trav { background:var(--travBg); border-left:3px solid var(--trav); color:#c4b0e0; }
  .pbanner b { color:#fff; }
  .goalbanner { background:linear-gradient(135deg,var(--redBg),#1a0d0d); border:1px solid var(--red); border-radius:10px; padding:14px 1rem; margin-bottom:1rem; text-align:center; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  .goalbanner .gbgoal { font-family:var(--mono); font-weight:700; font-size:14px; color:#fff; letter-spacing:0.03em; }
  .goalbanner .gbsep { color:var(--redL); font-size:16px; }
  .goalbanner .gbname { font-family:var(--mono); font-weight:700; font-size:13px; color:var(--redL); letter-spacing:0.04em; }
  .z2block { background:#0d1a1f; border:1px solid #1c3a44; border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .z2head { font-size:11px; color:#5bbcd5; font-family:var(--mono); font-weight:700; letter-spacing:0.06em; margin-bottom:8px; }
  .spothead { font-size:13px; color:#f0a05f; font-family:var(--mono); font-weight:700; letter-spacing:0.08em; margin:22px 0 10px; padding-bottom:7px; border-bottom:1px solid var(--line); }
  .z2row { font-size:12px; color:#cfe3e8; line-height:1.6; padding:2px 0; }
  .z2row.z2lift { color:#fff; font-weight:600; }
  .z2row.z2check { display:flex; align-items:center; gap:10px; padding:5px 0; }
  .z2rowtext { flex:1; }
  .z2row.z2check.done .z2rowtext { text-decoration:line-through; color:var(--dim); }
  .z2row.z2check .cardiocheck { border-color:#1c3a44; color:#5bbcd5; }
  .z2row.z2check .cardiocheck.on { background:#2a7a8f; border-color:#2a7a8f; color:#fff; }
  .z2time { display:inline-block; min-width:68px; color:#5bbcd5; font-family:var(--mono); font-size:10px; font-weight:700; text-transform:uppercase; }
  .z2note { font-size:10px; color:var(--dim); font-family:var(--mono); margin-top:8px; line-height:1.5; padding-top:8px; border-top:1px solid #1c3a44; }
  /* Cardio entries */
  .centry { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid #16303a; }
  .centry:last-of-type { border-bottom:none; }
  .centry-body { flex:1; min-width:0; }
  .centry-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .centry-label { font-size:13px; color:#cfe3e8; }
  .centry.done .centry-label { text-decoration:line-through; color:var(--dim); }
  .centry-mins { font-size:12px; color:var(--blueL); font-family:var(--mono); font-weight:700; white-space:nowrap; }
  .centry-types { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .ctype { font-size:9px; font-family:var(--mono); font-weight:700; padding:1px 6px; border-radius:4px; }
  .ctype.liss { background:#1a4231; color:#5fd39a; }
  .ctype.miss { background:#3d3410; color:#e0c94e; }
  .ctype.hiit { background:#4a2410; color:#f0a05f; }
  .ctype.sit  { background:#4a1520; color:#f07090; }
  .centry-edit { flex-shrink:0; background:none; border:1px solid #1c3a44; border-radius:6px; color:var(--blueL); font-size:13px; padding:5px 9px; cursor:pointer; }
  .cezones { display:flex; flex-direction:column; gap:7px; }
  .cezone { display:flex; align-items:center; gap:10px; }
  .cezone .ctype { min-width:46px; text-align:center; }
  .cezhr { flex:1; font-size:10px; color:var(--dim); font-family:var(--mono); }
  .cezone input { width:60px; padding:8px; text-align:center; background:#1a1a1a; border:1px solid var(--line); border-radius:6px; color:#fff; font-size:15px; font-family:var(--mono); }
  .cezone input:focus { outline:none; border-color:var(--green); }
  .rulesbox { background:var(--card); border:1px solid var(--line); border-radius:9px; padding:10px 14px; margin-bottom:14px; }
  .rulesbox summary { font-size:11px; color:var(--dim); font-family:var(--mono); font-weight:700; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer; }
  .rulesbox ul { margin:10px 0 2px; padding-left:18px; }
  .rulesbox li { font-size:12px; color:#cfcfcf; line-height:1.6; margin-bottom:5px; }
  .dbbanner { background:#2a2410; border:1px solid #5a4a18; border-radius:9px; padding:10px 14px; margin-bottom:12px; font-size:11px; color:#e0c94e; font-family:var(--mono); font-weight:700; letter-spacing:0.03em; text-align:center; line-height:1.5; }
  .sprintbanner { background:#2a1010; border:1px solid #7a2020; border-radius:9px; padding:10px 14px; margin-bottom:12px; font-size:11px; color:#f07070; font-family:var(--mono); font-weight:700; letter-spacing:0.03em; text-align:center; line-height:1.5; }
  .fastnote { background:#1a0d0d; border-left:3px solid #c22b2b; border-radius:7px; padding:9px 12px; margin-bottom:12px; font-size:12px; color:#f0a0a0; line-height:1.5; }
  .fastnote b { color:#f07070; }
  .pbanner .focus { font-family:var(--mono); font-weight:700; text-transform:uppercase; letter-spacing:0.08em; font-size:11px; }

  .weeknote { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:0.7rem 1rem; margin-bottom:1rem; font-size:12px; color:var(--redL); font-style:italic; line-height:1.5; }
  .weeknote.trav { color:var(--travL); }

  /* Day tabs with dates */
  .daytab .dtl { display:block; }
  .daytab .dtd { display:block; font-size:9px; opacity:0.55; font-weight:400; margin-top:1px; }
  .daytab .dtlab { display:inline-block; margin-top:3px; font-size:8px; font-weight:800; width:14px; height:14px; line-height:14px; border-radius:50%; font-family:var(--mono); }
  .daytab .dtlab.L { background:rgba(240,112,112,0.22); color:var(--redL); }
  .daytab .dtlab.C { background:rgba(95,211,154,0.20); color:var(--accent); }
  .daytab .dtlab.R { background:rgba(138,151,168,0.18); color:var(--dim); }
  .daytab.travday { border-color:#3a2560; }
  .daytab.offday { opacity:0.45; border-style:dashed; }
  .daytab.istoday { box-shadow:inset 0 0 0 1.5px var(--redL); }
  .daytab.istoday.on { box-shadow:none; }
  .todaybtn { width:100%; padding:9px; margin:-6px 0 12px; border-radius:8px; border:1px solid var(--red); background:var(--redBg); color:var(--redL); font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; letter-spacing:0.04em; }
  .todaybtn:active { background:var(--red); color:#fff; }

  /* ── Edit mode ── */
  .editbtn { width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--dim); font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; letter-spacing:0.04em; }
  .editbtn.on { background:var(--red); color:#fff; border-color:var(--red); }
  .editbtn .cdot { color:var(--redL); font-size:16px; }
  .edithint { font-size:11px; color:var(--dim); background:var(--card); border-left:3px solid var(--red); border-radius:6px; padding:8px 10px; margin-bottom:10px; line-height:1.5; }
  .edithint b { color:var(--redL); }
  .ex.editrow { background:#131313; }
  .editbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
  .etype { font-size:9px; color:var(--dim); font-family:var(--mono); letter-spacing:0.08em; font-weight:700; }
  .ebtns button { background:#222; border:1px solid var(--line); color:#ddd; border-radius:5px; width:30px; height:28px; font-size:13px; cursor:pointer; margin-left:4px; }
  .ebtns button.del { color:var(--redL); border-color:#4a1f1f; }
  .einput { width:100%; padding:8px 10px; margin-bottom:6px; background:#1c1c1c; border:1px solid var(--line); border-radius:6px; color:#f0f0f0; font-size:14px; font-family:'Georgia',serif; }
  .einput.bold { font-weight:700; }
  .einput:focus { outline:none; border-color:var(--red); }
  .eopts { display:flex; gap:12px; align-items:center; margin-top:4px; }
  .eopts label { font-size:11px; color:var(--dim); font-family:var(--mono); display:flex; align-items:center; gap:6px; }
  .eopts input[type=number] { width:52px; padding:5px; background:#1c1c1c; border:1px solid var(--line); border-radius:5px; color:#fff; font-family:var(--mono); text-align:center; font-size:13px; }
  .eopts .chk { cursor:pointer; user-select:none; padding:5px 8px; border:1px solid var(--line); border-radius:5px; }
  .eopts .chk.on { color:var(--greenL); border-color:var(--green); }
  .editactions { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:12px; }
  .editactions button { padding:11px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:#e0e0e0; font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; }
  .editactions button.warn { color:var(--redL); border-color:#4a1f1f; }
  .editactions button.apply { color:#fff; background:var(--green); border-color:var(--green); grid-column:1 / -1; }
  .applyhint { font-size:11px; color:var(--dim); background:var(--card); border-left:3px solid var(--green); border-radius:6px; padding:8px 10px; margin-top:8px; line-height:1.5; }
  .applyhint b { color:var(--greenL); }
  .weeknote.edit { border-left:3px solid var(--red); }
  .elabel { display:block; font-size:9px; color:var(--dim); font-family:var(--mono); letter-spacing:0.08em; margin-bottom:5px; font-weight:700; }
  .enote { width:100%; min-height:56px; background:#1c1c1c; border:1px solid var(--line); border-radius:6px; color:#f0f0f0; font-family:'Georgia',serif; font-size:13px; padding:8px; resize:vertical; }
  .enote:focus { outline:none; border-color:var(--red); }
  .ehead-tag { width:100%; background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.25); border-radius:5px; color:#fff; font-family:var(--mono); font-size:11px; padding:5px 7px; margin-bottom:5px; }
  .ehead-title { width:100%; background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.25); border-radius:5px; color:#fff; font-size:17px; font-weight:700; padding:6px 7px; font-family:'Georgia',serif; }
  .ehead-tag:focus,.ehead-title:focus { outline:none; border-color:#fff; }

  /* Selected day date header */
  .datehead { text-align:center; font-size:13px; font-weight:700; color:var(--redL); font-family:var(--mono); letter-spacing:0.06em; margin:-4px 0 10px; }

  /* Off day */
  .pbanner.off { background:#1a1a1a; border-left:3px solid #777; color:#c0c0c0; }
  .shead.off { background:linear-gradient(135deg,#2a2a2a,#1a1a1a); }

  /* Day tabs */
  .daytabs { display:flex; gap:5px; margin-bottom:1rem; flex-wrap:wrap; }
  .daytab {
    flex:1; min-width:60px; padding:9px 4px; border-radius:7px; border:1px solid var(--line);
    background:var(--card); color:#c0c0c0; font-family:var(--mono); font-size:12px;
    font-weight:700; cursor:pointer; text-align:center;
  }
  .daytab.on { background:#fff; color:#000; border-color:#fff; }
  .daytab.logged { border-color:var(--green); }

  /* Session */
  .shead { border-radius:10px 10px 0 0; padding:0.85rem 1rem; color:#fff; }
  .shead.str { background:linear-gradient(135deg,var(--red),#6b1414); }
  .shead.hyp { background:linear-gradient(135deg,var(--navy),#142847); }
  .shead.trav { background:linear-gradient(135deg,var(--trav),#4c1d95); }
  .shead .stag { font-size:10px; opacity:0.7; font-family:var(--mono); text-transform:uppercase; letter-spacing:0.1em; }
  .shead .stitle { font-size:18px; font-weight:700; margin-top:2px; }

  /* Each exercise is its own self-contained card — no shared/merging borders */
  .ex { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden; }
  /* Superset heading — standalone label, no border line connecting into exercises */
  .exdiv { display:flex; align-items:center; gap:9px; color:#f0f0f0; padding:6px 2px; font-size:12px; font-weight:700; letter-spacing:0.1em; font-family:var(--mono); text-transform:uppercase; margin:18px 0 9px; }
  .exdiv::before { content:""; width:3px; height:14px; background:var(--red); border-radius:2px; flex-shrink:0; }
  .exdiv.hyp::before { background:var(--navy); }
  .btype-badge { display:inline-block; margin-left:auto; font-size:10px; font-weight:700; letter-spacing:0.04em; text-transform:none; color:var(--warn); background:rgba(224,201,78,0.12); border:1px solid rgba(224,201,78,0.3); border-radius:5px; padding:2px 7px; font-family:var(--mono); }
  .btype-row { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .btype-lbl { font-size:11px; color:var(--dim); font-family:var(--mono); text-transform:uppercase; letter-spacing:0.05em; }
  .btype-sel { flex:1; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:7px 9px; font-size:13px; font-family:var(--mono); }
  .exrx { font-size:11.5px; color:var(--warn); margin-top:2px; font-family:var(--mono); }
  .bhead-tag { font-size:10px; font-weight:600; letter-spacing:0.02em; text-transform:none; color:var(--dim); margin-left:9px; font-family:var(--mono); }
  .bhead-sub { font-size:11.5px; color:var(--blue); font-family:var(--mono); margin:-4px 0 10px 2px; line-height:1.5; opacity:0.9; }
  .exrow { padding:0.75rem 1rem; }
  .exname { font-size:14px; font-weight:700; color:#fff; }
  .exname.done { text-decoration:line-through; color:var(--dim); }
  .exrx { font-size:11px; color:var(--redL); font-family:var(--mono); margin-top:2px; }
  .exnamerow { display:flex; align-items:flex-start; gap:10px; }
  .exnamewrap { flex:1; }
  .excheck { flex-shrink:0; width:26px; height:26px; border:2px solid var(--line); border-radius:7px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--greenL); font-size:16px; font-weight:700; margin-top:1px; transition:all 0.15s; }
  .excheck.on { background:var(--green); border-color:var(--green); color:#fff; }
  .cardiocheck { width:22px; height:22px; font-size:13px; margin-top:0; }
  .cardio-row.min .cardio-label.done { text-decoration:line-through; color:var(--dim); }
  /* Clean set table — aligned columns, one row per set */
  .setgrid { margin-top:10px; }
  .sethdr { display:grid; grid-template-columns:52px 1fr 1fr; gap:8px; align-items:center; padding:0 2px 4px; }
  .sethdr.lr { grid-template-columns:52px 1fr 1fr 1fr; }
  .sethdr span { font-size:9px; color:var(--dim); font-family:var(--mono); text-transform:uppercase; letter-spacing:0.08em; font-weight:700; text-align:center; }
  .sethdr span:first-child { text-align:left; }
  .setrow { display:grid; grid-template-columns:52px 1fr 1fr; gap:8px; align-items:center; margin-bottom:6px; }
  .setrow.lr { grid-template-columns:52px 1fr 1fr 1fr; }
  .setrow .setnum { font-size:11px; color:var(--dim); font-family:var(--mono); font-weight:700; }
  .setrow input { width:100%; padding:9px 4px; text-align:center; background:#1a1a1a; border:1px solid var(--line); border-radius:6px; color:#fff; font-size:15px; font-family:var(--mono); }
  .setrow input:focus { outline:none; border-color:var(--red); background:#222; }
  .setrow.pr input.wt { border-color:var(--green); }
  .prbadge { font-size:9px; color:var(--green); font-family:var(--mono); margin-top:6px; height:11px; }

  /* Collapsible notes */
  .notes-wrap { background:var(--card); border:1px solid var(--line); border-top:none; border-radius:0 0 10px 10px; }
  .notes-toggle {
    width:100%; padding:0.85rem 1rem; background:none; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    color:#d0d0d0; font-family:var(--mono); font-size:12px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.06em;
  }
  .notes-toggle .arrow { transition:transform 0.2s; color:var(--dim); }
  .notes-toggle.open .arrow { transform:rotate(90deg); }
  .notes-body { max-height:0; overflow:hidden; transition:max-height 0.25s ease; }
  .notes-body.open { max-height:400px; }
  .notes-body textarea {
    width:100%; min-height:120px; background:#1a1a1a; border:1px solid var(--line);
    border-radius:8px; color:#fff; font-family:'Georgia',serif; font-size:14px;
    padding:10px; margin:0 0 1rem; line-height:1.5; resize:vertical;
  }
  .notes-body textarea:focus { outline:none; border-color:var(--red); }
  .notes-inner { padding:0 1rem; }
  .notes-prompt { font-size:11px; color:var(--dim); margin-bottom:8px; font-style:italic; }

  .complete-btn { width:100%; padding:14px; margin-top:12px; border:none; border-radius:10px; font-size:14px; font-weight:700; font-family:var(--mono); cursor:pointer; background:var(--card); color:var(--redL); border:1px solid var(--line); text-transform:uppercase; letter-spacing:0.06em; }
  .complete-btn.done { background:var(--green); color:#fff; border-color:var(--green); }
  .reanchor-btn { width:100%; padding:12px; margin-top:8px; border:1px dashed var(--line); border-radius:10px; font-size:13px; font-weight:700; font-family:var(--mono); cursor:pointer; background:transparent; color:var(--dim); text-transform:uppercase; letter-spacing:0.05em; }
  .reanchor-btn:hover { color:var(--ink); border-color:var(--dim); }
  .reanchor-btn.on { background:rgba(95,211,154,0.10); border-style:solid; border-color:var(--green); color:var(--green); }
  .reanchor-hint { font-size:11.5px; color:var(--dim); margin-top:5px; line-height:1.5; padding:0 2px; }
  .reanchor-hint b { color:var(--ink); }
  .cardio-wrap { margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:0.75rem 1rem; }
  .cardio-title { font-size:10px; color:var(--greenL); font-family:var(--mono); font-weight:700; letter-spacing:0.1em; margin-bottom:8px; }
  .cardio-row { display:flex; align-items:center; gap:10px; padding:8px 0; cursor:pointer; border-top:1px solid var(--line); }
  .cardio-row:first-of-type { border-top:none; }
  .cardio-box { width:24px; height:24px; border-radius:6px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--greenL); font-weight:700; font-size:15px; flex-shrink:0; }
  .cardio-row.done .cardio-box { background:var(--greenBg); border-color:var(--green); }
  .cardio-label { font-size:13px; color:#e0e0e0; }
  .cardio-row.done .cardio-label { color:var(--greenL); }
  .cardio-row.min { justify-content:space-between; align-items:center; }
  .cardio-row.min .cardio-label { flex:1; }
  .minbox { display:flex; align-items:center; gap:5px; flex-shrink:0; }
  .minbox input { width:52px; padding:7px 4px; text-align:center; background:#1a1a1a; border:1px solid var(--line); border-radius:6px; color:#fff; font-size:15px; font-family:var(--mono); }
  .minbox input:focus { outline:none; border-color:var(--green); }
  .cardio-row.min.done .minbox input { border-color:var(--green); color:var(--greenL); }
  .minlbl { font-size:10px; color:var(--dim); font-family:var(--mono); }
  .cardiototal { background:#0d0d0d; border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:10px; }
  .cardiototal.hit { border-color:var(--green); background:var(--greenBg); }
  .cthead { font-size:13px; color:#e0e0e0; font-family:var(--mono); font-weight:700; margin-bottom:7px; }
  .cthead .ctnum { color:var(--greenL); font-size:16px; }
  .ctbar { height:8px; background:#1c1c1c; border-radius:5px; overflow:hidden; }
  .ctbar-fill { height:100%; background:var(--green); border-radius:5px; transition:width 0.3s; }
  .ctcap { font-size:10px; color:var(--dim); font-family:var(--mono); margin-top:5px; text-align:right; }
  .cardiototal.hit .ctcap { color:var(--greenL); }
  .shead.cardioday { background:linear-gradient(135deg,#14331f,#0f2417); }
  .shead.freeday { background:linear-gradient(135deg,#1a2436,#121722); }
  /* ── Day builder: manual blocks + add bar ── */
  .mblocks-wrap { margin-top:14px; }
  .mblock { border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:12px; }
  .mblock-head { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; }
  .mblock-head.str { background:linear-gradient(135deg,var(--red),#6b1414); color:#fff; }
  .mblock-head.cardioday { background:linear-gradient(135deg,#14331f,#0f2417); color:var(--accent); }
  .mblock-head.spot { background:linear-gradient(135deg,#2a2410,#1c180a); color:var(--warn); }
  .mbh-ctl { display:flex; gap:4px; }
  .mbh-btn { background:rgba(255,255,255,0.12); border:none; color:#fff; width:26px; height:26px; border-radius:6px; cursor:pointer; font-size:13px; line-height:1; }
  .mbh-btn.del { background:rgba(240,112,112,0.3); }
  .mblock-body.dim { padding:16px; color:var(--dim); font-size:13px; text-align:center; }
  .addblock { border:1px dashed var(--line); border-radius:12px; padding:14px; margin-top:4px; margin-bottom:12px; }
  .addblock-lbl { font-family:var(--mono); font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px; }
  .addblock-row { display:flex; gap:8px; }
  .ab-btn { flex:1; padding:11px 6px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink); font-size:13px; font-weight:600; cursor:pointer; font-family:var(--mono); }
  .ab-btn:hover { border-color:var(--dim); }
  .engtoggle { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:12px; color:var(--dim); }
  .engtoggle.off { opacity:0.6; }
  .engtoggle b { color:var(--ink); font-weight:700; }
  .et-btn { background:transparent; border:1px solid var(--line); color:var(--dim); padding:6px 10px; border-radius:7px; cursor:pointer; font-size:11px; font-family:var(--mono); white-space:nowrap; }
  /* ── Fasting ── */
  .daytab .dtfast { display:block; font-size:9px; margin-top:2px; filter:grayscale(0.3); opacity:0.75; }
  .daytab .dtfast.full { opacity:1; filter:none; }
  .fastctl { border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px; margin-bottom:12px; background:rgba(91,188,213,0.04); }
  .fastctl-head { font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--blue); margin-bottom:10px; }
  .fastcover { font-size:12px; color:var(--dim); border-left:3px solid var(--line); padding:5px 10px; margin-bottom:10px; border-radius:0 6px 6px 0; }
  .fastcover.full { border-left-color:var(--blue); color:var(--blue); background:rgba(91,188,213,0.08); }
  .fastnote-sm { font-size:12px; color:var(--dim); }
  .fast-btn { width:100%; padding:11px; border-radius:9px; font-size:13px; font-weight:700; font-family:var(--mono); cursor:pointer; border:1px solid var(--line); }
  .fast-btn.legal { background:rgba(95,211,154,0.10); border-color:var(--green); color:var(--green); }
  .fast-btn.illegal { background:rgba(224,201,78,0.08); border-color:var(--warn); color:var(--warn); }
  .fast-btn.remove { background:transparent; color:var(--dim); margin-top:10px; }
  .fastplaced-top { font-size:14px; color:var(--ink); margin-bottom:5px; }
  .fastspan { font-size:12px; color:var(--blue); font-family:var(--mono); line-height:1.5; }
  .fastspan.dim { color:var(--dim); }
  .fastok { font-size:11.5px; color:var(--green); margin-top:7px; }
  .fastwarn { font-size:12px; color:var(--warn); margin-top:8px; line-height:1.5; background:rgba(224,201,78,0.08); border-left:3px solid var(--warn); padding:7px 10px; border-radius:0 6px 6px 0; }
  .fastlen-grid { display:flex; flex-direction:column; gap:8px; margin:10px 0; }
  .fastlen-row { display:flex; align-items:center; gap:10px; }
  .fastlen-lbl { flex:1; font-size:13px; color:var(--ink); }
  .fastlen-in { width:64px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:7px; font-size:14px; font-family:var(--mono); text-align:center; }
  .fastlen-unit { font-size:12px; color:var(--dim); font-family:var(--mono); }
  .restday.cardio { border-left:3px solid var(--green); }
  .cardio-row.slot { justify-content:flex-start; }
  .cardio-row.slot .cardio-label { flex:1; cursor:pointer; }
  .slottime { display:inline-block; min-width:64px; color:var(--dim); font-family:var(--mono); font-size:11px; margin-right:6px; }
  .cardio-row.slot.done .slottime { color:var(--greenL); }
  .recbadge { font-size:9px; color:var(--travL); font-family:var(--mono); border:1px solid #3a2560; border-radius:4px; padding:1px 5px; margin-left:4px; }
  .slotdel { background:none; border:none; color:#6a2a2a; font-size:14px; cursor:pointer; padding:4px 6px; flex-shrink:0; }
  .slotdel:active { color:var(--redL); }
  .addslot { width:100%; margin-top:8px; padding:9px; border-radius:7px; border:1px dashed var(--line); background:transparent; color:var(--greenL); font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; }
  .addslot:active { background:var(--greenBg); }
  /* ── Cardio slot modal ── */
  .slotmodal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; }
  .slotmodal-bg.show { display:flex; }
  .slotmodal { background:#141414; border:1px solid var(--line); border-radius:14px; padding:18px; width:100%; max-width:380px; max-height:90vh; overflow-y:auto; }
  .smtitle { font-size:17px; font-weight:700; color:#fff; margin-bottom:14px; font-family:'Georgia',serif; }
  .smlabel { display:block; font-size:10px; color:var(--dim); font-family:var(--mono); letter-spacing:0.08em; font-weight:700; margin:12px 0 6px; text-transform:uppercase; }
  .sminput { width:100%; padding:11px; background:#1c1c1c; border:1px solid var(--line); border-radius:8px; color:#f0f0f0; font-size:15px; font-family:'Georgia',serif; }
  .sminput:focus { outline:none; border-color:var(--green); }
  .smactions { display:flex; gap:8px; margin-top:18px; }
  .smcancel { flex:1; padding:12px; background:transparent; border:1px solid var(--line); border-radius:8px; color:var(--dim); font-family:var(--mono); font-size:13px; font-weight:700; cursor:pointer; }
  .smsave { flex:2; padding:12px; background:var(--green); border:none; border-radius:8px; color:#fff; font-family:var(--mono); font-size:13px; font-weight:700; cursor:pointer; }
  .smsave:active { opacity:0.85; }
  /* Category badges */
  .catbadge { font-size:9px; font-family:var(--mono); font-weight:700; padding:1px 6px; border-radius:4px; letter-spacing:0.03em; }
  .catbadge.neat { background:#1e3a5f; color:#7db3f0; }
  .catbadge.liss { background:#1a4231; color:#5fd39a; }
  .catbadge.miss { background:#3d3410; color:#e0c94e; }
  .catbadge.hiit { background:#4a2410; color:#f0a05f; }

/* Resolve the effective focus for a given day (handles per-day overrides) */
const DAY_ORDER=["mon","tue","wed","thu","fri","sat","sun"];
function dayFocus(wkObj,dayKey){
  if(wkObj.override && wkObj.override[dayKey]) return wkObj.override[dayKey];
  return wkObj.focus;
}
/* Resolve the effective SESSION for a day (handles per-week session swaps).
   wkObj.sessions[dayKey] can force a session ("lowerA","upper","upperC","rest"). */
function daySession(wkObj,dayKey){
  // 1. explicit manual override for this week+day wins (day-builder, Piece 2+)
  if(wkObj.sessions && wkObj.sessions[dayKey]!==undefined) return wkObj.sessions[dayKey];
  // 2. date/cycle engine: is this calendar date an ACTIVE lift date?
  const ds=dayDate(wkObj,dayKey).iso;
  if(ds && isActiveLift(ds)) return rotationOn(ds);   // → rot1 / rot2 / rot3
  // 3. Sunday (with no pushed-in lift) is a completely free day
  if(ds && isFreeDay(ds)) return "free";
  // 4. otherwise it's a cardio day
  return "zone2";
}
/* A DAYS-like object for a day, respecting session overrides */
function dayInfo(wkObj,dayKey){
  const base=DAYS.find(d=>d.key===dayKey);
  const sess=daySession(wkObj,dayKey);
  if(sess===base.session) return base;
  // build an overridden copy
  let note;
  if(sess==="rest") note = (dayKey==="thu"?"Cycle only · Fast day":"Full rest");
  else if(sess==="free") note = "Free day — no lift, no cardio";
  else note = base.note;
  return {key:dayKey,label:base.label,session:sess,note:note};
}
/* Real calendar date for a given week + day */
function dayDate(wkObj,dayKey){
  const idx=DAY_ORDER.indexOf(dayKey);
  const [y,m,d]=wkObj.start.split("-").map(Number);
  const dt=new Date(y,m-1,d+idx);
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return {
    short:`${MON[dt.getMonth()]} ${dt.getDate()}`,
    full:`${DOW[dt.getDay()]}, ${MON[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`,
    num:dt.getDate(),
    iso:`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`,
  };
}

/* ═══════════════════════════════════════════════════════════
   DATE / CYCLE ENGINE  — Piece 1
   Lifts run on a 72-hour cycle anchored to a real date, drifting
   through the calendar independently of the Mon–Sun week grid.
   The calendar week (week-types, diet breaks, averages) stays as-is;
   this engine only decides WHICH session a given date shows.

   Rulings in effect:
   • Anchor: Mon Nov 24 2026 = lift day 1 (editable via state.liftAnchor).
   • Interval: 72h / 3 days (editable via state.liftInterval).
   • A logged real lift ("did it today") re-anchors the FORWARD cycle;
     only the LATEST logged lift governs the future.
   • A grid lift you lifted LATER than, stays visible as "missed".
   • Rotations (Cycle 1/2/3) advance per lift SLOT, in date order.
   ═══════════════════════════════════════════════════════════ */
const LIFT_ANCHOR_DEFAULT="2026-11-24";
const LIFT_INTERVAL_DEFAULT=3;
const SCHED_HORIZON="2027-05-31";   // build the lift grid out to here

function _liftAnchor(){ return (typeof state!=="undefined" && state.liftAnchor) || LIFT_ANCHOR_DEFAULT; }
function _liftInterval(){ return (typeof state!=="undefined" && state.liftInterval) || LIFT_INTERVAL_DEFAULT; }
function _liftLog(){ return (typeof state!=="undefined" && state.liftLog) || {}; }

function _ymd(dt){return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}
function _parseYMD(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function _daysBetween(a,b){return Math.round((_parseYMD(b)-_parseYMD(a))/86400000);}
function _addDays(s,n){const d=_parseYMD(s);d.setDate(d.getDate()+n);return _ymd(d);}
function _dow(s){return _parseYMD(s).getDay();}            // 0=Sun … 6=Sat
/* Sunday is a free day — a lift that lands on Sunday pushes to Monday. */
function _bumpOffSunday(s){ return _dow(s)===0 ? _addDays(s,1) : s; }

/* Single source of truth: the realized lift schedule.
   Built by STEPPING the 72-hr interval, bumping any lift off Sunday → Monday
   (the bumped Monday becomes what the next step counts from, so the cycle
   shifts forward after a Sunday push). Returns [{date, status}]:
     "logged"    – a real lift you marked done
     "scheduled" – a future grid lift
     "missed"    – a past grid lift (< today) with no logged lift, superseded */
let _schedCache=null,_schedKey="";
function realizedSchedule(){
  const anchor=_liftAnchor(), interval=_liftInterval(), log=_liftLog();
  const today=todayYMD();
  const key=anchor+"|"+interval+"|"+JSON.stringify(log)+"|"+today;
  if(_schedCache && _schedKey===key) return _schedCache;
  const logged=Object.keys(log).filter(d=>log[d]).sort();
  const latest=logged.length?logged[logged.length-1]:null;
  const set=new Map();
  // 1. default grid from anchor → horizon, Sunday-bumped at each step
  for(let d=_bumpOffSunday(anchor),g=0; _daysBetween(d,SCHED_HORIZON)>=0 && g<9999; d=_bumpOffSunday(_addDays(d,interval)),g++) set.set(d,"scheduled");
  // 2. latest logged lift re-anchors the forward cycle (also bump-stepped)
  if(latest){
    for(const d of [...set.keys()]) if(_daysBetween(latest,d)>0) set.delete(d);
    for(let d=_bumpOffSunday(_addDays(_bumpOffSunday(latest),interval)),g=0; _daysBetween(d,SCHED_HORIZON)>=0 && g<9999; d=_bumpOffSunday(_addDays(d,interval)),g++) if(!set.has(d)) set.set(d,"scheduled");
  }
  // 3. mark logged lifts
  logged.forEach(L=>{ if(_daysBetween(anchor,L)>=0) set.set(L,"logged"); });
  // 4. past scheduled (before today, not logged) → missed
  for(const [d,st] of set){ if(st==="scheduled" && _daysBetween(d,today)>0) set.set(d,"missed"); }
  const out=[...set.keys()].sort().map(d=>({date:d,status:set.get(d)}));
  _schedCache=out; _schedKey=key; return out;
}
function invalidateSchedule(){ _schedKey=""; }

function schedFor(ymdStr){ return realizedSchedule().find(x=>x.date===ymdStr)||null; }
function isLiftDate(ymdStr){ return !!schedFor(ymdStr); }                 // any slot (logged/scheduled/missed)
function isActiveLift(ymdStr){ const e=schedFor(ymdStr); return !!e && e.status!=="missed"; }
/* A free day = Sunday that isn't a pushed-in lift. Nothing scheduled, no cardio. */
function isFreeDay(ymdStr){ return _dow(ymdStr)===0 && !isLiftDate(ymdStr); }
function liftSlotIndex(ymdStr){ return realizedSchedule().findIndex(x=>x.date===ymdStr); }
const ROT_SEQ=["rot1","rot2","rot3"];
/* Which rotation a lift date runs — advances per slot, in date order. */
function rotationOn(ymdStr){ const i=liftSlotIndex(ymdStr); return i<0?null:ROT_SEQ[i%3]; }
/* Next lift you still have to do, on or after a date. */
function nextActiveLift(ymdStr){ const e=realizedSchedule().find(x=>_daysBetween(ymdStr,x.date)>=0 && x.status!=="missed"); return e?e.date:null; }
/* Log / unlog a real lift on a date and re-anchor. */
function logLiftOn(ymdStr,on){
  if(typeof state==="undefined")return;
  if(!state.liftLog)state.liftLog={};
  if(on)state.liftLog[ymdStr]=true; else delete state.liftLog[ymdStr];
  invalidateSchedule(); save();
}

function planKey(wk,day){ return `w${wk}_${day}`; }

/* ─── BLOCK TYPES (Piece 3) ────────────────────────────────
   A divider (section heading) can carry a training-style TYPE. It's a label
   only — logging stays uniform. Shown as a badge next to the free section name. */
const BLOCK_TYPES=[
  {v:"",         label:"— none —"},
  {v:"superset", label:"Superset"},
  {v:"straight", label:"Straight sets"},
  {v:"compound", label:"Compound sets"},
  {v:"triset",   label:"Tri-set"},
  {v:"giant",    label:"Giant set"},
  {v:"drop",     label:"Drop sets"},
  {v:"pyramid",  label:"Pyramid sets"},
  {v:"cluster",  label:"Cluster sets"},
  {v:"restpause",label:"Rest-pause"},
];
function blockTypeLabel(v){ const t=BLOCK_TYPES.find(x=>x.v===v); return t?t.label:""; }
/* Badge shown after a section's free label in normal view. */
function blockTypeBadge(v){ return v?`<span class="btype-badge">${blockTypeLabel(v)}</span>`:""; }

/* Per-type template: sets + prescription + rest guidance, applied to every
   exercise in the block when the type is selected (as editable defaults). */
const BLOCK_TYPE_TEMPLATE={
  superset: {sets:2, rx:"8–12 reps · alternate exercises",            rest:"Rest 60–90 s between supersets"},
  straight: {sets:3, rx:"8–12 reps",                                  rest:"Rest 90 s between sets"},
  compound: {sets:3, rx:"8–12 reps · same muscle back-to-back",       rest:"Rest 90 s between sets"},
  triset:   {sets:3, rx:"10–15 reps · 3 exercises in a row",          rest:"Rest 90–120 s after the tri-set"},
  giant:    {sets:4, rx:"10–15 reps · 4+ exercises continuous",       rest:"Rest 120 s after the giant set"},
  drop:     {sets:2, rx:"last set: drop weight ~20%, go to failure",  rest:"Rest 90 s between sets"},
  pyramid:  {sets:4, rx:"ascend weight / descend reps · 12-10-8-6",   rest:"Rest 90–120 s between sets"},
  cluster:  {sets:4, rx:"3–5 reps · 15 s intra-set rest",             rest:"Rest 2–3 min between clusters"},
  restpause:{sets:2, rx:"to failure · 15 s rest · repeat ×2–3",       rest:"Rest 2 min between sets"},
};
/* Apply a type's template to the exercises belonging to the divider at index
   `divIdx` (everything up to the next divider). Editable defaults: block-level
   prescription (blockRx) + rest live on the DIVIDER; each exercise gets the
   sets and inherits the prescription (rxAuto=true) so it isn't repeated under
   every exercise. A hand-edited exercise rx clears rxAuto → shown as override. */
function applyBlockType(list,divIdx,type){
  const tpl=BLOCK_TYPE_TEMPLATE[type];
  if(tpl){ list[divIdx].rest=tpl.rest; list[divIdx].blockRx=tpl.rx; }
  else { delete list[divIdx].rest; delete list[divIdx].blockRx; }
  if(!tpl) return;   // "— none —" leaves exercises as-is
  for(let i=divIdx+1;i<list.length;i++){
    if(list[i].div) break;           // reached the next block
    list[i].sets=tpl.sets;
    list[i].rx=tpl.rx;
    list[i].rxAuto=true;             // inherits the block prescription
  }
}
/* <select> for editing a divider's type. onChangeFn is the update function name. */
function blockTypeSelect(curr,onChangeFn,idx){
  let s=`<select class="btype-sel" onchange="${onChangeFn}(${idx},'type',this.value)">`;
  BLOCK_TYPES.forEach(t=>{ s+=`<option value="${t.v}" ${t.v===(curr||'')?'selected':''}>${t.label}</option>`; });
  s+=`</select>`;
  return s;
}
/* Normal-view block heading. When a type is set, the TYPE name is the title and
   the block's prescription + rest show as one subtext line. The free label (e.g.
   "SUPERSET 1" or "Arms") becomes a small tag so you keep your own naming. */
function renderBlockHeading(ex,hypCls){
  const typeName=ex.type?blockTypeLabel(ex.type):"";
  const title = typeName || ex.div || "Block";
  const tag   = (typeName && ex.div && ex.div.toLowerCase()!==typeName.toLowerCase()) ? ex.div : "";
  const sub=[]; if(ex.blockRx) sub.push(ex.blockRx); if(ex.rest) sub.push(ex.rest);
  let h=`<div class="exdiv ${hypCls}">${esc(title)}${tag?`<span class="bhead-tag">${esc(tag)}</span>`:""}</div>`;
  if(sub.length) h+=`<div class="bhead-sub">${esc(sub.join("  ·  "))}</div>`;
  return h;
}

/* ─── BLOCK OVERLAY (Piece 2 — day builder) ────────────────
   A day = the engine's auto block (lift on lift dates, else cardio)
   PLUS any manual blocks you pin to that calendar date. Manual blocks
   add ON TOP of the engine and stay put through cycle drift; they're
   keyed by ISO date, not (week,day), so re-anchoring never moves them.

   state.dayBlocks[iso]  = [ {id, type:'lift'|'cardio'|'spot', label} ]
   state.dayHidden[iso]  = true  → the engine's auto block is removed that day
   ─────────────────────────────────────────────────────────── */
function dayBlocksFor(iso){ return (state.dayBlocks && state.dayBlocks[iso]) || []; }
function engineHidden(iso){ return !!(state.dayHidden && state.dayHidden[iso]); }
function blockId(){ return 'b'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function addDayBlock(iso,type,label){
  if(!state.dayBlocks)state.dayBlocks={};
  if(!state.dayBlocks[iso])state.dayBlocks[iso]=[];
  state.dayBlocks[iso].push({id:blockId(),type,label:label||''});
  save();
}
function removeDayBlock(iso,id){
  if(state.dayBlocks && state.dayBlocks[iso]){
    state.dayBlocks[iso]=state.dayBlocks[iso].filter(b=>b.id!==id);
    if(!state.dayBlocks[iso].length) delete state.dayBlocks[iso];
    save();
  }
}
function moveDayBlock(iso,id,dir){
  const arr=state.dayBlocks&&state.dayBlocks[iso]; if(!arr)return;
  const i=arr.findIndex(b=>b.id===id); if(i<0)return;
  const j=i+dir; if(j<0||j>=arr.length)return;
  [arr[i],arr[j]]=[arr[j],arr[i]]; save();
}
function setEngineHidden(iso,hidden){
  if(!state.dayHidden)state.dayHidden={};
  if(hidden)state.dayHidden[iso]=true; else delete state.dayHidden[iso];
  save();
}
/* The engine's auto block type for a date: 'lift' | 'cardio' | null(free). */
function engineBlockType(wkObj,dayKey){
  const sess=daySession(wkObj,dayKey);
  if(sess==="free"||sess==="rest") return null;
  if(sess==="zone2") return "cardio";
  return "lift";   // rot1/rot2/rot3
}
/* Every block type present on a day (engine's auto block + manual blocks). */
function dayBlockTypes(wkObj,dayKey){
  const iso=dayDate(wkObj,dayKey).iso;
  const types=[];
  const eng=engineBlockType(wkObj,dayKey);
  if(eng && !engineHidden(iso)) types.push(eng);
  dayBlocksFor(iso).forEach(b=>types.push(b.type));
  return types;
}
/* The day's single headline label: Lift wins → then Cardio → then Rest & Recovery.
   (Spot training counts as Cardio-tier — it's training, not rest.) */
function dayLabel(wkObj,dayKey){
  const t=dayBlockTypes(wkObj,dayKey);
  if(t.includes("lift"))   return "Lift";
  if(t.includes("cardio")||t.includes("spot")) return "Cardio";
  return "Rest & Recovery";
}
const DAY_LABEL_CLS={ "Lift":"str", "Cardio":"cardioday", "Rest & Recovery":"freeday" };

/* ─── FASTING ENGINE (Piece 4) ─────────────────────────────
   You place a fast by its START date; the app computes which days it covers
   from the fast length (per week type) assuming an evening (8 PM) start.
   Conflict rule: a fast may never have a FULL fasted day that is a Lift day,
   nor a full fasted day immediately before a Lift day. Partial edge days
   (the start evening, the end morning) don't block. Enforcement is SOFT:
   the app warns with a reason but lets you place it anyway.

   state.fasts[startIso]   = true      (a fast starts here)
   state.fastLen           = {standard, sprint, dietbreak} hours, editable
   ─────────────────────────────────────────────────────────── */
const FAST_START_HOUR=20; // 8 PM
const FAST_LEN_DEFAULT={standard:40,sprint:48,dietbreak:0};
function fastLenFor(wtype){
  const fl=(state.fastLen)||{};
  const v=fl[wtype]; return (v!==undefined && v!==null)?v:(FAST_LEN_DEFAULT[wtype]!==undefined?FAST_LEN_DEFAULT[wtype]:40);
}
/* Is an ISO date a Lift day on the current composed schedule? */
function isoIsLiftDay(iso){
  const hit=weekDayForIso(iso);
  if(!hit) return false;
  return dayLabel(hit.wkObj,hit.dayKey)==="Lift";
}
/* Map an ISO date back to its (wkObj, dayKey) in the fixed calendar grid. */
function weekDayForIso(iso){
  for(const w of WEEKS){
    for(const dk of DAY_ORDER){
      if(dayDate(w,dk).iso===iso) return {wkObj:w,dayKey:dk};
    }
  }
  return null;
}
/* The week type governing a fast that starts on an ISO date. */
function weekTypeForIso(iso){
  const hit=weekDayForIso(iso);
  return hit?hit.wkObj.wtype:"standard";
}
/* Fast span from a start date: all touched days + the fully-fasted days. */
function fastSpan(startIso,lenHrs){
  const start=_parseYMD(startIso); start.setHours(FAST_START_HOUR,0,0,0);
  const end=new Date(start.getTime()+lenHrs*3600000);
  const covers=[]; let d=new Date(start.getFullYear(),start.getMonth(),start.getDate());
  const endDay=new Date(end.getFullYear(),end.getMonth(),end.getDate());
  while(d<=endDay){ covers.push(_ymd(d)); d.setDate(d.getDate()+1); }
  const full=covers.filter(iso=>{
    const ds=_parseYMD(iso); const de=new Date(ds.getFullYear(),ds.getMonth(),ds.getDate()+1);
    return start<=ds && end>=de;
  });
  const endsNoon = end.getHours()<18;
  return {covers,full,endIso:_ymd(endDay),end,
    endLabel:`${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][end.getDay()]} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][end.getMonth()]} ${end.getDate()}, ${endsNoon?'noon':(end.getHours()+':00')}`};
}
/* Returns a conflict reason string, or null if the fast is legal. */
function fastConflict(startIso){
  const wt=weekTypeForIso(startIso);
  const len=fastLenFor(wt);
  if(len<=0) return `${wt==='dietbreak'?'Diet-break weeks have no fasts':'Fast length is 0'} — eat at maintenance.`;
  const {full}=fastSpan(startIso,len);
  for(const d of full){ if(isoIsLiftDay(d)) return `a full fast day (${_fmtShort(d)}) lands on a lift day.`; }
  for(const d of full){ if(isoIsLiftDay(_addDays(d,1))) return `a full fast day (${_fmtShort(d)}) sits the day before your ${_fmtShort(_addDays(d,1))} lift.`; }
  return null;
}
function _fmtShort(iso){const d=_parseYMD(iso);return `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]} ${d.getDate()}`;}
function hasFast(iso){ return !!(state.fasts && state.fasts[iso]); }
function toggleFast(iso){

/* Is this ISO date covered by ANY placed fast (for day-tab/ header markers)? */
function dateInAnyFast(iso){
  if(!state.fasts) return null;
  for(const s in state.fasts){ if(!state.fasts[s])continue;
    const len=fastLenFor(weekTypeForIso(s));
    if(len<=0)continue;
    const {covers,full}=fastSpan(s,len);
    if(covers.includes(iso)) return {start:s, full:full.includes(iso)};
  }
  return null;
}

/* Render one MANUAL block pinned to a date. edit=true adds remove/reorder. */

  let h=`<div class="mblock">`;

/* The manual-blocks appendix for a day, plus (in edit mode) the add-block bar. */
/* Fasting control for a day: place/remove a fast start + span preview + warning. */
function renderFastControl(wkObj,dayKey){
  const iso=dayDate(wkObj,dayKey).iso;
  const wt=wkObj.wtype;
  const len=fastLenFor(wt);
  const placed=hasFast(iso);
  const cover=dateInAnyFast(iso);   // is this day inside some OTHER fast?
  let h=`<div class="fastctl">`;
  h+=`<div class="fastctl-head">🕐 Fasting</div>`;

  // If this day is covered by a fast that STARTS elsewhere, show that.
  if(cover && cover.start!==iso){
    h+=`<div class="fastcover ${cover.full?'full':''}">${cover.full?'Full fast day':'Fasting (partial)'} · part of the fast starting ${_fmtShort(cover.start)}</div>`;
  }

  if(len<=0){
    h+=`<div class="fastnote-sm">No fasts this week — ${wt==='dietbreak'?'diet break, eat at maintenance':'fast length set to 0'}.</div>`;
    h+=`</div>`; return h;
  }

  if(placed){
    const sp=fastSpan(iso,len);
    h+=`<div class="fastplaced">`;
    h+=`<div class="fastplaced-top"><b>Fast starts here</b> · ${len} hr</div>`;
    h+=`<div class="fastspan">8 PM ${_fmtShort(iso)} → ${sp.endLabel} · covers ${sp.covers.map(_fmtShort).join(" · ")}</div>`;
    h+=`<div class="fastspan dim">Full fast ${sp.full.length?'day: '+sp.full.map(_fmtShort).join(", "):'— none (partial only)'}</div>`;
    const conf=fastConflict(iso);
    if(conf) h+=`<div class="fastwarn">⚠ Heads up: ${conf} You can keep it, but it breaks the lift-recovery rule.</div>`;
    h+=`<button class="fast-btn remove" onclick="toggleFast('${iso}');renderLog()">✕ Remove fast</button>`;
    h+=`</div>`;
  } else {
    const conf=fastConflict(iso);
    const legal=!conf;
    h+=`<button class="fast-btn ${legal?'legal':'illegal'}" onclick="toggleFast('${iso}');renderLog()">${legal?'✓ Start a '+len+'hr fast here':'⚠ Start fast here anyway'}</button>`;
    if(conf) h+=`<div class="fastwarn">⚠ ${conf}</div>`;
    else h+=`<div class="fastok">This is a legal fast start — clear of lifts.</div>`;
  }
  h+=`</div>`;
  return h;
}

function renderDayBuilder(wkObj,dayKey,edit){
  const iso=dayDate(wkObj,dayKey).iso;

    h+=`<button class="ab-btn" onclick="addDayBlock('${iso}','spot');renderLog()">🎯 Spot</button>`;

/* Copy this day's setup to other days */
function copyDayTo(){
  const wkObj=curWeek();
  const src=planExercises(wkObj,state.day);
  const input=prompt("Copy this day's exercises to which weeks? Enter week numbers separated by commas (e.g. 5,7,9), or 'all' for every week with the same weekday.");
  if(!input)return;
  let targets=[];
  if(input.trim().toLowerCase()==="all"){
    targets=WEEKS.map(w=>w.wk).filter(n=>n!==wkObj.wk);
  } else {
    targets=input.split(",").map(s=>parseInt(s.trim())).filter(n=>n>=1&&n<=WEEKS.length&&n!==wkObj.wk);
  }
  if(targets.length===0){ toast("No valid weeks"); return; }
  if(!state.plan) state.plan={};
  let n=0;
  targets.forEach(w=>{
    state.plan[planKey(w,state.day)]=JSON.parse(JSON.stringify(src));
    n++;
  });
  save(); toast(`Copied to ${n} week${n!==1?'s':''}`);

/* Apply this day's setup to ALL FUTURE days of the same session type.
   "Future" = date today or later. Past days are left untouched (non-retroactive). */
function countMatchingForward(){
  const wkObj=curWeek();
  const mySession=daySession(wkObj,state.day);
  const today=todayYMD();
  let count=0;
  WEEKS.forEach(w=>{
    DAY_ORDER.forEach(dk=>{
      // date of this candidate day
      const idx=DAY_ORDER.indexOf(dk);
      const [y,mm,dd]=w.start.split("-").map(Number);
      const dt=new Date(y,mm-1,dd+idx);
      const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      if(ds<today) return;                       // skip past — non-retroactive
      if(w.wk===wkObj.wk && dk===state.day) return; // skip the source day itself
      if(daySession(w,dk)===mySession) count++;
    });
  });
  return count;
}
function applyToMatchingForward(){
  const wkObj=curWeek();
  const mySession=daySession(wkObj,state.day);
  const src=planExercises(wkObj,state.day);
  const today=todayYMD();
  if(!state.plan) state.plan={};
  let n=0;
  WEEKS.forEach(w=>{
    DAY_ORDER.forEach(dk=>{
      const idx=DAY_ORDER.indexOf(dk);
      const [y,mm,dd]=w.start.split("-").map(Number);
      const dt=new Date(y,mm-1,dd+idx);
      const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      if(ds<today) return;
      if(w.wk===wkObj.wk && dk===state.day) return;
      if(daySession(w,dk)===mySession){
        state.plan[planKey(w.wk,dk)]=JSON.parse(JSON.stringify(src));
        n++;
      }
    });
  });
  save();
  return n;
}
/* The Apply-changes dialog */
function openApplyScope(){
  const wkObj=curWeek();
  const mySession=daySession(wkObj,state.day);
  const label=SESSION_LABEL[mySession]||mySession;
  const cnt=countMatchingForward();
  const msg=`Apply this day's exercises to ALL future ${label} days?\n\nThis updates ${cnt} upcoming ${label} day${cnt!==1?'s':''} (today onward). Past days are left unchanged.\n\nOK = all future ${label} days\nCancel = keep it to just this day`;
  if(cnt===0){ toast("No future matching days"); return; }
  if(confirm(msg)){
    const n=applyToMatchingForward();
    toast(`Applied to ${n} ${label} day${n!==1?'s':''}`);
    renderLog();

  }
}

/* One-time cleanup: for any custom plan whose block was typed before rxAuto existed,
   infer blockRx from the type and mark exercises that match it as inherited, so the
   heading carries the prescription once instead of it repeating under each exercise. */
function migrateBlockRx(){
  const fix=(list)=>{
    if(!Array.isArray(list))return;
    let curDiv=-1;
    for(let i=0;i<list.length;i++){
      if(list[i].div){
        curDiv=i;
        if(list[i].type && !list[i].blockRx){
          const tpl=BLOCK_TYPE_TEMPLATE[list[i].type];
          if(tpl){ list[i].blockRx=tpl.rx; if(!list[i].rest)list[i].rest=tpl.rest; }
        }
      } else if(curDiv>=0 && list[curDiv].blockRx && list[i].rxAuto===undefined){
        if(list[i].rx===list[curDiv].blockRx) list[i].rxAuto=true;
      }
    }
  };
  if(state.plan) for(const k in state.plan) fix(state.plan[k]);
  if(Array.isArray(state.spotPlan)) fix(state.spotPlan);
}

      ["cardio_entries",k.cardio_entries,"user_id,week,day,entry_id"],
      ["exercise_done",k.exercise_done,"user_id,week,day,exercise_index"],
      ["prs",k.prs,"user_id,pr_id,entry_idx"],
    ];
    for(const [tbl,rows,conflict] of ups){ if(rows.length) await sb.from(tbl).upsert(rows,{onConflict:conflict}); }
    setSyncStamp();
  }catch(e){ console.warn("cloud push failed",e); }
  cloudBusy=false; updateAuthUI();
}

/* ---- CLOUD PULL (rebuild state from rows) ---- */
async function cloudPullAll(){
  if(!sb||!sbUser)return;
  const U=sbUser.id;
  const [meta,lifts,fasts,blocks,weigh,steps,nutri,sets,cardio,exdone,prs]=await Promise.all([
    sb.from("app_meta").select("*").eq("user_id",U).maybeSingle(),
    sb.from("lift_log").select("*").eq("user_id",U),
    sb.from("fasts").select("*").eq("user_id",U),
    sb.from("day_blocks").select("*").eq("user_id",U),
    sb.from("weigh_ins").select("*").eq("user_id",U),
    sb.from("steps").select("*").eq("user_id",U),
    sb.from("nutrition").select("*").eq("user_id",U),
    sb.from("set_logs").select("*").eq("user_id",U),
    sb.from("cardio_entries").select("*").eq("user_id",U),
    sb.from("exercise_done").select("*").eq("user_id",U),
    sb.from("prs").select("*").eq("user_id",U),
  ]);
  const m=meta.data;
  if(m){
    state.week=m.cur_week||1; state.day=m.cur_day||"mon";
    state.plan=m.plan_json||{}; state.titles=m.titles_json||{}; state.wknotes=m.wknotes_json||{};
    state.notes=m.notes_json||{}; state.completed=m.completed_json||{}; state.notesOpen=m.notes_open_json||{};
    state.restingHR=m.resting_hr_json||[];
    state.liftAnchor=m.lift_anchor||"2026-11-24"; state.liftInterval=m.lift_interval||3;
    state.dayHidden=m.day_hidden_json||{}; state.spotPlan=(m.spot_plan_json==null?undefined:m.spot_plan_json);
    state.fastLen=m.fast_len_json||{standard:40,sprint:48,dietbreak:0};
  }
  state.liftLog={}; (lifts.data||[]).forEach(r=>state.liftLog[r.date]=true);
  state.fasts={};   (fasts.data||[]).forEach(r=>state.fasts[r.start_date]=true);
  state.dayBlocks={}; (blocks.data||[]).slice().sort((a,b)=>a.position-b.position).forEach(r=>{
    (state.dayBlocks[r.date]=state.dayBlocks[r.date]||[]).push({id:r.block_id,type:r.block_type,label:r.label||""}); });
  state.weights={}; (weigh.data||[]).forEach(r=>state.weights[r.date]=r.weight_lbs);
  state.steps={};   (steps.data||[]).forEach(r=>state.steps[r.date]=r.steps);
  state.nutrition={}; (nutri.data||[]).forEach(r=>state.nutrition[r.date]={cals:r.cals,burned:r.burned,protein:r.protein,fat:r.fat,carbs:r.carbs,water:r.water});
  state.logs={}; (sets.data||[]).forEach(r=>{ const lk=`w${r.week}_${r.day}`; (state.logs[lk]=state.logs[lk]||{}); (state.logs[lk][r.exercise_index]=state.logs[lk][r.exercise_index]||{});
    state.logs[lk][r.exercise_index][r.set_number]={wt:r.weight,reps:r.reps,repsL:r.reps_l,repsR:r.reps_r}; });
  state.cardioEntries={}; (cardio.data||[]).forEach(r=>{ const ck=`w${r.week}_${r.day}`; (state.cardioEntries[ck]=state.cardioEntries[ck]||[]).push(
    {id:r.entry_id,label:r.label,time:r.time_of_day,done:r.done,mins:{LISS:r.liss_min,MISS:r.miss_min,HIIT:r.hiit_min,SIT:r.sit_min}}); });
  state.exDone={}; (exdone.data||[]).forEach(r=>state.exDone[`w${r.week}_${r.day}_${r.exercise_index}`]=true);
  state.prs={}; (prs.data||[]).slice().sort((a,b)=>a.entry_idx-b.entry_idx).forEach(r=>{ (state.prs[r.pr_id]=state.prs[r.pr_id]||[]).push(r.value_json); });
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
}

/* HTML-escape for values placed into input value="" attributes */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toggleEdit(){ state.editMode=!state.editMode; save(); renderLog(); window.scrollTo(0,0); }

/* ─── RENDER LOG ───────────────────────────────────────── */
function renderLog(){
  const v=document.getElementById("view-log");
  const wkObj=curWeek();
  const ph=PHASES[wkObj.phase];
  const dayObj=dayInfo(wkObj,state.day);
  const edit=!!state.editMode;

  // Effective focus for THIS day (respects per-day overrides)
  const dFocus=dayFocus(wkObj,state.day);
  const isStr=dFocus==="strength";
  const isTravel=dFocus==="travel";
  const isOff=dFocus==="off";
  const dDate=dayDate(wkObj,state.day);

  let html="";

  // Week nav
  const wkLabel=wkObj.wtype==="dietbreak"?"Diet Break":wkObj.wtype==="sprint"?"Sprint":"Standard";
  const todayHit=resolveToday();
  const isToday=todayHit && todayHit.week===state.week && todayHit.day===state.day;
  html+=`<div class="weeknav">`;
  html+=`<button onclick="changeWeek(-1)" ${state.week===1?'disabled style="opacity:0.3"':''}>‹</button>`;
  html+=`<div class="wkinfo"><div class="wknum">Week ${wkObj.wk}</div><div class="wkmeta">${wkObj.dates} · ${wkLabel}</div></div>`;
  html+=`<button onclick="changeWeek(1)" ${state.week===WEEKS.length?'disabled style="opacity:0.3"':''}>›</button>`;
  html+=`</div>`;
  if(!isToday && todayHit){
    html+=`<button class="todaybtn" onclick="jumpToToday(false)">📅 Jump to Today</button>`;
  }

  // Week picker dots
  html+=`<div class="weekpicker">`;
  WEEKS.forEach(w=>{
    const on=w.wk===state.week?'on':'';
    const cls=w.wtype==='dietbreak'?'db':w.wtype==='sprint'?'sprint':'str';
    const tw=(todayHit && todayHit.week===w.wk)?'thisweek':'';
    html+=`<div class="wkdot ${cls} ${on} ${tw}" onclick="gotoWeek(${w.wk})">${w.wk}</div>`;
  });
  html+=`</div>`;

  // Diet-break banner for the whole week
  if(wkObj.wtype==="dietbreak"){
    html+=`<div class="dbbanner">🍽 DIET BREAK WEEK · eat at maintenance, no fasts · same lifting & cardio</div>`;
  }
  // Sprint banner for the whole week
  if(wkObj.wtype==="sprint"){
    html+=`<div class="sprintbanner">🏃 SPRINT WEEK · extra ~40 hr fast · Fri 8 PM → Sun noon · Sunday refeed · lifting & cardio unchanged</div>`;
  }

  // Week note (editable). Suppress the DEFAULT note on banner weeks (diet break /
  // sprint) since the banner above already states it — avoids a duplicate line.
  const wn=getWeekNote(wkObj);
  const hasBanner=(wkObj.wtype==="dietbreak"||wkObj.wtype==="sprint");
  const isDefaultNote=(wn===wkObj.note);
  const showNote=wn && !(hasBanner && isDefaultNote);
  if(edit){
    html+=`<div class="weeknote edit"><label class="elabel">WEEK NOTE</label><textarea class="enote" onchange="setWeekNote(this.value);renderLog()" placeholder="Week note…">${esc(wn||'')}</textarea></div>`;
  } else if(showNote){
    html+=`<div class="weeknote ${wkObj.override||wkObj.focus==='travel'?'trav':''}">${wn}</div>`;
  }

  // Day tabs — now show the date under each day
  html+=`<div class="daytabs">`;
  DAYS.forEach(d=>{
    const logged=!!state.completed[completedKey(state.week,d.key)];
    const f=dayFocus(wkObj,d.key);
    const dt=dayDate(wkObj,d.key);
    const fcls=f==="off"?"offday":f==="travel"?"travday":"";
    const tcls=(todayHit && todayHit.week===state.week && todayHit.day===d.key)?"istoday":"";
    const lab=dayLabel(wkObj,d.key);
    const labCls=lab==="Lift"?"L":lab==="Cardio"?"C":"R";
    const fastInfo=dateInAnyFast(dt.iso);
    html+=`<div class="daytab ${state.day===d.key?'on':''} ${logged?'logged':''} ${fcls} ${tcls}" onclick="setDay('${d.key}')">`;
    html+=`<span class="dtl">${d.label}</span><span class="dtd">${dt.num}</span>`;
    html+=`<span class="dtlab ${labCls}">${labCls}</span>`;
    if(fastInfo) html+=`<span class="dtfast ${fastInfo.full?'full':''}" title="Fasting">🕐</span>`;
    html+=`</div>`;
  });
  html+=`</div>`;

  // Sprint-week fast markers for the selected day
  if(wkObj.wtype==="sprint"){
    if(state.day==="fri") html+=`<div class="fastnote">🔴 <b>Fast begins 8 PM tonight</b> — last food by 8 PM, then ~40 hr fast through Saturday.</div>`;
    else if(state.day==="sat") html+=`<div class="fastnote">🔴 <b>Fast day</b> — 8 PM Fri → noon Sun. Water, electrolytes, black coffee only. Lifting & cardio unchanged.</div>`;
    else if(state.day==="sun") html+=`<div class="fastnote">🟢 <b>Refeed day</b> — break the fast at noon. Eat to refuel; prioritize protein.</div>`;
  }

  // Edit toggle
  const custom=isCustom(wkObj,state.day);
  html+=`<button class="editbtn ${edit?'on':''}" onclick="toggleEdit()">${edit?'✓ Done Editing':'✎ Edit This Day'}${(!edit&&custom)?' <span class="cdot">•</span>':''}</button>`;
  if(edit) html+=`<div class="edithint">Editing <b>this day only</b>. Changes don't affect other days — use "Copy Day To…" to push them elsewhere.</div>`;

  // ── BLOCK OVERLAY (Piece 2) ──
  // A day = engine's auto block + manual blocks pinned to the date.
  // If the engine block is hidden, skip the engine render entirely and show
  // only the manual blocks (or an empty day) + the builder.
  const _iso=dDate.iso;
  const _engType=engineBlockType(wkObj,state.day);
  const _engHidden=engineHidden(_iso);
  const _dayLab=dayLabel(wkObj,state.day);
  const _dayLabCls=DAY_LABEL_CLS[_dayLab]||'freeday';
  // Shared tail: manual blocks + add-block bar + notes, then commit.
  const dayTail=(isStr)=>{ html+=renderDayBuilder(wkObj,state.day,edit); html+=renderNotes(!!isStr); v.innerHTML=html; };

  if(_engHidden){
    const mb=dayBlocksFor(_iso);
    html+=`<div class="shead ${_dayLabCls}"><div class="stag">${dayObj.label} · ${dDate.short} · ${_dayLab.toUpperCase()}</div><div class="stitle">${_dayLab}</div></div>`;
    if(!mb.length) html+=`<div class="restday">The cycle's block is hidden for this day.<br><small style="color:var(--dim)">Add a block below, or restore the cycle's block.</small></div>`;
    dayTail(false);
    return;
  }

  // ── OFF DAY ──
  if(isOff){
    html+=`<div class="shead off"><div class="stag">${dayObj.label} · ${dDate.short}</div><div class="stitle">No Training — Travel Day</div></div>`;
    html+=`<div class="restday">`;
    html+=`✈️ Travel day.<br><small style="color:var(--dim)">No structured training. Move if you can, hydrate, stay in your deficit.</small>`;
    html+=`</div>`;
    dayTail(false);
    return;
  }

  // ── TRAVEL DAY: 3-block structured day ──
  if(isTravel){
    html+=renderTravelDay(dDate);
    dayTail(false);
    return;
  }

  // ── FREE DAY (Sunday — no lift, no cardio by the cycle) ──
  // May still carry manual blocks → label resolves to Lift/Cardio accordingly.
  if(dayObj.session==="free"){
    html+=`<div class="shead ${_dayLabCls}"><div class="stag">${dayObj.label} · ${dDate.short} · ${_dayLab.toUpperCase()}</div><div class="stitle">${_dayLab}</div></div>`;
    if(_dayLab==="Rest & Recovery") html+=`<div class="restday">🌿 Rest & Recovery.<br><small style="color:var(--dim)">No lifting, no cardio. Rest, recover, live your life.</small></div>`;
    dayTail(false);
    return;
  }

  // ── CARDIO ONLY DAY (no lifting) ──
  if(dayObj.session==="zone2"){
    html+=`<div class="shead ${_dayLabCls}"><div class="stag">${dayObj.label} · ${dDate.short} · ${_dayLab.toUpperCase()}</div><div class="stitle">${_dayLab}</div></div>`;
    html+=zone2Block(false);
    if(spotTrainingToday()) html+=spotTrainingBlock(edit);
    dayTail(false);
    return;
  }

  // ── REST DAY (normal weeks) ──
  if(dayObj.session==="rest"){
    const restColor=isStr?'str':'hyp';
    html+=`<div class="shead ${restColor}"><div class="stag">${dayObj.label} · ${dDate.short}</div><div class="stitle">${dayObj.note}</div></div>`;
    html+=`<div class="restday">`;
    html+=dayObj.key==="thu"?`🚲 1 hr fasted cycling · 130–150 bpm<br><small style="color:var(--dim)">Drop to 115–125 if genuinely weak. No lifting.</small>`:`🛑 Complete rest.<br><small style="color:var(--dim)">No cycling, no lifting. Recover.</small>`;
    html+=`</div>`;
    dayTail(isStr);
    return;
  }

  // ── TRAINING SESSION (lifting day) ──
  let defTitle, defTag, headColor;
  {
    const names={rot1:"Cycle 1",rot2:"Cycle 2",rot3:"Cycle 3"};
    const dayNames={mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",sat:"Saturday",sun:"Sunday"};
    const dayName=dayNames[state.day]||dayObj.label;
    defTitle=names[dayObj.session]||"Lifting Day";
    defTag=`${dayName} · ${dDate.short} · LIFTING DAY`;
    headColor='str';
  }
  const T=getTitle(wkObj,state.day,defTitle,defTag);

  // Rotation banner (shows which rotation this day runs)
  html+=`<div class="goalbanner"><span class="gbgoal">${ROT_LABEL[dayObj.session]||'Lifting Day'}</span><span class="gbsep">|</span><span class="gbname">${dayObj.label} · ${dDate.short}${isToday?' · TODAY':''}</span></div>`;

  // Session header — only in edit mode (so title stays editable). Normal view uses section headers only.
  if(edit){
    html+=`<div class="shead ${headColor}">`;
    html+=`<input class="ehead-tag" value="${esc(T.tag)}" onchange="setTitle('tag',this.value);renderLog()">`;
    html+=`<input class="ehead-title" value="${esc(T.title)}" onchange="setTitle('title',this.value);renderLog()">`;
    html+=`</div>`;
  }

  // Zone 2 prescription for lifting days (AM bike / warm-up / incline walk / PM bike + timing)
  html+=zone2Block(true);

  // Rules reference (collapsible)
  html+=`<details class="rulesbox"><summary>Lifting rules</summary><ul>`;
  html+=`<li>Rest 60–90 seconds between supersets.</li>`;
  html+=`<li>Take each set to 1–2 reps short of failure.</li>`;
  html+=`<li>Hit the top of the rep range on both sets → add the smallest weight jump next session.</li>`;
  html+=`<li>Good mornings: start light, go slow down, stop where your back starts to round.</li>`;
  html+=`<li>Keep Zone 2 at 141–152 bpm.</li>`;
  html+=`</ul></details>`;

  const exercises=planExercises(wkObj,state.day);
  const lk=logKey();
  const dayLog=state.logs[lk]||{};

  exercises.forEach((ex,ei)=>{
    // ── DIVIDER / BLOCK HEADING ──
    if(ex.div){
      if(edit){
        html+=`<div class="ex editrow"><div class="exrow">`;
        html+=`<div class="editbar">`;
        html+=`<span class="etype">BLOCK HEADING</span>`;
        html+=`<span class="ebtns">`;
        html+=`<button onclick="moveExercise(${ei},-1)">↑</button>`;
        html+=`<button onclick="moveExercise(${ei},1)">↓</button>`;
        html+=`<button class="del" onclick="removeExercise(${ei})">✕</button>`;
        html+=`</span></div>`;
        html+=`<input class="einput" value="${esc(ex.div)}" placeholder="Section label (e.g. Arms, Compound)" onchange="updateExercise(${ei},'div',this.value)">`;
        html+=`<div class="btype-row"><span class="btype-lbl">Block type</span>${blockTypeSelect(ex.type,'updateExercise',ei)}</div>`;
        html+=`</div></div>`;
      } else {
        html+=renderBlockHeading(ex, isStr?'':'hyp');
      }
      return;
    }

    // ── EXERCISE ──
    const exLog=dayLog[ei]||{};
    html+=`<div class="ex ${edit?'editrow':''}"><div class="exrow">`;

    if(edit){
      html+=`<div class="editbar">`;
      html+=`<span class="etype">EXERCISE ${ei+1}</span>`;
      html+=`<span class="ebtns">`;
      html+=`<button onclick="moveExercise(${ei},-1)">↑</button>`;
      html+=`<button onclick="moveExercise(${ei},1)">↓</button>`;
      html+=`<button class="del" onclick="removeExercise(${ei})">✕</button>`;
      html+=`</span></div>`;
      html+=`<input class="einput bold" value="${esc(ex.n)}" placeholder="Exercise name" onchange="updateExercise(${ei},'n',this.value)">`;
      html+=`<input class="einput" value="${esc(ex.rx)}" placeholder="Prescription (e.g. 3 sets · failure)" onchange="updateExercise(${ei},'rx',this.value)">`;
      html+=`<div class="eopts">`;
      html+=`<label>Sets <input type="number" min="1" max="10" value="${ex.sets||3}" onchange="updateExercise(${ei},'sets',this.value)"></label>`;
      html+=`<label class="chk ${ex.lr?'on':''}" onclick="updateExercise(${ei},'lr')">${ex.lr?'☑':'☐'} L/R inputs</label>`;
      html+=`</div>`;
      html+=`</div></div>`;
      return;
    }

    const exChecked=isExDone(state.week,state.day,ei);
    // Show per-exercise prescription only when it's an OVERRIDE (not inherited from the block).
    const showRx = ex.rx && ex.rxAuto!==true;
    html+=`<div class="exnamerow"><span class="excheck ${exChecked?'on':''}" onclick="toggleExDone(${ei})">${exChecked?'✓':''}</span><div class="exnamewrap"><div class="exname ${exChecked?'done':''}">${ex.n}</div>${showRx?`<div class="exrx">${esc(ex.rx)}</div>`:''}</div></div>`;
    html+=`<div class="setgrid">`;
    // header row
    if(ex.lr){
      html+=`<div class="sethdr lr"><span>SET</span><span>WT</span><span>L</span><span>R</span></div>`;
    } else {
      html+=`<div class="sethdr"><span>SET</span><span>WT</span><span>REPS</span></div>`;
    }
    for(let s=0;s<ex.sets;s++){
      const sd=exLog[s]||{};
      if(ex.lr){
        html+=`<div class="setrow lr ${ex.pr?'pr':''}"><span class="setnum">${s+1}</span>`;
        html+=`<input type="text" inputmode="numeric" maxlength="3" class="wt" value="${sd.wt||''}" placeholder="–" onchange="logSet(${ei},${s},'wt',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')">`;
        html+=`<input type="text" inputmode="numeric" maxlength="3" class="reps" value="${sd.repsL||''}" placeholder="–" onchange="logSet(${ei},${s},'repsL',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')">`;
        html+=`<input type="text" inputmode="numeric" maxlength="3" class="reps" value="${sd.repsR||''}" placeholder="–" onchange="logSet(${ei},${s},'repsR',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')">`;
        html+=`</div>`;
      } else {
        html+=`<div class="setrow ${ex.pr?'pr':''}"><span class="setnum">${s+1}</span>`;
        html+=`<input type="text" inputmode="numeric" maxlength="3" class="wt" value="${sd.wt||''}" placeholder="–" onchange="logSet(${ei},${s},'wt',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')">`;
        html+=`<input type="text" inputmode="numeric" maxlength="3" class="reps" value="${sd.reps||''}" placeholder="–" onchange="logSet(${ei},${s},'reps',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')">`;
        html+=`</div>`;
      }
    }
    html+=`</div>`;
    if(ex.pr){const b=getPR(ex.n);html+=b?`<div class="prbadge" style="padding:0 1rem 0.5rem">PR: ${b} lbs</div>`:`<div class="prbadge"></div>`;}
    html+=`</div></div>`;
  });

  // Edit-mode action bar
  if(edit){
    html+=`<div class="editactions">`;
    html+=`<button onclick="addExercise()">+ Add Exercise</button>`;
    html+=`<button onclick="addDivider()">+ Add Block Heading</button>`;
    html+=`<button class="apply" onclick="openApplyScope()">✓ Apply changes to…</button>`;
    html+=`<button onclick="copyDayTo()">⎘ Copy to specific weeks</button>`;
    html+=`<button class="warn" onclick="resetDay()">↺ Reset to Default</button>`;
    html+=`</div>`;
    html+=`<div class="applyhint">Edits save to <b>this day</b> automatically. Use <b>Apply changes to…</b> to push this day's setup to all future ${SESSION_LABEL[daySession(wkObj,state.day)]||''} days (past days stay unchanged).</div>`;
  }

  // Complete button
  const ck=completedKey(state.week,state.day);
  const done=state.completed[ck];
  if(!edit) html+=`<button class="complete-btn ${done?'done':''}" onclick="toggleComplete()">${done?'✓ Completed':'Mark Session Complete'}</button>`;

  // ── Re-anchor control: "did my lift today" ──
  // Logs TODAY as a real lift and re-anchors the forward 72-hr cycle from it.
  if(!edit){
    const todayIso=todayYMD();
    const loggedToday=!!_liftLog()[todayIso];
    if(loggedToday){
      html+=`<button class="reanchor-btn on" onclick="undoLiftToday()">⟲ Logged today's lift — undo</button>`;
      html+=`<div class="reanchor-hint">Cycle re-anchored to today. Next lift is 72 hrs out.</div>`;
    } else {
      const sameDate=(dayDate(wkObj,state.day).iso===todayIso);
      const lbl=sameDate?"Did this lift today":"Did my lift today instead";
      html+=`<button class="reanchor-btn" onclick="liftToday()">⚓ ${lbl}</button>`;

function getPR(exName){
  let best=0;
  for(const lk in state.logs){
    const parts=lk.match(/w(\d+)_(\w+)/);
    if(!parts)continue;
    const wkNum=+parts[1],dy=parts[2];
    const wkObj=WEEKS.find(w=>w.wk===wkNum);
    if(!wkObj)continue;
    const dayObj=DAYS.find(d=>d.key===dy);
    if(!dayObj||dayObj.session==="rest")continue;
    const exs=planExercises(wkObj,dy).filter(e=>!e.div);
    exs.forEach((ex,ei)=>{
      if(ex.n===exName&&state.logs[lk][ei]){
        for(const s in state.logs[lk][ei]){
          const v=parseFloat(state.logs[lk][ei][s].wt);
          if(!isNaN(v)&&v>best)best=v;
        }
      }
    });
  }
  return best>0?best:null;
}

const PR_DEFS=[

    {id:"burpees",  label:"Burpees — AMRAP 5 min",     type:"reps"},
  ]},
];
function prMeta(id){
  for(const g of PR_DEFS){const it=g.items.find(x=>x.id===id);if(it)return it;}
  return null;
}
function prHistory(id){ return (state.prs&&state.prs[id])?state.prs[id]:[]; }
function prLatest(id){ const h=prHistory(id); return h.length?h[h.length-1]:null; }
/* Format a PR entry's value for display based on type */
function prValueStr(meta,entry){
  if(!entry) return "—";
  if(meta.type==="weight") return `${entry.weight} lbs`;
  if(meta.type==="weightreps") return `${entry.weight} lbs × ${entry.reps}`;
  if(meta.type==="time") return entry.time;
  if(meta.type==="reps") return `${entry.reps} reps`;
  return "—";
}

let _prDraft=null;

function prField(id,label,mode,ph){
  if(mode==="date"){
    return `<label class="smlabel">${label}</label><input class="sminput" id="${id}" type="date">`;
  }
  const inm=mode==="numeric"?'inputmode="numeric"':'';
  const oi=mode==="numeric"?`oninput="this.value=this.value.replace(/[^0-9]/g,'')"`:'';
  return `<label class="smlabel">${label}</label><input class="sminput" id="${id}" type="text" ${inm} placeholder="${ph}" ${oi}>`;
}
function closePrModal(){ document.getElementById("prModal").classList.remove("show"); }
function savePrEntry(){
  // Resting HR path
  if(_prDraft&&_prDraft.id==="__hr__"){
    const val=parseInt((document.getElementById("hrVal")||{}).value)||0;
    const date=(document.getElementById("prDate")||{}).value||todayYMD();
    if(!val){toast("Enter a heart rate");return;}
    if(!state.restingHR) state.restingHR=[];
    state.restingHR.push({val,date});
    state.restingHR.sort((a,b)=>a.date<b.date?-1:1);
    closePrModal(); save(); renderProgress(); toast("Resting HR logged");
    return;
  }
  const meta=prMeta(_prDraft.id); if(!meta) return;
  const g=(id)=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const entry={date:g("prDate")||todayYMD(), bw:parseInt(g("prBW"))||0};
  if(meta.type==="weight"){ entry.weight=parseInt(g("prWeight"))||0; if(!entry.weight){toast("Enter a weight");return;} }
  else if(meta.type==="weightreps"){ entry.weight=parseInt(g("prWeight"))||0; entry.reps=parseInt(g("prReps"))||0; if(!entry.weight||!entry.reps){toast("Enter weight and reps");return;} }
  else if(meta.type==="time"){ entry.time=g("prTime"); if(!entry.time){toast("Enter a time");return;} }
  else if(meta.type==="reps"){ entry.reps=parseInt(g("prReps"))||0; if(!entry.reps){toast("Enter reps");return;} }
  if(!state.prs) state.prs={};
  if(!state.prs[_prDraft.id]) state.prs[_prDraft.id]=[];
  state.prs[_prDraft.id].push(entry);

function renderProgress(){

  h+=`<div class="hrbar">`;

  h+=`</div>`;

  // ── PR groups ──
  PR_DEFS.forEach(grp=>{
    h+=`<div class="prgroup-title">${grp.group}</div>`;

      const latest=prLatest(it.id);

      if(latest){
        h+=`<span class="prrow-sub">${latest.bw?'@ '+latest.bw+' lbs · ':''}${fmtPrDate(latest.date)}</span>`;
        if(hist.length>1) h+=`<button class="prhistbtn" onclick="togglePrHistory('${it.id}')">history (${hist.length})</button>`;
      }
      h+=`<button class="praddbtn" onclick="openPrModal('${it.id}')">+ Log</button>`;
      h+=`</div>`;
      // history (collapsed)
      if(hist.length>1){
        h+=`<div class="prhist" id="prhist_${it.id}" style="display:none">`;
        hist.slice().reverse().forEach((e,ri)=>{
          const realIdx=hist.length-1-ri;
          h+=`<div class="prhistrow"><span>${prValueStr(it,e)}${e.bw?' @ '+e.bw+' lbs':''}</span><span class="prhistdate">${fmtPrDate(e.date)}</span><button class="prdel" onclick="deletePrEntry('${it.id}',${realIdx})">✕</button></div>`;
        });
        h+=`</div>`;
      }
      h+=`</div>`;
    });
  });

  v.innerHTML=h;
}
function fmtPrDate(iso){
  if(!iso) return "";
  const [y,m,d]=iso.split("-").map(Number);
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${MON[m-1]} ${d}, ${y}`;
}
