<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#080808">
<title>Deehan Training — Week by Week</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --red:#8B1A1A; --redL:#c97070; --redBg:#1a0d0d;
    --navy:#1F3864; --navyL:#7090c9; --navyBg:#0d1320;
    --trav:#6d28d9; --travL:#a78bfa; --travBg:#160d24;
    --green:#16a34a; --greenL:#4ade80; --greenBg:#0a1f14;
    --bg:#080808; --card:#0f0f0f; --line:#2a2a2a;
    --txt:#f0f0f0; --dim:#a8a8a8; --dimmer:#8a8a8a;
    --mono:'Courier New',monospace;
  }
  body { background:var(--bg); color:var(--txt); font-family:'Georgia',serif; padding-bottom:78px; min-height:100vh; }
  .wrap { max-width:580px; margin:0 auto; padding:1rem; }

  .hero { padding:1.4rem 1rem 1rem; border-bottom:1px solid var(--line); }
  .hero .name { font-size:10px; color:var(--dim); letter-spacing:0.18em; text-transform:uppercase; font-family:var(--mono); margin-bottom:4px; }
  .hero h1 { font-size:26px; font-weight:700; color:#fff; letter-spacing:-0.02em; }
  .hero h1 span { color:var(--red); }
  .hero .sub { font-size:12px; color:var(--dim); font-family:var(--mono); margin-top:4px; }

  /* Week navigation */
  .weeknav { display:flex; align-items:center; gap:10px; margin-bottom:1rem; }
  .weeknav button {
    background:var(--card); border:1px solid var(--line); color:#e0e0e0;
    border-radius:8px; padding:10px 16px; font-size:18px; cursor:pointer;
    font-family:var(--mono); line-height:1;
  }
  .weeknav button:active { background:#1a1a1a; }
  .weeknav .wkinfo { flex:1; text-align:center; }
  .weeknav .wknum { font-size:18px; font-weight:700; color:#fff; }
  .weeknav .wkmeta { font-size:11px; color:var(--dim); font-family:var(--mono); margin-top:2px; }

  .weekpicker { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:1rem; justify-content:center; }
  .wkdot {
    width:30px; height:30px; border-radius:6px; border:1px solid var(--line);
    background:var(--card); color:#c0c0c0; font-size:11px; font-family:var(--mono);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .wkdot.str.on { background:var(--red); color:#fff; border-color:var(--red); }
  .wkdot.hyp.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .wkdot.trav.on { background:var(--trav); color:#fff; border-color:var(--trav); }
  .wkdot.trav { border-color:#3a2560; color:var(--travL); }
  .wkdot.thisweek { box-shadow:0 0 0 1.5px var(--redL); }
  .wkdot.logged::after { content:'·'; position:absolute; margin-top:-18px; margin-left:0; color:var(--greenL); font-size:20px; }

  /* Phase banner */
  .pbanner { border-radius:8px; padding:0.7rem 1rem; margin-bottom:1rem; font-size:12px; line-height:1.5; }
  .pbanner.str { background:var(--redBg); border-left:3px solid var(--red); color:#d8b0b0; }
  .pbanner.hyp { background:var(--navyBg); border-left:3px solid var(--navy); color:#aac0e0; }
  .pbanner.trav { background:var(--travBg); border-left:3px solid var(--trav); color:#c4b0e0; }
  .pbanner b { color:#fff; }
  .pbanner .focus { font-family:var(--mono); font-weight:700; text-transform:uppercase; letter-spacing:0.08em; font-size:11px; }

  .weeknote { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:0.7rem 1rem; margin-bottom:1rem; font-size:12px; color:var(--redL); font-style:italic; line-height:1.5; }
  .weeknote.trav { color:var(--travL); }

  /* Day tabs with dates */
  .daytab .dtl { display:block; }
  .daytab .dtd { display:block; font-size:9px; opacity:0.55; font-weight:400; margin-top:1px; }
  .daytab.travday { border-color:#3a2560; }
  .daytab.offday { opacity:0.45; border-style:dashed; }
  .daytab.istoday { box-shadow:inset 0 0 0 1.5px var(--redL); }
  .daytab.istoday.on { box-shadow:none; }
  .todaybtn { width:100%; padding:9px; margin:-6px 0 12px; border-radius:8px; border:1px solid var(--red); background:var(--redBg); color:var(--redL); font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; letter-spacing:0.04em; }
  .todaybtn:active { background:var(--red); color:#fff; }

  /* ── Edit mode ── */
  .editbtn { width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--dim); font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; letter-spacing:0.04em; }
  .editbtn.on { background:var(--red); color:#fff; border-color:var(--red); }
  .editbtn .cdot { color:var(--redL); font-size:16px; }
  .edithint { font-size:11px; color:var(--dim); background:var(--card); border-left:3px solid var(--red); border-radius:6px; padding:8px 10px; margin-bottom:10px; line-height:1.5; }
  .edithint b { color:var(--redL); }
  .ex.editrow { background:#131313; }
  .editbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
  .etype { font-size:9px; color:var(--dim); font-family:var(--mono); letter-spacing:0.08em; font-weight:700; }
  .ebtns button { background:#222; border:1px solid var(--line); color:#ddd; border-radius:5px; width:30px; height:28px; font-size:13px; cursor:pointer; margin-left:4px; }
  .ebtns button.del { color:var(--redL); border-color:#4a1f1f; }
  .einput { width:100%; padding:8px 10px; margin-bottom:6px; background:#1c1c1c; border:1px solid var(--line); border-radius:6px; color:#f0f0f0; font-size:14px; font-family:'Georgia',serif; }
  .einput.bold { font-weight:700; }
  .einput:focus { outline:none; border-color:var(--red); }
  .eopts { display:flex; gap:12px; align-items:center; margin-top:4px; }
  .eopts label { font-size:11px; color:var(--dim); font-family:var(--mono); display:flex; align-items:center; gap:6px; }
  .eopts input[type=number] { width:52px; padding:5px; background:#1c1c1c; border:1px solid var(--line); border-radius:5px; color:#fff; font-family:var(--mono); text-align:center; font-size:13px; }
  .eopts .chk { cursor:pointer; user-select:none; padding:5px 8px; border:1px solid var(--line); border-radius:5px; }
  .eopts .chk.on { color:var(--greenL); border-color:var(--green); }
  .editactions { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:12px; }
  .editactions button { padding:11px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:#e0e0e0; font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; }
  .editactions button.warn { color:var(--redL); border-color:#4a1f1f; }
  .editactions button.apply { color:#fff; background:var(--green); border-color:var(--green); grid-column:1 / -1; }
  .applyhint { font-size:11px; color:var(--dim); background:var(--card); border-left:3px solid var(--green); border-radius:6px; padding:8px 10px; margin-top:8px; line-height:1.5; }
  .applyhint b { color:var(--greenL); }
  .weeknote.edit { border-left:3px solid var(--red); }
  .elabel { display:block; font-size:9px; color:var(--dim); font-family:var(--mono); letter-spacing:0.08em; margin-bottom:5px; font-weight:700; }
  .enote { width:100%; min-height:56px; background:#1c1c1c; border:1px solid var(--line); border-radius:6px; color:#f0f0f0; font-family:'Georgia',serif; font-size:13px; padding:8px; resize:vertical; }
  .enote:focus { outline:none; border-color:var(--red); }
  .ehead-tag { width:100%; background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.25); border-radius:5px; color:#fff; font-family:var(--mono); font-size:11px; padding:5px 7px; margin-bottom:5px; }
  .ehead-title { width:100%; background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.25); border-radius:5px; color:#fff; font-size:17px; font-weight:700; padding:6px 7px; font-family:'Georgia',serif; }
  .ehead-tag:focus,.ehead-title:focus { outline:none; border-color:#fff; }

  /* Selected day date header */
  .datehead { text-align:center; font-size:13px; font-weight:700; color:var(--redL); font-family:var(--mono); letter-spacing:0.06em; margin:-4px 0 10px; }

  /* Off day */
  .pbanner.off { background:#1a1a1a; border-left:3px solid #777; color:#c0c0c0; }
  .shead.off { background:linear-gradient(135deg,#2a2a2a,#1a1a1a); }

  /* Day tabs */
  .daytabs { display:flex; gap:5px; margin-bottom:1rem; flex-wrap:wrap; }
  .daytab {
    flex:1; min-width:60px; padding:9px 4px; border-radius:7px; border:1px solid var(--line);
    background:var(--card); color:#c0c0c0; font-family:var(--mono); font-size:12px;
    font-weight:700; cursor:pointer; text-align:center;
  }
  .daytab.on { background:#fff; color:#000; border-color:#fff; }
  .daytab.logged { border-color:var(--green); }

  /* Session */
  .shead { border-radius:10px 10px 0 0; padding:0.85rem 1rem; color:#fff; }
  .shead.str { background:linear-gradient(135deg,var(--red),#6b1414); }
  .shead.hyp { background:linear-gradient(135deg,var(--navy),#142847); }
  .shead.trav { background:linear-gradient(135deg,var(--trav),#4c1d95); }
  .shead .stag { font-size:10px; opacity:0.7; font-family:var(--mono); text-transform:uppercase; letter-spacing:0.1em; }
  .shead .stitle { font-size:18px; font-weight:700; margin-top:2px; }

  .ex { background:var(--card); border:1px solid var(--line); border-top:none; }
  .exdiv { background:var(--redBg); color:var(--redL); padding:7px 1rem; font-size:10px; font-weight:700; letter-spacing:0.1em; font-family:var(--mono); text-transform:uppercase; text-align:center; border-bottom:1px solid var(--line); }
  .exdiv.hyp { background:var(--navyBg); color:var(--navyL); }
  .exrow { padding:0.75rem 1rem; border-bottom:1px solid var(--line); }
  .exname { font-size:14px; font-weight:700; color:#fff; }
  .exrx { font-size:11px; color:var(--redL); font-family:var(--mono); margin-top:2px; }
  .setgrid { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .setbox { display:flex; flex-direction:column; align-items:center; }
  .setbox .setnum { font-size:10px; color:var(--dim); font-family:var(--mono); margin-bottom:3px; font-weight:700; letter-spacing:0.05em; }
  .setbox .field { display:flex; flex-direction:column; gap:4px; }
  .setbox .flabel { font-size:9px; color:var(--dim); font-family:var(--mono); text-align:center; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:-2px; }
  .setbox input { width:52px; padding:7px 4px; text-align:center; background:#1a1a1a; border:1px solid var(--line); border-radius:5px; color:#fff; font-size:15px; font-family:var(--mono); }
  .setbox input:focus { outline:none; border-color:var(--red); background:#222; }
  .setbox.pr input.wt { border-color:var(--green); }
  .setbox .lrpair { display:flex; gap:4px; }
  .setbox .lrcol { display:flex; flex-direction:column; align-items:center; }
  .setbox .lrcol input { width:36px; }
  .setbox.lr { background:rgba(74,222,128,0.03); border-radius:6px; padding:4px; }
  .prbadge { font-size:9px; color:var(--green); font-family:var(--mono); margin-top:6px; height:11px; }

  /* Collapsible notes */
  .notes-wrap { background:var(--card); border:1px solid var(--line); border-top:none; border-radius:0 0 10px 10px; }
  .notes-toggle {
    width:100%; padding:0.85rem 1rem; background:none; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    color:#d0d0d0; font-family:var(--mono); font-size:12px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.06em;
  }
  .notes-toggle .arrow { transition:transform 0.2s; color:var(--dim); }
  .notes-toggle.open .arrow { transform:rotate(90deg); }
  .notes-body { max-height:0; overflow:hidden; transition:max-height 0.25s ease; }
  .notes-body.open { max-height:400px; }
  .notes-body textarea {
    width:100%; min-height:120px; background:#1a1a1a; border:1px solid var(--line);
    border-radius:8px; color:#fff; font-family:'Georgia',serif; font-size:14px;
    padding:10px; margin:0 0 1rem; line-height:1.5; resize:vertical;
  }
  .notes-body textarea:focus { outline:none; border-color:var(--red); }
  .notes-inner { padding:0 1rem; }
  .notes-prompt { font-size:11px; color:var(--dim); margin-bottom:8px; font-style:italic; }

  .complete-btn { width:100%; padding:14px; margin-top:12px; border:none; border-radius:10px; font-size:14px; font-weight:700; font-family:var(--mono); cursor:pointer; background:var(--card); color:var(--redL); border:1px solid var(--line); text-transform:uppercase; letter-spacing:0.06em; }
  .complete-btn.done { background:var(--green); color:#fff; border-color:var(--green); }
  .cardio-wrap { margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:0.75rem 1rem; }
  .cardio-title { font-size:10px; color:var(--greenL); font-family:var(--mono); font-weight:700; letter-spacing:0.1em; margin-bottom:8px; }
  .cardio-row { display:flex; align-items:center; gap:10px; padding:8px 0; cursor:pointer; border-top:1px solid var(--line); }
  .cardio-row:first-of-type { border-top:none; }
  .cardio-box { width:24px; height:24px; border-radius:6px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--greenL); font-weight:700; font-size:15px; flex-shrink:0; }
  .cardio-row.done .cardio-box { background:var(--greenBg); border-color:var(--green); }
  .cardio-label { font-size:13px; color:#e0e0e0; }
  .cardio-row.done .cardio-label { color:var(--greenL); }
  .cardio-row.slot { justify-content:flex-start; }
  .cardio-row.slot .cardio-label { flex:1; cursor:pointer; }
  .slottime { display:inline-block; min-width:64px; color:var(--dim); font-family:var(--mono); font-size:11px; margin-right:6px; }
  .cardio-row.slot.done .slottime { color:var(--greenL); }
  .recbadge { font-size:9px; color:var(--travL); font-family:var(--mono); border:1px solid #3a2560; border-radius:4px; padding:1px 5px; margin-left:4px; }
  .slotdel { background:none; border:none; color:#6a2a2a; font-size:14px; cursor:pointer; padding:4px 6px; flex-shrink:0; }
  .slotdel:active { color:var(--redL); }
  .addslot { width:100%; margin-top:8px; padding:9px; border-radius:7px; border:1px dashed var(--line); background:transparent; color:var(--greenL); font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer; }
  .addslot:active { background:var(--greenBg); }

  /* ── Travel day blocks ── */
  .tblock { background:var(--card); border:1px solid var(--line); border-top:none; }
  .tbhead { background:var(--travBg); color:var(--travL); padding:8px 1rem; font-size:11px; font-family:var(--mono); font-weight:700; letter-spacing:0.08em; border-bottom:1px solid var(--line); }
  .walkrow { display:flex; align-items:center; gap:10px; padding:11px 1rem; cursor:pointer; border-bottom:1px solid var(--line); }
  .walkrow.done { background:var(--greenBg); }
  .walkbox { width:24px; height:24px; border-radius:6px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--greenL); font-weight:700; font-size:15px; flex-shrink:0; }
  .walkrow.done .walkbox { background:var(--green); border-color:var(--green); color:#fff; }
  .walktime { font-size:11px; color:var(--dim); font-family:var(--mono); width:66px; flex-shrink:0; }
  .walklabel { font-size:13px; color:#e0e0e0; }
  .walkrow.done .walklabel { color:var(--greenL); }
  .bwblock { padding:0.5rem 1rem 0.75rem; border-bottom:1px solid var(--line); }
  .bwtitle { font-size:10px; color:var(--travL); font-family:var(--mono); font-weight:700; letter-spacing:0.08em; margin:6px 0 8px; }
  .bwex { margin-bottom:10px; }
  .bwname { font-size:13px; font-weight:700; color:#fff; display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; }
  .bwrx { font-size:10px; color:var(--travL); font-family:var(--mono); font-weight:400; }
  .bwsets { display:flex; gap:5px; }
  .bwset { display:flex; flex-direction:column; align-items:center; flex:1; }
  .bwset label { font-size:10px; color:var(--dim); font-family:var(--mono); margin-bottom:2px; }
  .bwset input { width:100%; max-width:48px; padding:6px 2px; text-align:center; background:#1a1a1a; border:1px solid var(--line); border-radius:5px; color:#fff; font-size:14px; font-family:var(--mono); }
  .bwset input:focus { outline:none; border-color:var(--trav); }
  .tsummary { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; background:var(--card); border:1px solid var(--line); border-top:none; border-radius:0 0 10px 10px; padding:0.9rem 1rem; text-align:center; }
  .tsummary .tsv { display:block; font-size:19px; font-weight:700; color:#fff; font-family:var(--mono); }
  .tsummary .tsv.green { color:var(--greenL); }
  .tsummary .tsl { display:block; font-size:9px; color:var(--dim); font-family:var(--mono); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }

  .restday { background:var(--card); border:1px solid var(--line); border-radius:0 0 10px 10px; padding:1.5rem 1rem; text-align:center; color:var(--dim); font-size:13px; line-height:1.6; }

  .tabbar { position:fixed; bottom:0; left:0; right:0; background:#0c0c0c; border-top:1px solid var(--line); display:flex; z-index:40; padding-bottom:env(safe-area-inset-bottom); }
  .tabbar button { flex:1; padding:11px 4px; background:none; border:none; cursor:pointer; color:#9a9a9a; font-family:var(--mono); font-size:10px; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .tabbar button.on { color:var(--redL); }
  .tabbar .ico { font-size:17px; }

  .section-title { font-size:11px; color:var(--redL); font-family:var(--mono); text-transform:uppercase; letter-spacing:0.1em; margin:1.25rem 0 0.75rem; }
  .prcard { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1rem; margin-bottom:10px; }
  .prcard h3 { font-size:14px; color:#fff; margin-bottom:8px; }
  .prline { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--line); font-size:12px; }
  .prline:last-child { border:none; }
  .prline .lift { color:#dcdcdc; }
  .prline .val { color:var(--green); font-family:var(--mono); font-weight:700; }
  .databtn { width:100%; padding:12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:#e0e0e0; font-family:var(--mono); font-size:13px; cursor:pointer; margin-bottom:8px; }
  .databtn.danger { color:var(--redL); border-color:#3a1515; }
  .hint { font-size:11px; color:var(--dim); line-height:1.6; margin-bottom:1rem; }
  textarea.data { width:100%; height:120px; background:#1a1a1a; border:1px solid var(--line); border-radius:8px; color:#fff; font-family:var(--mono); font-size:11px; padding:10px; }
  .toast { position:fixed; bottom:78px; left:50%; transform:translateX(-50%); background:var(--green); color:#fff; padding:10px 20px; border-radius:8px; font-family:var(--mono); font-size:13px; z-index:100; opacity:0; transition:opacity 0.3s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<div class="hero">
  <div class="name">Christopher Caleb Deehan</div>
  <h1>Week by Week<span>.</span></h1>
  <div class="sub">28 Weeks · Jun–Dec 2026 · DUP</div>
</div>

<div class="wrap">
  <div id="view-log"></div>
  <div id="view-progress" style="display:none"></div>
  <div id="view-data" style="display:none"></div>
</div>

<div class="tabbar">
  <button class="on" data-tab="log"><span class="ico">🏋️</span>Workout</button>
  <button data-tab="progress"><span class="ico">📈</span>PRs</button>
  <button data-tab="data"><span class="ico">💾</span>Data</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─── WEEK SCHEDULE (28 weeks) ─────────────────────────── */
const WEEKS = [
  {wk:1,start:"2026-08-10",dates:"Aug 10–16",focus:"strength",phase:1,note:"Fresh restart. Mon is rest this week; Thu is a training day.",
    sessions:{mon:"rest", thu:"upper"}},
  {wk:2,start:"2026-08-17",dates:"Aug 17–23",focus:"hypertrophy",phase:1,note:""},
  {wk:3,start:"2026-08-24",dates:"Aug 24–30",focus:"strength",phase:1,note:""},
  {wk:4,start:"2026-08-31",dates:"Aug 31–Sep 6",focus:"hypertrophy",phase:1,note:""},

/* Resolve the effective focus for a given day (handles per-day overrides) */
const DAY_ORDER=["mon","tue","wed","thu","fri","sat","sun"];
function dayFocus(wkObj,dayKey){
  if(wkObj.override && wkObj.override[dayKey]) return wkObj.override[dayKey];
  return wkObj.focus;
}
/* Resolve the effective SESSION for a day (handles per-week session swaps).
   wkObj.sessions[dayKey] can force a session ("lowerA","upper","upperC","rest"). */
function daySession(wkObj,dayKey){
  if(wkObj.sessions && wkObj.sessions[dayKey]!==undefined) return wkObj.sessions[dayKey];
  const d=DAYS.find(x=>x.key===dayKey);
  return d?d.session:"rest";
}
/* A DAYS-like object for a day, respecting session overrides */
function dayInfo(wkObj,dayKey){
  const base=DAYS.find(d=>d.key===dayKey);
  const sess=daySession(wkObj,dayKey);
  if(sess===base.session) return base;
  // build an overridden copy
  const note = sess==="rest" ? (dayKey==="thu"?"Cycle only · Fast day":"Full rest") : base.note;
  return {key:dayKey,label:base.label,session:sess,note:note};
}
/* Real calendar date for a given week + day */
function dayDate(wkObj,dayKey){
  const idx=DAY_ORDER.indexOf(dayKey);
  const [y,m,d]=wkObj.start.split("-").map(Number);
  const dt=new Date(y,m-1,d+idx);
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return {
    short:`${MON[dt.getMonth()]} ${dt.getDate()}`,
    full:`${DOW[dt.getDay()]}, ${MON[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`,
    num:dt.getDate(),
  };
}

/* state.plan[dayKey]  = custom exercise array (overrides default)
   state.titles[dayKey] = { title, tag }  custom session heading
   state.wknotes[wk]    = custom week note
   Falls back to built-in defaults when absent. */

function planKey(wk,day){ return `w${wk}_${day}`; }

/* Built-in default exercises for a given week+day */
function defaultExercises(wkObj,dayKey){
  const dayObj=dayInfo(wkObj,dayKey);
  const f=dayFocus(wkObj,dayKey);
  if(f==="off") return [];
  if(f==="travel") return BW_BLOCK;
  if(!dayObj || dayObj.session==="rest") return [];
  return getExercises(dayObj.session,wkObj.phase,f);
}

/* The exercises actually shown — custom if edited, else default */
function planExercises(wkObj,dayKey){
  const k=planKey(wkObj.wk,dayKey);
  if(state.plan && state.plan[k]) return state.plan[k];
  return defaultExercises(wkObj,dayKey);
}
/* Has this day been customised? */
function isCustom(wkObj,dayKey){
  return !!(state.plan && state.plan[planKey(wkObj.wk,dayKey)]);
}
/* Persist a day's exercise list (creates the override) */
function savePlan(wkObj,dayKey,list){
  if(!state.plan) state.plan={};
  state.plan[planKey(wkObj.wk,dayKey)]=list;
  save();
}
/* Revert a day back to the built-in default */
function resetDay(){
  const wkObj=curWeek();
  if(!confirm("Reset this day back to the original plan? Your logged sets stay, but custom exercises and headings are removed."))return;
  const k=planKey(wkObj.wk,state.day);
  if(state.plan) delete state.plan[k];
  if(state.titles) delete state.titles[k];
  save(); toast("Reset to default"); renderLog();
}

/* Custom headings */
function getTitle(wkObj,dayKey,defTitle,defTag){
  const k=planKey(wkObj.wk,dayKey);
  const t=(state.titles||{})[k]||{};
  return { title: t.title || defTitle, tag: t.tag || defTag };
}
function setTitle(field,val){
  const wkObj=curWeek();
  const k=planKey(wkObj.wk,state.day);
  if(!state.titles) state.titles={};
  if(!state.titles[k]) state.titles[k]={};
  state.titles[k][field]=val;
  save();
}
/* Week note override */
function getWeekNote(wkObj){
  const n=(state.wknotes||{})[wkObj.wk];
  return (n!==undefined)?n:wkObj.note;
}

/* ── Exercise CRUD (per day) ── */
function ensureCustom(){
  const wkObj=curWeek();
  const k=planKey(wkObj.wk,state.day);
  if(!state.plan) state.plan={};
  if(!state.plan[k]){
    // deep-copy the default so edits don't mutate the constants
    state.plan[k]=JSON.parse(JSON.stringify(defaultExercises(wkObj,state.day)));
  }
  return state.plan[k];
}
function addExercise(){

  list.push({n:"New Exercise",rx:"3 sets · failure",sets:3,fail:true});
  save(); renderLog();
  toast("Exercise added — tap ✎ to edit");

function removeExercise(i){
  const list=ensureCustom();
  const name=list[i].div?list[i].div:list[i].n;
  if(!confirm(`Remove "${name}" from this day?`))return;
  list.splice(i,1);
  save(); renderLog(); toast("Removed");
}
function moveExercise(i,dir){
  const list=ensureCustom();
  const j=i+dir;
  if(j<0||j>=list.length)return;
  const tmp=list[i]; list[i]=list[j]; list[j]=tmp;
  save(); renderLog();
}
function updateExercise(i,field,val){
  const list=ensureCustom();
  if(field==="sets"){
    const n=Math.max(1,Math.min(10,parseInt(val)||1));
    list[i].sets=n;
  } else if(field==="lr"){
    list[i].lr=!list[i].lr;
  } else {
    list[i][field]=val;
  }
  save(); renderLog();
}
/* Copy this day's setup to other days */
function copyDayTo(){
  const wkObj=curWeek();
  const src=planExercises(wkObj,state.day);
  const input=prompt("Copy this day's exercises to which weeks? Enter week numbers separated by commas (e.g. 5,7,9), or 'all' for every week with the same weekday.");
  if(!input)return;
  let targets=[];
  if(input.trim().toLowerCase()==="all"){
    targets=WEEKS.map(w=>w.wk).filter(n=>n!==wkObj.wk);
  } else {
    targets=input.split(",").map(s=>parseInt(s.trim())).filter(n=>n>=1&&n<=28&&n!==wkObj.wk);
  }
  if(targets.length===0){ toast("No valid weeks"); return; }
  if(!state.plan) state.plan={};
  let n=0;
  targets.forEach(w=>{
    state.plan[planKey(w,state.day)]=JSON.parse(JSON.stringify(src));
    n++;
  });
  save(); toast(`Copied to ${n} week${n!==1?'s':''}`);
}

/* Apply this day's setup to ALL FUTURE days of the same session type.
   "Future" = date today or later. Past days are left untouched (non-retroactive). */
function countMatchingForward(){
  const wkObj=curWeek();
  const mySession=daySession(wkObj,state.day);
  const today=todayYMD();
  let count=0;
  WEEKS.forEach(w=>{
    DAY_ORDER.forEach(dk=>{
      // date of this candidate day
      const idx=DAY_ORDER.indexOf(dk);
      const [y,mm,dd]=w.start.split("-").map(Number);
      const dt=new Date(y,mm-1,dd+idx);
      const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      if(ds<today) return;                       // skip past — non-retroactive
      if(w.wk===wkObj.wk && dk===state.day) return; // skip the source day itself
      if(daySession(w,dk)===mySession) count++;
    });
  });
  return count;
}
function applyToMatchingForward(){
  const wkObj=curWeek();
  const mySession=daySession(wkObj,state.day);
  const src=planExercises(wkObj,state.day);
  const today=todayYMD();
  if(!state.plan) state.plan={};
  let n=0;
  WEEKS.forEach(w=>{
    DAY_ORDER.forEach(dk=>{
      const idx=DAY_ORDER.indexOf(dk);
      const [y,mm,dd]=w.start.split("-").map(Number);
      const dt=new Date(y,mm-1,dd+idx);
      const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      if(ds<today) return;
      if(w.wk===wkObj.wk && dk===state.day) return;
      if(daySession(w,dk)===mySession){
        state.plan[planKey(w.wk,dk)]=JSON.parse(JSON.stringify(src));
        n++;
      }
    });
  });
  save();
  return n;
}
/* The Apply-changes dialog */
function openApplyScope(){
  const wkObj=curWeek();
  const mySession=daySession(wkObj,state.day);
  const label=SESSION_LABEL[mySession]||mySession;
  const cnt=countMatchingForward();
  const msg=`Apply this day's exercises to ALL future ${label} days?\n\nThis updates ${cnt} upcoming ${label} day${cnt!==1?'s':''} (today onward). Past days are left unchanged.\n\nOK = all future ${label} days\nCancel = keep it to just this day`;
  if(cnt===0){ toast("No future matching days"); return; }
  if(confirm(msg)){
    const n=applyToMatchingForward();
    toast(`Applied to ${n} ${label} day${n!==1?'s':''}`);
    renderLog();
  } else {
    toast("Kept to this day only");
  }
}
const SESSION_LABEL={upper:"Upper",lowerA:"Lower A",lowerB:"Lower B",upperC:"Upper C",rest:"Rest"};

function getExercises(session,phase,focus){
  // Travel weeks: same bodyweight block every day (AM + PM)
  if(focus==="travel"){ return BW_BLOCK; }
  const isStr=focus==="strength";
  const isP1=phase===1;
  if(session==="upper") return isStr?UPPER_S:UPPER_H;
  if(session==="upperC") return UPPER_C;
  if(session==="lowerA"){const b=isStr?LA_S:LA_H; return isP1?b:[...b,isStr?LA_S_RDL:LA_H_RDL];}
  if(session==="lowerB"){const b=isStr?LB_S:LB_H; return isP1?b:[...b,isStr?LB_S_GOB:LB_H_GOB];}
  return [];
}

  html+=`<div class="weekpicker">`;
  WEEKS.forEach(w=>{
    const on=w.wk===state.week?'on':'';

    html+=`<div class="pbanner off"><span class="focus">⊘ NO TRAINING</span><br><b>${dDate.full}</b><br>Travel day. Rest, hydrate, walk if you can.</div>`;

    html+=`<div class="pbanner trav"><span class="focus">✈ TRAVEL BLOCK</span><br><b>3 blocks · 4 hrs walking + 2 bodyweight</b><br>6AM walk+BW+walk · 1PM walk · 7PM BW+walk<br>~2,750 kcal/day burn est.</div>`;
  } else {
    html+=`<div class="pbanner ${isStr?'str':'hyp'}"><span class="focus">${isStr?'STRENGTH WEEK':'HYPERTROPHY WEEK'}</span><br><b>${ph.label}</b> · ${ph.health}<br>Lower: ${ph.lower} · Cardio: ${ph.cardio}</div>`;
  }

  // Week note (editable)
  const wn=getWeekNote(wkObj);

    html+=`<div class="weeknote edit"><label class="elabel">WEEK NOTE</label><textarea class="enote" onchange="setWeekNote(this.value);renderLog()" placeholder="Week note…">${esc(wn||'')}</textarea></div>`;

    html+=`<div class="weeknote ${wkObj.override||wkObj.focus==='travel'?'trav':''}">${wn}</div>`;
  }

  // Day tabs — now show the date under each day
  html+=`<div class="daytabs">`;
  DAYS.forEach(d=>{
    const logged=!!state.completed[completedKey(state.week,d.key)];
    const f=dayFocus(wkObj,d.key);
    const dt=dayDate(wkObj,d.key);
    const fcls=f==="off"?"offday":f==="travel"?"travday":"";

  // Selected day date header
  html+=`<div class="datehead">${dDate.full}${isToday?' · TODAY':''}</div>`;

  // Edit toggle
  const custom=isCustom(wkObj,state.day);
  html+=`<button class="editbtn ${edit?'on':''}" onclick="toggleEdit()">${edit?'✓ Done Editing':'✎ Edit This Day'}${(!edit&&custom)?' <span class="cdot">•</span>':''}</button>`;
  if(edit) html+=`<div class="edithint">Editing <b>this day only</b>. Changes don't affect other days — use "Copy Day To…" to push them elsewhere.</div>`;

  // ── OFF DAY ──
  if(isOff){
    html+=`<div class="shead off"><div class="stag">${dayObj.label} · ${dDate.short}</div><div class="stitle">No Training — Travel Day</div></div>`;

    html+=`✈️ Travel day.<br><small style="color:var(--dim)">No structured training. Move if you can, hydrate, stay in your deficit.</small>`;
    html+=`</div>`;

    return;
  }

  // ── TRAVEL DAY: 3-block structured day ──
  if(isTravel){
    html+=renderTravelDay(dDate);
    html+=renderNotes(false);
    v.innerHTML=html;
    return;
  }

  // ── REST DAY (normal weeks) ──
  if(dayObj.session==="rest"){
    const restColor=isStr?'str':'hyp';
    html+=`<div class="shead ${restColor}"><div class="stag">${dayObj.label} · ${dDate.short}</div><div class="stitle">${dayObj.note}</div></div>`;
    html+=`<div class="restday">`;
    html+=dayObj.key==="thu"?`🚲 1 hr fasted cycling · 130–150 bpm<br><small style="color:var(--dim)">Drop to 115–125 if genuinely weak. No lifting.</small>`:`🛑 Complete rest.<br><small style="color:var(--dim)">No cycling, no lifting. Recover.</small>`;
    html+=`</div>`;
    html+=renderCardio();
    html+=renderNotes(isStr);
    v.innerHTML=html;
    return;
  }

  // ── TRAINING SESSION ──
  let defTitle, defTag, headColor;
  {
    const names={upper:isStr?"Upper — Strength":"Upper — Hypertrophy",lowerA:isStr?"Lower A — Strength":"Lower A — Hypertrophy",lowerB:isStr?"Lower B — Strength":"Lower B — Hypertrophy",upperC:"Upper C — Arms & Grip"};
    const dayNames={mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",sat:"Saturday",sun:"Sunday"};
    const dayName=dayNames[state.day]||dayObj.label;
    defTitle=names[dayObj.session];
    defTag=`${dayName} · ${dDate.short} · ${isStr?'STRENGTH':'HYPERTROPHY'}`;
    headColor=isStr?'str':'hyp';
  }
  const T=getTitle(wkObj,state.day,defTitle,defTag);

  // Editable session header
  html+=`<div class="shead ${headColor}">`;
  if(edit){
    html+=`<input class="ehead-tag" value="${esc(T.tag)}" onchange="setTitle('tag',this.value);renderLog()">`;
    html+=`<input class="ehead-title" value="${esc(T.title)}" onchange="setTitle('title',this.value);renderLog()">`;
  } else {
    html+=`<div class="stag">${T.tag}</div><div class="stitle">${T.title}</div>`;
  }

  const exercises=planExercises(wkObj,state.day);
  const lk=logKey();
  const dayLog=state.logs[lk]||{};

  exercises.forEach((ex,ei)=>{
    // ── DIVIDER / BLOCK HEADING ──

        html+=`<div class="ex editrow"><div class="exrow">`;

        html+=`<span class="etype">BLOCK HEADING</span>`;
        html+=`<span class="ebtns">`;
        html+=`<button onclick="moveExercise(${ei},-1)">↑</button>`;
        html+=`<button onclick="moveExercise(${ei},1)">↓</button>`;
        html+=`<button class="del" onclick="removeExercise(${ei})">✕</button>`;
        html+=`</span></div>`;
        html+=`<input class="einput" value="${esc(ex.div)}" onchange="updateExercise(${ei},'div',this.value)">`;
        html+=`</div></div>`;
      } else {
        html+=`<div class="exdiv ${isStr?'':'hyp'}">${ex.div}</div>`;
      }
      return;
    }

    // ── EXERCISE ──
    const exLog=dayLog[ei]||{};
    html+=`<div class="ex ${edit?'editrow':''}"><div class="exrow">`;

    if(edit){
      html+=`<div class="editbar">`;
      html+=`<span class="etype">EXERCISE ${ei+1}</span>`;
      html+=`<span class="ebtns">`;
      html+=`<button onclick="moveExercise(${ei},-1)">↑</button>`;
      html+=`<button onclick="moveExercise(${ei},1)">↓</button>`;
      html+=`<button class="del" onclick="removeExercise(${ei})">✕</button>`;
      html+=`</span></div>`;
      html+=`<input class="einput bold" value="${esc(ex.n)}" placeholder="Exercise name" onchange="updateExercise(${ei},'n',this.value)">`;
      html+=`<input class="einput" value="${esc(ex.rx)}" placeholder="Prescription (e.g. 3 sets · failure)" onchange="updateExercise(${ei},'rx',this.value)">`;
      html+=`<div class="eopts">`;
      html+=`<label>Sets <input type="number" min="1" max="10" value="${ex.sets||3}" onchange="updateExercise(${ei},'sets',this.value)"></label>`;
      html+=`<label class="chk ${ex.lr?'on':''}" onclick="updateExercise(${ei},'lr')">${ex.lr?'☑':'☐'} L/R inputs</label>`;
      html+=`</div>`;
      html+=`</div></div>`;
      return;
    }

    html+=`<div class="exname">${ex.n}</div><div class="exrx">${ex.rx}</div>`;
    html+=`<div class="setgrid">`;
    for(let s=0;s<ex.sets;s++){
      const sd=exLog[s]||{};
      if(ex.lr){
        html+=`<div class="setbox lr ${ex.pr?'pr':''}"><div class="setnum">SET ${s+1}</div><div class="field">`;
        html+=`<div class="flabel">WT</div><input type="text" inputmode="numeric" maxlength="3" class="wt" value="${sd.wt||''}" placeholder="–" onchange="logSet(${ei},${s},'wt',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')">`;
        html+=`<div class="lrpair">`;
        html+=`<div class="lrcol"><div class="flabel">L</div><input type="text" inputmode="numeric" maxlength="3" class="reps" value="${sd.repsL||''}" placeholder="–" onchange="logSet(${ei},${s},'repsL',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>`;
        html+=`<div class="lrcol"><div class="flabel">R</div><input type="text" inputmode="numeric" maxlength="3" class="reps" value="${sd.repsR||''}" placeholder="–" onchange="logSet(${ei},${s},'repsR',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>`;
        html+=`</div></div></div>`;
      } else {
        html+=`<div class="setbox ${ex.pr?'pr':''}"><div class="setnum">SET ${s+1}</div><div class="field">`;
        html+=`<div class="flabel">WT</div><input type="text" inputmode="numeric" maxlength="3" class="wt" value="${sd.wt||''}" placeholder="–" onchange="logSet(${ei},${s},'wt',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')">`;
        html+=`<div class="flabel">REPS</div><input type="text" inputmode="numeric" maxlength="3" class="reps" value="${sd.reps||''}" placeholder="–" onchange="logSet(${ei},${s},'reps',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')">`;
        html+=`</div></div>`;
      }
    }
    html+=`</div>`;
    if(ex.pr){const b=getPR(ex.n);html+=b?`<div class="prbadge" style="padding:0 1rem 0.5rem">PR: ${b} lbs</div>`:`<div class="prbadge"></div>`;}
    html+=`</div>`;
  });

  // Edit-mode action bar
  if(edit){
    html+=`<div class="editactions">`;
    html+=`<button onclick="addExercise()">+ Add Exercise</button>`;
    html+=`<button onclick="addDivider()">+ Add Block Heading</button>`;
    html+=`<button class="apply" onclick="openApplyScope()">✓ Apply changes to…</button>`;
    html+=`<button onclick="copyDayTo()">⎘ Copy to specific weeks</button>`;
    html+=`<button class="warn" onclick="resetDay()">↺ Reset to Default</button>`;
    html+=`</div>`;
    html+=`<div class="applyhint">Edits save to <b>this day</b> automatically. Use <b>Apply changes to…</b> to push this day's setup to all future ${SESSION_LABEL[daySession(wkObj,state.day)]||''} days (past days stay unchanged).</div>`;
  }

  // Complete button
  const ck=completedKey(state.week,state.day);
  const done=state.completed[ck];
  if(!edit) html+=`<button class="complete-btn ${done?'done':''}" onclick="toggleComplete()">${done?'✓ Completed':'Mark Session Complete'}</button>`;

  // Cardio checkboxes
  html+=renderCardio();

  // Collapsible notes
  html+=renderNotes(isStr);

  v.innerHTML=html;
}

function renderNotes(isStr){
  const nk=notesKey(state.week,state.day);
  const noteVal=state.notes[nk]||"";
  const isOpen=state.notesOpen[nk];
  let h=`<div class="notes-wrap" style="margin-top:12px;border-radius:10px;border-top:1px solid var(--line)">`;
  h+=`<button class="notes-toggle ${isOpen?'open':''}" onclick="toggleNotes()"><span>📝 Session Notes${noteVal?' •':''}</span><span class="arrow">›</span></button>`;
  h+=`<div class="notes-body ${isOpen?'open':''}">`;
  h+=`<div class="notes-inner">`;
  h+=`<div class="notes-prompt">PRs hit, how it felt, what to load next time, form cues…</div>`;
  h+=`<textarea placeholder="Type your notes for this session…" onchange="saveNote(this.value)">${noteVal}</textarea>`;
  h+=`</div></div></div>`;
  return h;

function logKeyFor(day){return `w${state.week}_${day}`;}
function completedKey(wk,day){return `w${wk}_${day}`;}
function notesKey(wk,day){return `w${wk}_${day}`;}
function cardioKey(wk,day,type){return `w${wk}_${day}_${type}`;}

/* Custom cardio slots.
   state.cardioSlots = { recurring:[{id,time,label}], perday:{ "w1_mon":[{id,time,label}] } }
   Done-state is tracked per week+day+slotId in state.cardio. */
function ensureSlots(){
  if(!state.cardioSlots) state.cardioSlots={recurring:[],perday:{}};
  if(!state.cardioSlots.recurring) state.cardioSlots.recurring=[];
  if(!state.cardioSlots.perday) state.cardioSlots.perday={};
  return state.cardioSlots;
}
/* All custom slots visible on the current day = recurring + this day's per-day slots */
function slotsForDay(wk,day){
  const S=ensureSlots();
  const pd=S.perday[`w${wk}_${day}`]||[];
  return S.recurring.concat(pd);
}
function slotDoneKey(wk,day,id){return `w${wk}_${day}_slot_${id}`;}
function toggleSlot(id){
  const k=slotDoneKey(state.week,state.day,id);
  if(state.cardio[k])delete state.cardio[k];
  else state.cardio[k]=true;
  save();renderLog();
}
function removeSlot(id,recurring){
  if(!confirm("Remove this cardio slot?"))return;
  const S=ensureSlots();
  if(recurring){
    S.recurring=S.recurring.filter(s=>s.id!==id);
  } else {
    const key=`w${state.week}_${state.day}`;
    if(S.perday[key]) S.perday[key]=S.perday[key].filter(s=>s.id!==id);
  }
  save();renderLog();toast("Slot removed");
}
function addCardioSlot(){
  // Time: preset or custom
  let time=prompt("Time for this cardio slot?\n\nType a preset — Morning, Midday, Afternoon, Evening — or a custom time like '6:30 AM' or '7 PM'.","Evening");
  if(time===null)return;
  time=time.trim(); if(!time)time="Cardio";
  const label=prompt("What is this cardio session? (e.g. 'Rowing 30 min', 'Stair climber 20 min')","Rowing 30 min");
  if(label===null)return;
  const scope=confirm("Apply this slot to EVERY day?\n\nOK = every day (recurring)\nCancel = just this day");
  const S=ensureSlots();
  const slot={id:"s"+Date.now().toString(36),time:time,label:(label||"Cardio").trim()};
  if(scope){
    S.recurring.push(slot);
  } else {
    const key=`w${state.week}_${state.day}`;
    if(!S.perday[key]) S.perday[key]=[];
    S.perday[key].push(slot);
  }
  save();renderLog();
  toast(scope?"Added to every day":"Added to this day");
}

function renderCardio(){
  const day=state.day;
  const isThuSun = day==="thu"||day==="sun";
  const amKey=cardioKey(state.week,day,"am");
  const pmKey=cardioKey(state.week,day,"pm");
  const amDone=state.cardio[amKey];
  const pmDone=state.cardio[pmKey];
  let h=`<div class="cardio-wrap">`;
  h+=`<div class="cardio-title">CARDIO</div>`;
  // Morning cardio — every day
  h+=`<label class="cardio-row ${amDone?'done':''}" onclick="toggleCardio('am')">`;
  h+=`<span class="cardio-box">${amDone?'✓':''}</span>`;
  h+=`<span class="cardio-label">🚶 Morning walk · 45–60 min</span>`;
  h+=`</label>`;
  // Built-in extra cardio — Thu & Sun only
  if(isThuSun){
    h+=`<label class="cardio-row ${pmDone?'done':''}" onclick="toggleCardio('pm')">`;
    h+=`<span class="cardio-box">${pmDone?'✓':''}</span>`;
    h+=`<span class="cardio-label">➕ Additional cardio (on top of morning)</span>`;
    h+=`</label>`;
  }
  // Custom slots
  const S=ensureSlots();
  const recIds=new Set(S.recurring.map(s=>s.id));
  slotsForDay(state.week,day).forEach(slot=>{
    const isRec=recIds.has(slot.id);
    const done=state.cardio[slotDoneKey(state.week,day,slot.id)];
    h+=`<div class="cardio-row slot ${done?'done':''}">`;
    h+=`<span class="cardio-box" onclick="toggleSlot('${slot.id}')">${done?'✓':''}</span>`;
    h+=`<span class="cardio-label" onclick="toggleSlot('${slot.id}')"><span class="slottime">${esc(slot.time)}</span> ${esc(slot.label)}${isRec?' <span class="recbadge">every day</span>':''}</span>`;
    h+=`<button class="slotdel" onclick="removeSlot('${slot.id}',${isRec})">✕</button>`;
    h+=`</div>`;
  });
  // Add button
  h+=`<button class="addslot" onclick="addCardioSlot()">+ Add cardio slot</button>`;
  h+=`</div>`;
  return h;
}
function toggleCardio(type){
  const k=cardioKey(state.week,state.day,type);
  if(state.cardio[k])delete state.cardio[k];
  else state.cardio[k]=true;
  save();renderLog();
}

/* ─── TRAVEL DAY: 3 time blocks ────────────────────────── */
function travelWalkKey(wk,day,id){return `w${wk}_${day}_walk_${id}`;}
function toggleWalk(id){
  const k=travelWalkKey(state.week,state.day,id);
  if(state.cardio[k])delete state.cardio[k];
  else state.cardio[k]=true;
  save();renderLog();
}

function bwSetKey(slot){ return `w${state.week}_${state.day}_bw_${slot}`; }

function logBW(slot,ei,s,field,val){
  const k=bwSetKey(slot);
  if(!state.logs[k])state.logs[k]={};
  if(!state.logs[k][ei])state.logs[k][ei]={};
  if(!state.logs[k][ei][s])state.logs[k][ei][s]={};
  state.logs[k][ei][s][field]=val;
  save();
}

function bwBlockHTML(slot,label){
  const k=bwSetKey(slot);
  const log=state.logs[k]||{};
  let h=`<div class="bwblock">`;
  h+=`<div class="bwtitle">${label}</div>`;
  BW_BLOCK.forEach((ex,ei)=>{
    const exLog=log[ei]||{};
    h+=`<div class="bwex">`;
    h+=`<div class="bwname">${ex.n}<span class="bwrx">${ex.rx}</span></div>`;
    h+=`<div class="bwsets">`;
    for(let s=0;s<ex.sets;s++){
      const v=(exLog[s]||{}).reps||"";
      h+=`<div class="bwset"><label>${s+1}</label><input type="text" inputmode="numeric" maxlength="3" value="${v}" placeholder="–" onchange="logBW('${slot}',${ei},${s},'reps',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>`;
    }
    h+=`</div></div>`;
  });
  h+=`</div>`;
  return h;
}

function walkRow(id,time,label){
  const k=travelWalkKey(state.week,state.day,id);
  const done=state.cardio[k];
  return `<label class="walkrow ${done?'done':''}" onclick="toggleWalk('${id}')">
    <span class="walkbox">${done?'✓':''}</span>
    <span class="walktime">${time}</span>
    <span class="walklabel">🚶 ${label}</span>
  </label>`;
}

function renderTravelDay(dDate){
  const dayObj=DAYS.find(d=>d.key===state.day);
  let h=``;

  // Day header
  h+=`<div class="shead trav"><div class="stag">${dayObj.label} · ${dDate?dDate.short:''} · TRAVEL BLOCK</div><div class="stitle">Walk + Bodyweight · 3 Blocks</div></div>`;

  // ── MORNING BLOCK ──
  h+=`<div class="tblock">`;
  h+=`<div class="tbhead">🌅 MORNING · 6:00 AM</div>`;
  h+=walkRow("am1","6:00 AM","1 hr walk");
  h+=bwBlockHTML("am","BODYWEIGHT BLOCK");
  h+=walkRow("am2","~7:20 AM","1 hr walk · finisher");
  h+=`</div>`;

  // ── AFTERNOON BLOCK ──
  h+=`<div class="tblock">`;
  h+=`<div class="tbhead">☀️ AFTERNOON · 1:00 PM</div>`;
  h+=walkRow("pm1","1:00 PM","1 hr walk");
  h+=`</div>`;

  // ── EVENING BLOCK ──
  h+=`<div class="tblock">`;
  h+=`<div class="tbhead">🌙 EVENING · 7:00 PM</div>`;
  h+=bwBlockHTML("pm","BODYWEIGHT BLOCK");
  h+=walkRow("pm2","~7:20 PM","1 hr walk · finisher");
  h+=`</div>`;

  // Daily summary
  const walks=["am1","am2","pm1","pm2"];
  const doneWalks=walks.filter(id=>state.cardio[travelWalkKey(state.week,state.day,id)]).length;
  const est=Math.round(doneWalks*583 + (state.logs[bwSetKey("am")]?211:0) + (state.logs[bwSetKey("pm")]?211:0));
  h+=`<div class="tsummary">`;
  h+=`<div><span class="tsv">${doneWalks}/4</span><span class="tsl">walks done</span></div>`;
  h+=`<div><span class="tsv">${doneWalks}h</span><span class="tsl">walking</span></div>`;
  h+=`<div><span class="tsv green">~${est}</span><span class="tsl">kcal burned</span></div>`;
  h+=`</div>`;

  // Complete button
  const ck=completedKey(state.week,state.day);
  const done=state.completed[ck];
  h+=`<button class="complete-btn ${done?'done':''}" onclick="toggleComplete()">${done?'✓ Day Complete':'Mark Day Complete'}</button>`;

  return h;
}

function logSet(ei,s,field,val){
  const lk=logKey();
  if(!state.logs[lk])state.logs[lk]={};
  if(!state.logs[lk][ei])state.logs[lk][ei]={};
  if(!state.logs[lk][ei][s])state.logs[lk][ei][s]={};
  state.logs[lk][ei][s][field]=val;
  save();
}
function saveNote(val){
  const nk=notesKey(state.week,state.day);
  state.notes[nk]=val; save();
}
function toggleNotes(){
  const nk=notesKey(state.week,state.day);
  state.notesOpen[nk]=!state.notesOpen[nk]; save(); renderLog();
}
function toggleComplete(){
  const ck=completedKey(state.week,state.day);
  if(state.completed[ck])delete state.completed[ck];
  else{state.completed[ck]=true;toast("✓ Session logged");}
  save();renderLog();
}
function changeWeek(dir){
  const nw=state.week+dir;
  if(nw<1||nw>28)return;
  state.week=nw; save(); renderLog();
  window.scrollTo(0,0);
}
function gotoWeek(wk){state.week=wk;save();renderLog();window.scrollTo(0,0);}
function setDay(d){state.day=d;save();renderLog();}

function getPR(exName){
  let best=0;
  for(const lk in state.logs){
    const parts=lk.match(/w(\d+)_(\w+)/);
    if(!parts)continue;
    const wkNum=+parts[1],dy=parts[2];
    const wkObj=WEEKS.find(w=>w.wk===wkNum);
    if(!wkObj)continue;
    const dayObj=DAYS.find(d=>d.key===dy);
    if(!dayObj||dayObj.session==="rest")continue;
    const exs=planExercises(wkObj,dy).filter(e=>!e.div);
    exs.forEach((ex,ei)=>{
      if(ex.n===exName&&state.logs[lk][ei]){
        for(const s in state.logs[lk][ei]){
          const v=parseFloat(state.logs[lk][ei][s].wt);
          if(!isNaN(v)&&v>best)best=v;
        }
      }
    });
  }
  return best>0?best:null;
}

/* ─── PROGRESS ─────────────────────────────────────────── */
function renderProgress(){
  const v=document.getElementById("view-progress");
  let html=`<div class="section-title">Personal Records</div>`;
  const lifts=["Barbell Bench Press","Barbell Row (Pendlay)","Overhead Press","Pull-Ups / Lat Pulldown","Leg Press","Romanian Deadlift","Goblet Squat","Incline Dumbbell Press","Cable Row","Overhead Press (DB)","Lat Pulldown","Close-Grip Bench Press"];
  html+=`<div class="prcard"><h3>Top Lifts (best weight)</h3>`;
  let any=false;
  lifts.forEach(l=>{const pr=getPR(l);if(pr){html+=`<div class="prline"><span class="lift">${l}</span><span class="val">${pr} lbs</span></div>`;any=true;}});
  if(!any)html+=`<div class="hint">No PRs yet. Log weights on the Workout tab.</div>`;
  html+=`</div>`;
  const totalSessions=Object.keys(state.completed).length;
  const totalNotes=Object.values(state.notes).filter(n=>n&&n.trim()).length;
  let totalSets=0;
  for(const lk in state.logs)for(const ei in state.logs[lk])for(const s in state.logs[lk][ei]){const sd=state.logs[lk][ei][s];if(sd&&(sd.wt||sd.reps||sd.repsL||sd.repsR))totalSets++;}
  html+=`<div class="prcard"><h3>Totals</h3>`;
  html+=`<div class="prline"><span class="lift">Sessions completed</span><span class="val">${totalSessions} / 140</span></div>`;
  html+=`<div class="prline"><span class="lift">Sets logged</span><span class="val">${totalSets}</span></div>`;
  html+=`<div class="prline"><span class="lift">Notes written</span><span class="val">${totalNotes}</span></div>`;
  html+=`</div>`;
  v.innerHTML=html;
}

/* ─── DATA ─────────────────────────────────────────────── */
function renderData(){
  const v=document.getElementById("view-data");
  let html=`<div class="section-title">Backup & Restore</div>`;
  html+=`<div class="hint">Data saves on this device only. Export weekly and keep the text safe (email it to yourself). Import to restore on a new device.</div>`;
  html+=`<button class="databtn" onclick="exportData()">⬆ Export Data (copy backup)</button>`;
  html+=`<button class="databtn" onclick="document.getElementById('impbox').style.display='block'">⬇ Import Data (restore)</button>`;
  html+=`<div id="impbox" style="display:none;margin-top:10px"><textarea class="data" id="imptext" placeholder="Paste backup here…"></textarea><button class="databtn" onclick="importData()" style="margin-top:8px">Restore from text</button></div>`;
  html+=`<div id="expbox" style="display:none;margin-top:10px"><textarea class="data" id="exptext" readonly></textarea><div class="hint">Copy all text above and save it somewhere safe.</div></div>`;
  html+=`<div class="section-title">Reset</div>`;
  html+=`<button class="databtn danger" onclick="resetData()">⚠ Erase all data</button>`;
  v.innerHTML=html;
}
function exportData(){const b=document.getElementById("expbox");const t=document.getElementById("exptext");t.value=JSON.stringify(state);b.style.display="block";t.select();try{document.execCommand("copy");toast("✓ Copied");}catch(e){toast("Select & copy");}}
function importData(){const t=document.getElementById("imptext").value.trim();if(!t){toast("Paste backup first");return;}try{const d=JSON.parse(t);state=Object.assign({week:1,day:"mon",logs:{},notes:{},completed:{},notesOpen:{},cardio:{},cardioSlots:{recurring:[],perday:{}},plan:{},titles:{},wknotes:{},editMode:false},d);save();toast("✓ Restored");renderLog();}catch(e){toast("⚠ Invalid backup");}}
function resetData(){if(confirm("Erase ALL data? Export a backup first if unsure.")){state={week:1,day:"mon",logs:{},notes:{},completed:{},notesOpen:{},cardio:{},cardioSlots:{recurring:[],perday:{}},plan:{},titles:{},wknotes:{},editMode:false};save();toast("Erased");renderLog();renderData();}}

/* ─── TABS ─────────────────────────────────────────────── */
document.querySelectorAll(".tabbar button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".tabbar button").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    const tab=btn.dataset.tab;
    ["log","progress","data"].forEach(t=>{document.getElementById("view-"+t).style.display=t===tab?"block":"none";});
    if(tab==="progress")renderProgress();
    if(tab==="data")renderData();
  };
});

/* ─── JUMP TO TODAY ────────────────────────────────────── */
function todayYMD(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
/* Find the week + day matching today's real date. Returns null if outside the plan. */
function resolveToday(){
  const t=todayYMD();
  for(const w of WEEKS){
    for(let i=0;i<7;i++){
      const [y,m,d]=w.start.split("-").map(Number);
      const dt=new Date(y,m-1,d+i);
      const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      if(ds===t) return {week:w.wk, day:DAY_ORDER[i]};
    }
  }
  return null;
}
/* Set state to today if in range; clamp to plan bounds if outside. */
function jumpToToday(silent){
  const hit=resolveToday();
  if(hit){
    state.week=hit.week; state.day=hit.day; save();
    if(!silent) toast("📅 Jumped to today");
    renderLog(); window.scrollTo(0,0);
    return true;
  }
  if(!silent){
    const t=todayYMD();
    const first=WEEKS[0].start;
    const lastW=WEEKS[WEEKS.length-1];
    if(t<first){ state.week=1; state.day="mon"; toast("Plan starts Jul 6 — showing Week 1"); }
    else { state.week=lastW.wk; state.day="sun"; toast("Past plan end — showing Week 28"); }
    save(); renderLog(); window.scrollTo(0,0);
  }
  return false;
}

load();
// Auto-open to today's week + day (only on fresh app open, not on every render)
jumpToToday(true);
renderLog();
</script>
