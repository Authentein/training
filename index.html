  if(!state.nutrition) state.nutrition={};
  const key=nutriKey(state.week,day);
  if(!state.nutrition[key]) state.nutrition[key]={};
  const n=Math.max(0,Math.min(99999,parseInt(val)||0));
  if(n===0) delete state.nutrition[key][field];
  else state.nutrition[key][field]=n;
  if(!Object.keys(state.nutrition[key]).length) delete state.nutrition[key];
  save();
  renderMetrics();
}
function weekNutriTotal(wk,field){
  if(!state.nutrition) return 0;
  let t=0;
  DAY_KEYS.forEach(d=>{ const v=getNutri(wk,d)[field]; if(v) t+=parseInt(v)||0; });
  return t;
}
function nutriSelectDay(day){ _nutriDay=day; renderMetrics(); }
function renderNutrition(wk){
  const day=_nutriDay||state.day||"mon";
  const dayData=getNutri(wk,day);
  let h=`<div class="mcard">`;
  h+=`<div class="mcard-h">🍽 Nutrition</div>`;

  // Weekly totals
  h+=`<div class="nutgrid">`;
  NUTRI_FIELDS.forEach(f=>{
    const tot=weekNutriTotal(wk,f.k);
    h+=`<div class="nuttot"><div class="nuttot-val">${tot.toLocaleString()}</div><div class="nuttot-lbl">${f.label}</div><div class="nuttot-unit">${f.unit}/wk</div></div>`;
  });
  h+=`</div>`;

  // Day selector
  h+=`<div class="msub">LOG A DAY</div>`;
  h+=`<div class="nutdays">`;
  DAY_KEYS.forEach(dk=>{
    const has=Object.keys(getNutri(wk,dk)).length>0;
    h+=`<button class="nutday ${dk===day?'on':''} ${has?'has':''}" onclick="nutriSelectDay('${dk}')">${DAY_ABBR[dk]}</button>`;
  });
  h+=`</div>`;

  // Fields for the selected day
  h+=`<div class="nutfields">`;
  NUTRI_FIELDS.forEach(f=>{
    const v=dayData[f.k]||"";
    h+=`<div class="nutrow"><label class="nutlbl">${f.label}</label>`;
    h+=`<span class="nutinput"><input type="text" inputmode="numeric" maxlength="5" value="${v}" placeholder="0" onchange="setNutri('${day}','${f.k}',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')"><span class="nutunit">${f.unit}</span></span></div>`;
  });
  h+=`</div>`;
  h+=`</div>`;
  return h;
}

function renderMetrics(){
  const v=document.getElementById("view-metrics");
  const wk=state.week;
  const wkObj=curWeek();
  let h="";
  h+=`<div class="mheader">Week ${wk} · ${wkObj.dates}</div>`;

  // ── NUTRITION ──
  h+=renderNutrition(wk);

  // ── DAILY CARDIO GOAL (105 min = 1h 45m) ──
  // Week-by-day minutes + per-type totals from the new cardio entries (checked only)
  let weekTot=0; const weekByType={LISS:0,MISS:0,HIIT:0,SIT:0};
  const perDay={};
  DAY_KEYS.forEach(d=>{
    const dm=dayCardioMinutes(wk,d); perDay[d]=dm; weekTot+=dm;
    const bt=dayCardioByType(wk,d); CARDIO_TYPES.forEach(t=>weekByType[t]+=bt[t]);
  });
  const weekGoal=DAILY_CARDIO_GOAL*7;
  h+=`<div class="mcard">`;
  h+=`<div class="mcard-h">Cardio Minutes <span class="mcard-goal">goal 1h 45m/day</span></div>`;
  // per-day bars vs 105
  h+=`<div class="msub">BY DAY</div>`;
  DAY_KEYS.forEach(d=>{
    const dm=perDay[d]; const dp=Math.min(100,Math.round(dm/DAILY_CARDIO_GOAL*100)); const dhit=dm>=DAILY_CARDIO_GOAL;
    h+=`<div class="mdayrow"><span class="mday">${DAY_ABBR[d]}</span>`;
    h+=`<div class="mcatbar"><div class="mcatbar-fill ${dhit?'liss':'miss'}" style="width:${dp}%"></div></div>`;
    h+=`<span class="mdayval ${dhit?'g':''}">${dm}</span></div>`;
  });
  // per-type weekly totals
  h+=`<div class="msub">BY TYPE · this week</div>`;
  CARDIO_TYPES.forEach(c=>{
    const val=weekByType[c];
    h+=`<div class="mcatrow">`;
    h+=`<span class="catbadge ${c.toLowerCase()}">${c}</span>`;
    h+=`<span class="mcathr">${HR_ZONES[c]} bpm</span>`;
    h+=`<div class="mcatbar"><div class="mcatbar-fill ${c.toLowerCase()}" style="width:${Math.min(100,weekTot>0?val/Math.max(weekTot,1)*100:0)}%"></div></div>`;
    h+=`<span class="mcatval">${val} min</span>`;
    h+=`</div>`;
  });
  h+=`</div>`;

  // ── NEAT STEPS ──
  const wkSteps=weekSteps(wk);
  const spct=Math.min(100,Math.round(wkSteps/STEP_GOAL_WEEK*100));
  const shit=wkSteps>=STEP_GOAL_WEEK;
  h+=`<div class="mcard ${shit?'neathit':''}">`;
  h+=`<div class="mcard-h"><span class="catbadge neat">NEAT</span></div>`;
  h+=`<div class="mbig"><span class="steps-num">${wkSteps.toLocaleString()}</span> <span class="munit">/ ${STEP_GOAL_WEEK.toLocaleString()} steps</span></div>`;
  h+=`<div class="mbar"><div class="mbar-fill steps" style="width:${spct}%"></div></div>`;
  h+=`<div class="mcap">${shit?'Weekly goal hit! 🎉':`${(STEP_GOAL_WEEK-wkSteps).toLocaleString()} steps to go`} · ${STEP_GOAL_DAY.toLocaleString()}/day target</div>`;

  // Per-day step input
  h+=`<div class="msub">LOG STEPS BY DAY</div>`;
  DAY_KEYS.forEach(dk=>{
    const st=daySteps(wk,dk);
    const dhit=st>=STEP_GOAL_DAY;
    h+=`<div class="mstepsrow">`;
    h+=`<span class="mday">${DAY_ABBR[dk]}</span>`;
    h+=`<span class="mstepsin"><input type="text" inputmode="numeric" maxlength="5" value="${st||''}" placeholder="0" onchange="setSteps('${dk}',this.value)" oninput="this.value=this.value.replace(/[^0-9]/g,'')"><span class="munit2">steps</span></span>`;
    h+=`<span class="mstepchk ${dhit?'on':''}">${dhit?'✓ 10k':''}</span>`;
    h+=`</div>`;
  });
  h+=`</div>`;

  v.innerHTML=h;
}
/* ═══ WEIGH-IN ═══
   state.weights["2026-11-16"] = 352.2   (one entry per calendar day)
   Day 1 = Nov 16, 2026. Start 352.2 lbs. Target pace 4.5 lb/wk → wedding Apr 16. */
const START_WEIGHT=352.2;
const WEIGH_START="2026-11-16";
const TARGET_RATE=4.5; // lb per week
const MILESTONES=[340,330,320,310,300,290,280,270,260,250];

function wDate(dstr){const [y,m,d]=dstr.split("-").map(Number);return new Date(y,m-1,d);}
function wYMD(dt){return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}
function weighEntries(){
  if(!state.weights) return [];
  return Object.keys(state.weights).filter(k=>state.weights[k]).map(k=>({date:k,w:parseFloat(state.weights[k])})).sort((a,b)=>a.date<b.date?-1:1);
}
function latestWeight(){const e=weighEntries();return e.length?e[e.length-1]:null;}
function setWeight(dstr,val){
  if(!state.weights) state.weights={};
  const n=parseFloat(val);
  if(!n||n<=0) delete state.weights[dstr];
  else state.weights[dstr]=Math.round(n*10)/10;
  save(); renderWeigh();
}
function weekDates(wkNum){
  const wk=WEEKS.find(w=>w.wk===wkNum); if(!wk) return [];
  const base=wDate(wk.start);
  return DAY_KEYS.map((_,i)=>{const d=new Date(base);d.setDate(d.getDate()+i);return wYMD(d);});
}
function weekAvgWeight(wkNum){
  const ds=weekDates(wkNum);
  const vals=ds.map(d=>state.weights&&state.weights[d]?parseFloat(state.weights[d]):null).filter(v=>v!=null);
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10;
}
function targetWeightOn(dstr){
  const days=(wDate(dstr)-wDate(WEIGH_START))/86400000;
  return Math.round((START_WEIGHT-(TARGET_RATE/7)*days)*10)/10;
}
function fmtShort(dstr){const dt=wDate(dstr);const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return `${MON[dt.getMonth()]} ${dt.getDate()}`;}

function renderWeigh(){
  const v=document.getElementById("view-weigh");
  const entries=weighEntries();
  const latest=latestWeight();
  const cur=latest?latest.w:START_WEIGHT;
  const lost=Math.round((START_WEIGHT-cur)*10)/10;
  let h="";

  // Headline
  h+=`<div class="wcard">`;
  h+=`<div class="wbignum">${cur.toFixed(1)}<span class="wunit">lbs</span></div>`;
  h+=`<div class="wsub">${lost>0?`▼ ${lost.toFixed(1)} lbs lost`:(lost<0?`▲ ${Math.abs(lost).toFixed(1)} lbs up`:'at start weight')} · from ${START_WEIGHT} start</div>`;
  if(latest){
    const tgt=targetWeightOn(latest.date);
    const diff=Math.round((cur-tgt)*10)/10;
    const onPace=diff<=0;
    h+=`<div class="wpace ${onPace?'ahead':'behind'}">${onPace?'✓ On/ahead of pace':'△ Behind pace'} · target ${tgt.toFixed(1)} by ${fmtShort(latest.date)}</div>`;
  }
  h+=`</div>`;

  // Milestones
  h+=`<div class="wcard">`;
  h+=`<div class="mcard-h">Milestones</div>`;
  h+=`<div class="wmiles">`;
  MILESTONES.forEach(ms=>{
    const hit=cur<=ms;
    h+=`<div class="wmile ${hit?'hit':''}"><span class="wmtick">${hit?'✓':''}</span><span class="wmval">${ms}</span></div>`;
  });
  h+=`</div>`;
  h+=`<div class="wmilehint">4.5 lb/wk target pace → ~${targetWeightOn("2027-04-16").toFixed(0)} lbs by the wedding</div>`;
  h+=`</div>`;

  // Log by training week
  h+=`<div class="wcard">`;
  h+=`<div class="mcard-h">Log · Week ${state.week}</div>`;
  const ds=weekDates(state.week);
  ds.forEach((dstr,i)=>{
    const val=state.weights&&state.weights[dstr]?state.weights[dstr]:"";
    const dt=wDate(dstr);
    const isToday=dstr===todayYMD();
    let chg="";
    if(val!==""){
      const prev=entries.filter(e=>e.date<dstr).pop();
      if(prev){const d=Math.round((val-prev.w)*10)/10; chg=`<span class="wchg ${d<0?'dn':(d>0?'up':'')}">${d>0?'+':''}${d.toFixed(1)}</span>`;}
    }
    h+=`<div class="wrow ${isToday?'today':''}">`;
    h+=`<span class="wrow-day">${DAY_ABBR[DAY_KEYS[i]]}<span class="wrow-date">${dt.getMonth()+1}/${dt.getDate()}</span></span>`;
    h+=`<span class="wrow-in"><input type="text" inputmode="decimal" value="${val}" placeholder="—" onchange="setWeight('${dstr}',this.value)" oninput="this.value=this.value.replace(/[^0-9.]/g,'')"><span class="wrow-u">lbs</span></span>`;
    h+=`${chg||'<span class="wchg"></span>'}`;
    h+=`</div>`;
  });
  const avg=weekAvgWeight(state.week);
  h+=`<div class="wavgrow"><span>Weekly average</span><span class="wavgval">${avg!=null?avg.toFixed(1)+' lbs':'—'}</span></div>`;
  h+=`</div>`;

  v.innerHTML=h;
}

function renderData(){
  const v=document.getElementById("view-data");
  let html=`<div class="section-title">Cloud Account</div>`;
  html+=authPanelHTML();
  html+=`<div class="section-title">Backup & Restore</div>`;
  html+=`<div class="hint">Cloud sync keeps your phone and desktop in step. This export is a manual local backup you can also keep as a safety copy.</div>`;
  html+=`<button class="databtn" onclick="exportData()">⬆ Export Data (copy backup)</button>`;
  html+=`<button class="databtn" onclick="document.getElementById('impbox').style.display='block'">⬇ Import Data (restore)</button>`;
  html+=`<div id="impbox" style="display:none;margin-top:10px"><textarea class="data" id="imptext" placeholder="Paste backup here…"></textarea><button class="databtn" onclick="importData()" style="margin-top:8px">Restore from text</button></div>`;
  html+=`<div id="expbox" style="display:none;margin-top:10px"><textarea class="data" id="exptext" readonly></textarea><div class="hint">Copy all text above and save it somewhere safe.</div></div>`;
  html+=`<div class="section-title">Fasting Settings</div>`;
  html+=`<div class="hint">Fast length per week type (hours). The app warns if a fast's full day lands on — or the day before — a lift. Diet-break weeks are 0 (no fasts).</div>`;
  html+=`<div class="fastlen-grid">`;
  [["standard","Standard"],["sprint","Sprint"],["dietbreak","Diet break"]].forEach(([k,lbl])=>{
    html+=`<div class="fastlen-row"><span class="fastlen-lbl">${lbl}</span><input type="number" min="0" max="96" class="fastlen-in" value="${fastLenFor(k)}" onchange="setFastLen('${k}',this.value)"><span class="fastlen-unit">hr</span></div>`;
  });
  html+=`</div>`;
  html+=`<div class="section-title">Reset</div>`;
  html+=`<button class="databtn danger" onclick="resetData()">⚠ Erase all data</button>`;
  v.innerHTML=html;
}
function exportData(){const b=document.getElementById("expbox");const t=document.getElementById("exptext");t.value=JSON.stringify(state);b.style.display="block";t.select();try{document.execCommand("copy");toast("✓ Copied");}catch(e){toast("Select & copy");}}
function importData(){const t=document.getElementById("imptext").value.trim();if(!t){toast("Paste backup first");return;}try{const d=JSON.parse(t);state=Object.assign({week:1,day:"mon",logs:{},notes:{},completed:{},notesOpen:{},plan:{},titles:{},wknotes:{},prs:{},restingHR:[],exDone:{},nutrition:{},cardioEntries:{},steps:{},weights:{},editMode:false},d);save();toast("✓ Restored");renderLog();}catch(e){toast("⚠ Invalid backup");}}
function resetData(){if(confirm("Erase ALL data? Export a backup first if unsure.")){state={week:1,day:"mon",logs:{},notes:{},completed:{},notesOpen:{},plan:{},titles:{},wknotes:{},prs:{},restingHR:[],exDone:{},nutrition:{},cardioEntries:{},steps:{},weights:{},editMode:false};save();toast("Erased");renderLog();renderData();}}

/* ─── TABS ─────────────────────────────────────────────── */
document.querySelectorAll(".tabbar button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".tabbar button").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    const tab=btn.dataset.tab;
    ["log","progress","metrics","weigh","data"].forEach(t=>{document.getElementById("view-"+t).style.display=t===tab?"block":"none";});
    if(tab==="progress")renderProgress();
    if(tab==="metrics")renderMetrics();
    if(tab==="weigh")renderWeigh();
    if(tab==="data")renderData();
  };
});

/* ─── JUMP TO TODAY ────────────────────────────────────── */
function todayYMD(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
/* Find the week + day matching today's real date. Returns null if outside the plan. */
function resolveToday(){
  const t=todayYMD();
  for(const w of WEEKS){
    for(let i=0;i<7;i++){
      const [y,m,d]=w.start.split("-").map(Number);
      const dt=new Date(y,m-1,d+i);
      const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      if(ds===t) return {week:w.wk, day:DAY_ORDER[i]};
    }
  }
  return null;
}
/* Set state to today if in range; clamp to plan bounds if outside. */
function jumpToToday(silent){
  const hit=resolveToday();
  if(hit){
    state.week=hit.week; state.day=hit.day; save();
    if(!silent) toast("📅 Jumped to today");
    renderLog(); window.scrollTo(0,0);
    return true;
  }
  if(!silent){
    const t=todayYMD();
    const first=WEEKS[0].start;
    const lastW=WEEKS[WEEKS.length-1];
    if(t<first){ state.week=1; state.day="mon"; toast("Plan starts Jul 6 — showing Week 1"); }
    else { state.week=lastW.wk; state.day="sun"; toast("Past plan end — showing final week"); }
    save(); renderLog(); window.scrollTo(0,0);
  }
  return false;
}

/* Live countdown to the wedding */
const WEDDING_DATE="2027-04-16";
const PLAN_START="2026-11-16";
function updateHeroCountdown(){
  const el=document.getElementById("heroSub");
  const [y,m,d]=WEDDING_DATE.split("-").map(Number);
  const wedding=new Date(y,m-1,d);
  const [sy,sm,sd]=PLAN_START.split("-").map(Number);
  const start=new Date(sy,sm-1,sd);
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const days=Math.round((wedding-today)/86400000);
  if(el){
    let out="April 16, 2027";
    if(days>0) out+=` · ${days} day${days!==1?'s':''} out`;
    else if(days===0) out+=` · Today! 🎉`;
    else out+=` · wedding day passed`;
    el.textContent=out;
  }
  // progress bar: how far from start → wedding
  const bar=document.getElementById("heroBarFill");
  if(bar){
    const total=(wedding-start)/86400000;
    const done=(today-start)/86400000;
    const pct=Math.max(0,Math.min(100,Math.round(done/total*100)));
    bar.style.width=pct+"%";
  }
}

load();
updateHeroCountdown();
// Always open to today's week + day on app open. If today is outside the plan range,
// clamp to the nearest end so the app still lands somewhere sensible.
(function openToToday(){
  const hit=resolveToday();
  if(hit){ state.week=hit.week; state.day=hit.day; }
  else {
    const t=todayYMD();
    if(t<WEEKS[0].start){ state.week=1; state.day="mon"; }
    else { const lw=WEEKS[WEEKS.length-1]; state.week=lw.wk; state.day="sun"; }
  }
  save();
})();
renderLog();
// Bring up cloud sync last — restores a session if signed in, else stays local.
initSupabase();
</script>
